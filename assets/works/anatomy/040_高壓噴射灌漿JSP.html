6 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>作動中的機具：鑽機動力頭、高壓泵；紅圈＝施作中柱位</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>虛線圓＝待施作柱位；灰圓＝已完成的改良柱</span></span><span class="iso-caption">沿連續壁長向剖開的開挖區：兩道連續壁尚未開挖，壁底仍在透水的粉土質細砂層中，故先在開挖底面下方做一層 JSP 底部改良塊，用來止水並抵抗下方水壓。二重管（內管送水泥漿、外管送壓縮空氣）先以水鑽進到改良段底部，上段只鑽不噴；到底後噴嘴射出高壓漿液，外圍空氣包覆使射流射得更遠，切削土體並與漿液拌合。鑽桿一邊旋轉一邊緩慢提升，形成圓柱狀改良體，多餘的漿土混合物沿鑽桿與孔壁間隙回流到地表，經排泥溝抽到排泥槽處理。各柱中心距小於柱徑，相鄰柱互相重疊、與連續壁密接，連成整片改良塊；開挖到塊頂時，下方水壓被擋住，坑底不致湧水或隆起。圖中柱徑 φ1.6 m、改良段深度、噴漿壓力約 20 MPa、空氣 0.7 MPa、轉速與動畫速度均為示意，實際依設計圖說與現場試驗柱結果；高壓噴射期間須監測鄰近結構物與地表隆起。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
