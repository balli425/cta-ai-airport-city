">地下水位</text></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅＝運轉中的機具（鑽機、旋噴機、千斤頂、挖土機）與地下水流向；藍色粗帶＝湧入坑內的水、紅褐顆粒＝被帶出的砂</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>藍色虛線：地下水位（GL −2 m，示意）；淡藍＝地下水位以下的飽和土層；半透明土塊＝尚未開挖的土方</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>深藍標籤＝目前步驟的構件，編號小圓點＝之前步驟已完成的構件（編號同步驟）</span></span><span class="iso-caption">沿開挖線剖開的擋土壁（深度方向壓縮繪製，刻度每格 1 m；樁徑、樁距、CCP 樁徑、樁長、開挖深度、地下水位、支撐層數與地層皆為示意）。角色分工：排樁擋土、CCP 止水。預壘樁一支支施作成排，承受背側土壓；但相鄰樁之間有間隙，地下水與砂土會從間隙流進開挖面。因此在每道間隙的背土側以 CCP 旋噴形成止水樁，與兩側樁身重疊把間隙封住。樁頂以壓頂梁連成一體，開挖時分階挖到各層支撐下方，架設圍囹與水平支撐並以千斤頂預壓後再往下挖。對照中，若間隙未止水，地下水挾帶砂土湧入坑內（湧水湧砂），背側土壤流失會造成地表下陷、危及鄰房；有 CCP 時坑內保持乾燥。樁徑與樁距、CCP 樁徑與深度、灌漿壓力與配比、支撐配置與預壓力皆依設計圖說辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {

const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

    const out = [];
    for (const [cx, cy, start] of corners) {

function signedArea(points) {
