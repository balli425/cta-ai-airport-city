</style><script>(()=>{const S=[{"name":"危害：夾角越大張力越大","desc":"同樣的吊物，二條吊索張得越開，每條吊索要出的力就越大。"},{"name":"夾角與張力","desc":"夾角 30°、60°、90°、120°，張力係數 1.04、1.15、1.41、2.00（示意）。"},{"name":"✕ 夾角過大","desc":"吊索太短、張得太開，張力倍增又向內擠壓吊物，吊索斷裂。"},{"name":"✕ 長料單點吊","desc":"長料只用一條吊索吊在中間，重心稍偏就傾斜，材料滑出掉落。"},{"name":"✓ 兩點吊・60° 以內","desc":"選夠長的吊索、兩點吊掛，吊索夾角控制在 60° 以內（示意）。"},{"name":"✓ 長料用吊梁","desc":"吊點距離大時改用吊梁，讓吊索垂直受力，張力不再放大。"},{"name":"✓ 束緊・護角・試吊","desc":"吊索繞兩圈束緊、銳角加護角；離地先暫停，確認水平再吊。"},{"name":"檢查重點","desc":"吊索夾角、捆縛方式與護角、重心位置與試吊，每次吊掛前確認。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
