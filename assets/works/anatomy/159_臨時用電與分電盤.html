</style><script>(()=>{const S=[{"name":"危害：感電・短路・起火","desc":"臨時電日曬雨淋、人人都去接，最容易漏電、短路和過載。"},{"name":"✕ 放地上・沒門蓋・泡水","desc":"分電盤放地上又沒門蓋，一積水帶電部位泡水，人踩水就感電。"},{"name":"✕ 一個開關接一堆","desc":"一個開關接好幾台、延長線串接、裸線塞插座：過載發熱起火。"},{"name":"✓ 架高・防雨・可上鎖","desc":"盤體架高、加防雨頂蓋，有門可上鎖，電纜從下方進出。"},{"name":"✓ 分路：一機一開關","desc":"總開關之後每台機具一個分路，各有漏電斷路器並標示用途。"},{"name":"✓ 接地・插頭插座","desc":"盤體金屬外殼接地；出線用插頭與插座連接，不可裸線直接塞。"},{"name":"檢查重點","desc":"上鎖並由專人管理，標示有電危險；每日巡視、每月測試漏電斷路器。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>

.org/2000/svg" class="iso-svg" viewBox="0 0 680 760" role="img" aria-label="工地臨時用電與分電盤：分電盤放在地上、沒有門蓋又泡在積水裡，人踩在水中碰觸就感電；一個開關接好幾台機具、延長線串接、裸線直接塞進插座會過載發熱起火；正確做法是分電盤架高、加防雨頂蓋、有門可上鎖，每一分路各有漏電斷路器並標示用途、一機一開關，盤體外殼接地，出線用插頭插座，並由專人管理、每日巡視、每月測試。"><g data-part="sc"><path d="M116.6 525.6L666 644.4L563.4 723L14 604.1Z" style="fill:hsl(36 10% 90%);fill-opacity:1;stroke:hsl(36 10% 48%);stroke-width:.6;stroke-linejoin:round"/><path d="M666 667.5L563.4 746L563.4 723L666 644.4Z" style="fill:hsl(36 10% 82%);fill-opacity:1;stroke:hsl(36 10% 48%);stroke-width:.6;stroke-linejoin:round"/><path d="M563.4 746L14 627.2L14 604.1L563.4 723Z" style="fill:hsl(36 10% 73%);fill-opacity:1;stroke:hsl(36 10% 48%);stroke-width:.6;stroke-linejoin:round"/><g><path class="wr-o" d="M125.6 454.9L125.6 559.4L245.5 598.8L298.9 616.2" style="stroke-width:6.04"/><path class="wr w-cab" d="M125.6 454.9L125.6 559.4L245.5 598.8L298.9 616.2" style="stroke-width:5.04"/></g><g><path class="wr-o" d="M384.3 634.7L448.4 633L497.3 632L499.3 615.1" style="stroke-width:5.62"/><path class="wr w-cab" d="M384.3 634.7L448.4 633L497.3 632L499.3 615.1" style="stroke-width:4.62"/><path class="wr-o" d="M362 629.9L396.9 643.2L532.8 666.8L542.6 646.6" style="stroke-width:5.62"/><path class="wr w-cab" d="M362 629.9L396.9 643.2L532.8 666.8L542.6 646.6" style="stroke-width:4.62"/><path class="wr-o" d="M339.8 625L349.5 650.4L447.4 673.1L453.4 666.7" style="stroke-width:5.62"/><path class="wr w-cab" d="M339.8 625L349.5 650.4L447.4 673.1L453.4 666.7" style="stroke-width:4.62"/></g><g class="tb c-pole"><path class="tb-o" d="M129.6 559.4L129.6 298.3" style="stroke-width:13.51"/><path class="tb-b" d="M129.6 559.4L129.6 298.3" style="stroke-width:12.61"/><path class="tb-h" d="M127.3 559.4L127.3 298.3" style="stroke-width:3.78"/></g><g class="tb c-pole"><path class="tb-o" d="M107.3 316.5L151.9 326.1" style="stroke-width:5.94"/><path class="tb-b" d="M107.3 316.5L151.9 326.1" style="stroke-width:5.04"/><path class="tb-h" d="M107.5 315.6L152.1 325.2" st 示意（電桿電表經電纜到分電盤，再分路到電焊機、抽水機與照明；分電盤略放大，鏡頭依步驟拉近）。常見災害：分電盤直接放在地面、沒有門蓋或被拆除，遇雨或積水時帶電部位泡水，人員踩在水中碰觸而感電；一個開關接多台機具、延長線串接、電線不用插頭而直接塞入插座，造成過載、接觸不良而發熱起火。分電盤應架高固定，屋外使用防雨型或加防雨頂蓋，設門並可上鎖，帶電部位不外露；總開關之後依機具分路，各分路設置適當容量的開關與漏電斷路器並標示用途，一機一開關；盤體金屬外殼接地，出線以插頭、插座或端子確實連接，電纜由下方進出並加以固定。臨時用電設備由指定的電氣人員裝設與管理，每日巡視、定期測試漏電斷路器，停用時切斷電源並上鎖。圖中高度與配置皆為示意，實際依職業安全衛生設施規則、用戶用電設備裝置規則、營造安全衛生設施標準、施工計畫與相關法規辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
