</style><script>(()=>{const S=[{"name":"澆置混凝土","desc":"布料機把混凝土澆入核心筒牆模內；升降機同時把材料從地面運上樓。"},{"name":"拆模後退","desc":"混凝土達脫模強度後，大模板隨台車往外退約 0.7 m，離開牆面。"},{"name":"安裝爬靴","desc":"在剛澆好的牆上預埋件鎖上新爬靴，作為下一次爬升的支點。"},{"name":"液壓提升導軌","desc":"平台不動，液壓缸分次伸出，把爬升導軌往上頂 4.2 m 掛進新爬靴。"},{"name":"液壓爬升平台","desc":"改以導軌為反力，液壓缸反覆伸縮、棘爪交替卡住，整組平台與模板爬升一層。"},{"name":"綁紮鋼筋","desc":"在上層平台綁紮下一層牆筋；下方修飾平台拆回最底的舊爬靴再利用。"},{"name":"合模","desc":"大模板推回牆面定位、鎖緊對拉螺栓，完成下一層的模板。"},{"name":"待澆置下一層","desc":"檢查模板與鋼筋後即可澆置；整個循環不需塔吊，約 3–5 天一層。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
