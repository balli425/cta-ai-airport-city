.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

    const phase = (tt * 5) % 4.2;
    MEM.forEach((m, i) => {
      if (m.kind === "top" || m.kind === "bot" || !memVis(m)) return;
      const A = P2(m.a, m), B = P2(m.b, m);
      out.push(bar(A, B, 0, 0.9, 0.7, cls(m, i), "hi"));
    });
    MEM.forEach((m, i) => {
      if (!(m.kind === "top" || m.kind === "bot") || !memVis(m)) return;
      const A = P2(m.a, m), B = P2(m.b, m);
      out.push(bar(A, B, 0, 1.7, 1.4, cls(m, i), "hi"));
    });
    // 節點板＋螺栓
    const gus = [];
    NODES.forEach((_, i) => {
      const ms = MEM.filter((m) => (m.a === i || m.b === i) && memVis(m));
      if (!ms.length) return;
      const [x, z] = P2(i, ms[0]);
      const top = i > NP;
      const z0 = top ? z - 3.8 : z + 1.4, z1 = top ? z - 1.4 : z + 3.8;
      gus.push(boxW(x - 2.4, x + 2.4, 1.75, 2.05, z0, z1, "m-stl", "mid", dots([[x - 1.2, 2.06, (z0 + z1) / 2], [x + 1.2, 2.06, (z0 + z1) / 2]], 0.32)));
    });
    out.push(...gus);
    // 續接板（節點 3、5 的上下弦）
    const spl = prog(tt, T.spl);
    if (tt >= T.spl[0]) for (const j of TOW) for (const top of [0, 1]) {
      const i = top ? NP + 1 + j : j, [x, z] = pos[i];
      const nb = Math.floor(spl * 8.99);
      const bolts = [];
      for (let q = 0; q < 8; q++) if (q < nb || tt >= T.spl[1]) bolts.push([x - 4.2 + (q % 4) * 2.8, 2.25, z + (q < 4 ? 0.6 : -0.6)]);
      const flash = tt < T.spl[1] ? "m-splice" : "m-stl";
      out.push(boxW(x - 5.4, x + 5.4, 2.1, 2.4, z - 1.3, z + 1.3, flash, "mid", dots(bolts, 0.38)));
    }
    // 力流（虛線流動）
    if (showF) MEM.forEach((m, i) => {
      const n = TOT.N[i];
      if (Math.abs(n) < 0.03 * NMAX) return;
      const A = pos[m.a], B = pos[m.b], M = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
      const y = m.kind === "top" || m.kind === "bot" ? 2.45 : 1.0;
      const w = (0.6 + 1.0 * Math.abs(n) / NMAX).toFixed(2);
      const st = 'style="stroke-width:' + w + ';stroke-dashoffset:' + (-phase).toFixed(2) + '"';
      const c = n < 0 ? "fl-c" : "fl-t";
      const pr = n < 0 ? [[A, M], [B, M]] : [[M, A], [M, B]];
      for (const [p, q] of pr) flows.push('<path class="' + c + '" ' + st + ' d="' + pathOf([at([p[0], y, p[1]]), at([q[0], y, q[1]])]) + '"/>');
    });
    out.push(...flows);
    // 屋頂載重箭頭
    if (tt >= T.load[0]) {
      const a = ease(prog(tt, T.load) * 2.5);
      for (let j = 0; j <= NP; j++) {
        const [x, z] = pos[NP + 1 + j], h = (j === 0 || j === NP ? 5 : 9) * a;
        if (h > 0.5) out.push(arrow([x, 1.2, z + 4 + h], [x, 1.2, z + 3.8], "ld", 1.3));
      }
    }
    // 吊鉤、吊梁、吊索
    for (const s of [0, 2, 1]) {
      const L = segL[s];
      if (!L || !L.hook) continue;
      const jA = s === 0 ? 0 : s === 1 ? 3 : 5, jB = s === 0 ? 3 : s === 1 ? 5 : 8;
      const pA = [pos[NP + 1 + jA][0] + L.dx + (s === 0 ? 4 : 0), pos[NP + 1 + jA][1] + L.dz], pB = [pos[NP + 1 + jB][0] + L.dx - (s === 2 ? 4 : 0), pos[NP + 1 + jB][1] + L.dz];
      const cx = (pA[0] + pB[0]) / 2, up = L.hook.up, zs = ZT + L.dz + 13 + up;
      const half = Math.min(18, (pB[0] - pA[0]) / 2 - 2);
      let sl = "";
      if (L.hook.slack < 1) for (const p of [pA, pB]) {
        const ex = p[0] < cx ? cx - half : cx + half;
        sl += pathOf([at([ex, 0, zs - 0.6]), at([p[0], 0, p[1] + 1.4 + L.hook.slack * 6])]);
      }
      out.push('<path class="sling" d="' + sl + '"/>');
      out.push(boxW(cx - half - 1, cx + half + 1, -0.9, 0.9, zs - 0.6, zs + 1.2, "m-hook", "mid"));
      out.push('<path class="sling" d="' + pathOf([at([cx - half, 0, zs + 1.2]), at([cx, 0, zs + 8]), at([cx + half, 0, zs + 1.2])]) + '"/>');
      for (let q = 0; q < 5; q++) out.push('<path class="cable" style="opacity:' + (1 - q * 0.2).toFixed(2) + '" d="' + pathOf([at([cx - 0.6, 0, zs + 13 + q * 5]), at([cx - 0.6, 0, zs + 18 + q * 5])]) + pathOf([at([cx + 0.6, 0, zs + 13 + q * 5]), at([cx + 0.6, 0, zs + 18 + q * 5])]) + '"/>');
      out.push(boxW(cx - 2, cx + 2, -1.6, 1.6, zs + 9.5, zs + 14, "m-hook", "hi", dots([[cx, 1.6, zs + 12.6]], 0.6)));
      out.push('<path class="cable" style="stroke-width:1.4" d="' + pathOf([[cx, 0, zs + 9.5], [cx, 0, zs + 8.4], [cx + 1.2, 0, zs + 7.6], [cx + 0.6, 0, zs + 6.8], [cx - 0.4, 0, zs + 7.4]].map(at)) + '"/>');
    }
    live.innerHTML = out.join("");
    if (window.ctaStep) window.ctaStep(step);
    // 讀數
    const dm = Math.abs(SW.u[2 * midB + 1] * rel + (TOT.u[2 * midB + 1] - SW.u[2 * midB + 1]) * ld);
    let text = "";
    if (step <= 4) text = ["支撐架就位", "吊裝左段", "吊裝右段", "中段嵌入", "續接鎖固"][step] + " · 由臨時支撐架承載 · 中央撓度 0 mm";
    else if (step === 5) text = "解除支撐 · 自重撓度 δ = " + dm.toFixed(0) + " mm" + (dm > 0.5 ? "（L/" + Math.round(40000 / dm) + "）" : "");
    else {
      const cMax = Math.min(...TOT.N.filter((_, i) => MEM[i].kind === "top")), tMax = Math.max(...TOT.N.filter((_, i) => MEM[i].kind === "bot"));
      text = "δ = " + dm.toFixed(0) + " mm（L/" + Math.round(40000 / Math.max(dm, 0.1)) + "）· 上弦 −" + Math.round(Math.abs(cMax) * ld) + " kN 壓 · 下弦 +" + Math.round(tMax * ld) + " kN 拉";
      if (step === 7) text = "ΔT " + (temp >= 0 ? "+" : "−") + Math.abs(temp * 30).toFixed(0) + " °C · 滑動端 " + (temp >= 0 ? "+" : "−") + Math.abs(temp * 14.4).toFixed(1) + " mm · δ = " + dm.toFixed(0) + " mm";
    }
    if (readout.textContent !== text) readout.textContent = text;
    stage.setAttribute("aria-valuetext", text);
    stage.setAttribute("aria-valuenow", tt.toFixed(1));
  }

  let t = 0, last = 0, frameId = 0, visible = false, playing = !still.matches, manual = false, idle = 0;
  const render = () => draw(t);
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
    last = now;
    if (playing && !manual) t = (t + dt) % TOUR;
    render();
    frameId = visible && playing && !manual ? requestAnimationFrame(tick) : 0;
  }
  const run = () => { if (!frameId && visible && playing && !manual) { last = 0; frameId = requestAnimationFrame(tick); } };
  const hold = () => { manual = true; clearTimeout(idle); idle = setTimeout(() => { manual = false; run(); }, 6000); };
  new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) { render(); run(); } }, { rootMargin: "120px 0px" }).observe(stage);
  stage.addEventListener("pointermove", (ev) => {
    if (ev.pointerType === "touch") return;
    const bb = svgEl.getBoundingClientRect(), s = Math.max(0, Math.min(1, ((ev.clientX - bb.left) / bb.width - 0.08) / 0.84));
    hold(); t = s * TOUR * 0.999; render();
  });
  stage.addEventListener("keydown", (ev) => {
    if (ev.key === " ") { ev.preventDefault(); playing = !playing; manual = false; clearTimeout(idle); render(); run(); return; }
    if (ev.key === "ArrowRight" || ev.key === "ArrowUp") { ev.preventDefault(); hold(); t = (t + 0.5) % TOUR; render(); }
    if (ev.key === "ArrowLeft" || ev.key === "ArrowDown") { ev.preventDefault(); hold(); t = (t - 0.5 + TOUR) % TOUR; render(); }
    if (ev.key === "Home") { ev.preventDefault(); hold(); t = 0; render(); }
  });
  if (still.matches) t = 29;
  const q0 = new URLSearchParams(location.search).get("t");
  if (q0 !== null) { t = +q0; playing = false; }
  render(); run();
})();</script></body></html>
