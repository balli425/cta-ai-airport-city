.iso .nt{font:700 12px "Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:calc(12px / var(--z,1));fill:#174e75;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.iso .nt.red{fill:hsl(6 58% 40%)}
.iso .dim{fill:none;stroke:#174e75;stroke-width:1.1}

.iso .wheel{fill:hsl(212 10% 24%);stroke:hsl(212 12% 12%);stroke-width:.8;stroke-linejoin:round}
.iso .hub{fill:hsl(42 14% 72%);stroke:hsl(42 14% 32%);stroke-width:.6}
.iso .glass{fill:hsl(205 30% 34%);fill-opacity:.82;stroke:hsl(205 30% 20%);stroke-width:.6;stroke-linejoin:round}
.iso .sheave{fill:hsl(212 8% 76%);stroke:hsl(212 14% 28%);stroke-width:.8}
.iso .wire{fill:none;stroke:hsl(212 14% 26%);stroke-linecap:round;stroke-linejoin:round;vector-effect:none}
.iso .w-hot{stroke:hsl(6 60% 44%)}
.iso .sling{fill:none;stroke:hsl(34 50% 36%);stroke-linecap:round;stroke-linejoin:round;vector-effect:none}
.iso .tagline{fill:none;stroke:hsl(205 46% 36%);stroke-linecap:round;vector-effect:none}
.iso .hookp{fill:none;stroke:hsl(40 40% 30%);stroke-linecap:round;vector-effect:none}
.iso .hookp.hk-hot{stroke:hsl(6 58% 40%)}
.iso .tr path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:none}
.iso .tr .tr-d{stroke:hsl(42 44% 46%)}.iso .tr .tr-o{stroke:hsl(42 50% 28%)}.iso .tr .tr-c{stroke:hsl(42 58% 60%)}
.iso .tr.c-frame .tr-d{stroke:hsl(205 30% 42%)}.iso .tr.c-frame .tr-o{stroke:hsl(205 36% 24%)}.iso .tr.c-frame .tr-c{stroke:hsl(205 34% 58%)}
.iso .tr.c-grey .tr-d{stroke:hsl(212 8% 52%)}.iso .tr.c-grey .tr-o{stroke:hsl(212 10% 30%)}.iso .tr.c-grey .tr-c{stroke:hsl(212 8% 70%)}
.iso g.hot .tr .tr-d{stroke:hsl(6 50% 44%)}.iso g.hot .tr .tr-o{stroke:hsl(6 52% 28%)}.iso g.hot .tr .tr-c{stroke:hsl(6 54% 54%)}
.iso .tr-c2{fill:none;stroke:hsl(42 52% 44%);stroke-linecap:round;vector-effect:none}
.iso .cone{fill:hsl(18 70% 56%);stroke:hsl(14 56% 32%);stroke-width:.8;stroke-linejoin:round}
.iso .coneband{fill:#fff;stroke:none}
.iso .zone{fill:hsl(205 60% 40%);fill-opacity:.07;stroke:#174e75;stroke-width:1.6;stroke-dasharray:7 5}
@media (max-width:560px){.is-chk .cl-tag{display:none!important}.is-chk .cl-lead{display:none}.iso .nt{display:none}.iso .nt.chk{display:inline;font-size:calc(11.5px * var(--m,1) / var(--z,1));stroke-width:2.4px}}
.iso .zone-x{fill:hsl(6 60% 46%);fill-opacity:.1;stroke:hsl(6 60% 46%);stroke-width:1.6;stroke-dasharray:7 5}


.iso .s-hot{stroke:hsl(6 60% 44%)}
.iso .chainl{fill:none;stroke:hsl(212 10% 30%);stroke-dasharray:2.4 1.6;vector-effect:none}

.iso-stage svg{overflow:hidden;-webkit-mask:linear-gradient(to right,transparent 254px,#000 268px) 0 44px/100% 236px no-repeat,linear-gradient(to top,transparent 40px,#000 58px) 0 280px/100% calc(100% - 280px) no-repeat;mask:linear-gradient(to right,transparent 254px,#000 268px) 0 44px/100% 236px no-repeat,linear-gradient(to top,transparent 40px,#000 58px) 0 280px/100% calc(100% - 280px) no-repeat}@media (max-width:560px){.iso-stage svg{-webkit-mask:none;mask:none}}

const ELEVATION = 30;
