.iso .grom{fill:hsl(212 10% 24%);stroke:hsl(40 20% 90%);stroke-width:.6}
.iso .screw{fill:hsl(212 12% 34%)}.iso .screw.on{fill:hsl(6 56% 44%)}
.iso .joint1{stroke:hsl(6 52% 50%);fill:none;stroke-linecap:round}
.iso .joint2{stroke:#174e75;fill:none;stroke-linecap:round;stroke-dasharray:3 2}
.iso .mud{fill:hsl(40 18% 95%);stroke:hsl(36 10% 78%);stroke-width:.4}
.iso .tape{fill:hsl(36 30% 80%);stroke:none}.iso .tape.on{fill:hsl(6 40% 60%)}
.pl rect{fill:color-mix(in srgb,var(--anatomy-card) 92%,transparent);stroke:hsl(214 14% 70%);stroke-width:.8}
.pl text{font:600 11px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:hsl(214 14% 40%)}
.pl.on rect{fill:#174e75;stroke:#174e75}.pl.on text{fill:#fff}
.pl-line{stroke:hsl(214 14% 66%);stroke-width:.6;fill:none}.pl-line.on{stroke:#174e75;stroke-width:1.1}
.pl-dot{fill:hsl(214 14% 60%)}.pl-dot.on{fill:#174e75}
.snd-bg{fill:color-mix(in srgb,var(--anatomy-card) 95%,transparent);stroke:hsl(214 14% 72%);stroke-width:1}
.snd-t{font:700 13px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#174e75}
.snd-n{font:600 11px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:hsl(214 14% 34%)}
.snd-f{font:500 9.5px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:hsl(214 10% 50%)}
.snd-db{font:700 15px var(--anatomy-mono,monospace);fill:hsl(6 50% 44%)}.snd-db.good{fill:#174e75}
.spk{fill:hsl(212 12% 40%)}
.snd-b{fill:hsl(40 12% 88%);stroke:hsl(214 10% 46%);stroke-width:.8}
.snd-j{stroke:hsl(214 10% 46%);stroke-width:.6;fill:none}
.snd-ins{fill:hsl(44 42% 66%)}.snd-air{fill:hsl(40 10% 97%);stroke:hsl(214 10% 70%);stroke-width:.5;stroke-dasharray:2 2}
.snd-fib{fill:none;stroke:hsl(36 34% 44%);stroke-width:.7}
.wave{fill:none;stroke:hsl(6 52% 48%);stroke-width:5;stroke-linecap:round}
.snd-s{font:600 10px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:hsl(214 10% 44%)}

    });
    // 門口：加立柱、門頂槽鐵、短柱、橫撐（第 2 步）
    const dIt = [
      { x: JAMB2[0], f: (q, m) => stud(JAMB2[0], 0.28, H - 0.28, 0, m, (1 - ease(q)) * 20) },
      { x: JAMB2[1], f: (q, m) => stud(JAMB2[1], 0.28, H - 0.28, 0, m, (1 - ease(q)) * 20) },
      { x: 100, f: (q, m) => nog(DOOR.x0 - 2.9, DOOR.x1 + 2.9, DOOR.h, m, 0, (1 - ease(q)) * 18, "down") },
      { x: CRIP, f: (q, m) => stud(CRIP, DOOR.h + 1.6, H - 0.28, 0, m, (1 - ease(q)) * 20) },
      { x: 80, f: (q, m) => nog(72.9, 87.2, DOOR.h + 0.8, m, (1 - ease(q)) * 18) + nog(54.9, 71.1, 54, m, (1 - ease(q)) * 18) },
      { x: 136, f: (q, m) => nog(128.8, 143.1, DOOR.h + 0.8, m, (1 - ease(q)) * 18) + nog(144.9, 161.1, 54, m, (1 - ease(q)) * 18) },
    ];
    dIt.forEach((it, i) => {
      const q = part(st, 2, i, dIt.length);
      if (q <= 0) return;
      const act = st.step === 2 && q < 1;
      items.push({ x: it.x, d: () => it.f(q, act ? "act" : (i >= 4 ? "nog" : "stud")) + (act ? arrow([it.x, 24, i === 2 ? DOOR.h + 12 : i >= 4 ? 70 : 60], [it.x, 6, i === 2 ? DOOR.h + 12 : i >= 4 ? 70 : 60], 2.4) : "") });
    });
    // 電管（第 3 步）：由左端穿過立柱孔，到開關盒
    const cq = part(st, 3, 0, 1);
    if (cq > 0) {
      // 路徑：由上方樓板下來（第一格內），轉水平穿過立柱孔到開關盒
      const LV = H - 1.5 - ZC, LH = 76.2 - 9, len = (LV + LH) * ease(cq / 0.82);
      const act = st.step === 3;

      const sw = (1.5 * P.scale).toFixed(1);

      [[18, 36], [36, 54], [54, 72], [72, 76.2]].forEach(([a, b]) => {
        if (xe <= a) return;
        const e = Math.min(b, xe), g = at([a - FL / 2, 0.3, ZC]);

      });

        const up = ease((cq - 0.82) / 0.08);
        items.push({ x: 76.3, d: () => `<path class="${cls}" style="stroke-width:${sw}" d="${seg([76.2, 0.3, ZC], [76.2, 0.3, ZC + (BOX.z0 - ZC) * up])}"/>` });

      if (bq > 0) items.push({ x: 76.4, d: () => box(BOX.x0, -0.6 + (1 - bq) * 14, BOX.z0, BOX.x1, D / 2 - 0.05 + (1 - bq) * 14, BOX.z1, act && bq < 1 ? "act" : "jbox", { bevel: 0.3 }) });
      if (act && len < LV) items.push({ x: 9.2, d: () => arrow([9, 4, zv + 16], [9, 4, zv - 2], 2.6) });
      else if (act && xe < 76.2) items.push({ x: xe + 0.2, d: () => arrow([xe - 14, 0.3, ZC + 6], [xe + 4, 0.3, ZC + 6], 2.6) });

    if (st.step >= 6) {

  // ── 隔音比較小圖（第 8 步，螢幕座標）──

    "放樣彈線 · 天地槽鐵擊釘固定（上方樓板半透明示意）",
    "立柱 間距 45 cm（示意）· 插入後旋轉 90°",
    "門邊雙立柱 · 門頂槽鐵 · 短柱 · 橫撐",

const SC = makeScene(P);
const LOOP = SC.LOOP;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const narrow = matchMedia("(max-width:560px)");
