6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅＝危害部位、墜落與下滑路徑、運轉中的驅動機與這一步正在作動的裝置；✕ 錯誤、✓ 正確</span><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>土黃＝桅桿與驅動機、藍灰網＝搬器與層門、黃＝護欄、黃銅色圓筒＝防墜安全器（示意）</span></span><span class="iso-caption">施工電梯作業示意（以台灣工地常見的齒條齒輪式、附牆桅桿的人貨兩用施工電梯為例，法規用語為營建用升降機；鏡頭依步驟拉近）。常見災害：樓層停靠口的層門未設連鎖或被拆除、綁開，搬器不在該層時人員自開口墜落；超載或偏載使制動器無法保持而下滑；安全裝置失效時搬器墜落；以及搬器與構造物之間的夾擠。各樓層停靠口應設層門與護欄，層門與搬器門設連鎖裝置：搬器未停妥於該層時層門無法開啟，任一門未關妥時搬器無法啟動；搬器內外標示積載荷重與限乘人數，不得超載；搬器設防墜安全裝置（超速時咬住齒條）、上下極限開關與緊急停止裝置，桅桿依製造者規定附牆固定，底部設圍欄。由指定人員操作，每日作業前檢點，並依規定實施定期檢查。圖中樓高、尺寸、荷重與停止距離皆為示意，實際依起重升降機具安全規則、職業安全衛生設施規則、設備製造者規範、施工計畫與相關法規辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;

function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {

const tenth = (value) => {

function signedArea(points) {
