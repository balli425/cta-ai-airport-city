5" text-anchor="middle">峰值 72 dB</text></g><g class="xmark"><path d="M399.0 503.0l18 18M417.0 503.0l-18 18"/></g></g><g data-part="labels"><g class="ldot"><circle cx="559.5" cy="370.3" r="6.5"/><text x="559.5" y="373.5" text-anchor="middle">2</text></g><g class="ldot"><circle cx="613.0" cy="340.3" r="6.5"/><text x="613.0" y="343.5" text-anchor="middle">3</text></g><g class="ldot"><circle cx="460.7" cy="380.8" r="6.5"/><text x="460.7" y="384.0" text-anchor="middle">4</text></g><g class="ldot"><circle cx="439.1" cy="362.8" r="6.5"/><text x="439.1" y="366.0" text-anchor="middle">5</text></g><g class="ldot"><circle cx="431.3" cy="340.8" r="6.5"/><text x="431.3" y="344.0" text-anchor="middle">6</text></g><g class="lbl on"><line x1="192.3" y1="409.0" x2="202.3" y2="334.0"/><circle cx="192.3" cy="409.0" r="2.2"/><rect x="131.3" y="314.0" width="142.0" height="22" rx="11"/><circle class="lnum" cx="141.3" cy="325.0" r="6.5"/><text class="lnumt" x="141.3" y="328.2" text-anchor="middle">7</text><text x="211.3" y="329.6" text-anchor="middle">一般樓板（對照）</text></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅＝作動中與衝擊振動：鋪設中的捲材與面材、砂漿澆置軟管、落下的鋼球、振動傳遞路徑（移動虛線＋箭頭）與樓下聲波</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>各層前緣向後退縮成階梯剖切，每層頂面與厚度都看得見；薄層厚度放大示意。藍色短槓＝周邊隔音條隔斷振動</span><span class="iso-key"><svg class="iso-swatch" data-mark="green" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>樓下噪音計名牌顯示各自衝擊的峰值（峰值保持）：磚紅＝一般樓板（✕ 聲音大）、藍＝浮動地板（✓ 聲音小）並標出差值；dB 數字皆為示意</span></span><span class="iso-caption">浮動地板（浮築樓板）是在 RC 樓板上滿鋪彈性隔音墊，沿牆腳上翻周邊隔音條，再鋪 PE 防水膜、澆置內配鋼絲網的水泥砂漿層，最後鋪地坪面材；整層砂漿與面材像一塊「浮」在隔音墊上的版，四周不碰到牆與柱。腳步、落物等樓板衝擊音若直接打在一般樓板上，振動會傳入樓板並沿樓板與牆傳開，樓下聽到的聲音大；浮動地板則由隔音墊吸收振動、周邊隔音條隔斷側向傳遞，傳到樓下的聲音小很多。施工重點：隔音墊接縫要密貼、不可被砂漿或管線打穿（任何硬接觸都會成為「聲橋」），隔音條須在面材完成後才切齊並以彈性材收邊，門檻、管線貫穿處也要隔開。圖中各層厚度（薄層放大）、衝擊位置與 dB 數字皆為示意；隔音墊材質與厚度、砂漿層厚度與配筋、樓板衝擊音性能，依設計圖說及建築技術規則與相關規範、試驗報告辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}

const tenth = (value) => {

function pathOf(points, closed = false) {

const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {

        for (let step = 0; step <= count; step++) {

}
function signedArea(points) {

    for (let index = 0; index < points.length; index++) {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;

    const lower = [];
    for (const point of sorted) {

            lower.pop();
        lower.push(point);

function runsOf(flags, want) {

        const index = (start + step) % count;

function extrude(ring, z, height, projection, options = {}) {
