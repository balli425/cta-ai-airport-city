path d="M355.1 508.9L325.1 658.9"/><circle cx="355.1" cy="508.9" r="2.2"/></g><g data-li="3"><path d="M411.5 530.1L371.5 680.1"/><circle cx="411.5" cy="530.1" r="2.2"/></g><g data-li="4"><path d="M313.6 447.0L233.6 597.0"/><circle cx="313.6" cy="447.0" r="2.2"/></g><g data-li="5"><path d="M232.3 468.3L164.3 592.3"/><circle cx="232.3" cy="468.3" r="2.2"/></g><g data-li="6"><path d="M240.1 608.8L224.1 648.8"/><circle cx="240.1" cy="608.8" r="2.2"/></g><g data-li="7"><path d="M240.1 608.8L224.1 648.8"/><circle cx="240.1" cy="608.8" r="2.2"/></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅＝危害部位、側向力與傳力路徑、這一步正在組立的構件；✕ 錯誤、✓ 正確</span><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>藍灰＝可調鋼管支柱、青綠＝水平繫條（深色短節＝扣件）、梅紫＝斜撐、暖灰＝已完成的 RC 牆、木色＝貫材・格柵・底模</span></span><span class="iso-caption">支撐水平繫條與斜撐示意（以台灣工地常見的可調鋼管支柱高支撐為例，左端為已完成的 RC 牆，鏡頭依步驟拉近或拉遠）。支柱越高越細長，承載能力隨挫屈長度增加而快速下降；澆置時的衝擊、泵送與搗實振動、風力及偏心載重都會產生側向力，若各支柱各自獨立、沒有橫向拘束，頂部一旦側移就會連鎖挫屈倒塌。正確做法：高度較高的支撐，每隔一定高度設置足夠強度的縱向、橫向水平繫條，以專用扣件與每支支柱鎖緊，並設置斜撐；繫條端部與牆、柱、橋墩等構造物或穩固的牆模、柱模妥實連結，讓側向力有去路。澆置前檢查各部連接與斜撐，澆置完成、達到拆模條件前不得擅自拆除繫條或斜撐。圖中支撐高度、繫條道數與間距（每 2 m 內一道）、斜撐位置皆為示意，實際依營造安全衛生設施標準、職業安全衛生設施規則、模板支撐設計圖說、施工計畫與相關法規辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
