</style><script>(()=>{const S=[{"name":"危害：砂輪破裂飛散","desc":"砂輪高速旋轉；有裂痕或受力不當就破裂，碎片沿旋轉面飛出。"},{"name":"✕ 拆護罩・用側面研磨","desc":"護罩被拆掉；一般砂輪不耐側向力，用側面磨會產生裂痕。"},{"name":"✕ 砂輪破裂飛出","desc":"帶著裂痕高速旋轉，砂輪破裂，碎片打到正對砂輪的人。"},{"name":"✓ 換輪前檢查","desc":"目視並輕敲聽聲音，確認沒有裂痕；核對標示的最高使用周速度。"},{"name":"✓ 護罩＋工作物支架","desc":"裝回護罩與護板，只露出研磨開口；支架調到貼近砂輪。"},{"name":"✓ 試運轉・人站側邊","desc":"每日作業前及換砂輪後先空轉試運轉，人不站在旋轉面上。"},{"name":"✓ 用圓周面研磨","desc":"工件靠在支架上，輕壓砂輪的圓周面；戴護目鏡，不用側面。"},{"name":"檢查重點","desc":"護罩、支架間隙、周速度、試運轉、護目鏡；可疑的砂輪不用。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>

ss="wk-band" d="M374.0 421.6L459.4 414.0" style="stroke-width:15.46"/><path class="wk-band" d="M370.9 387.1L456.4 379.6" style="stroke-width:15.46"/><path class="wk-sleeve-o" d="M376.9 359.3L268.6 414.3" style="stroke-width:30.92"/><path class="wk-sleeve" d="M376.9 359.3L268.6 414.3" style="stroke-width:29.92"/><circle class="wk-hand" cx="268.6" cy="414.3" r="15.5"/><g transform="rotate(-5.1 401.6 280.7)"><circle class="wk-head" cx="401.6" cy="280.7" r="32.4"/><path class="wk-helmet" d="M362.1 276.8A39.6 37.6 0 0 1 441.2 276.8Z"/><path class="wk-brim" d="M353.0 277.4L450.3 277.4" style="stroke-width:8.48"/></g></g></g><text class="nt " x="118.5" y="438.2" style="opacity:1.00">用圓周面・靠在支架上</text><text class="nt " x="377.6" y="246.7" style="opacity:1.00">戴護目鏡</text><g class="mk mk-ok" transform="translate(190.2 291.3) scale(1.00)" style="opacity:1.00"><circle r="14"/><path d="M-7.1 0.3L-1.9 5.5L7.4 -5.2"/></g></g><g class="cl-lead"><g data-li="0"><path d="M190.8 576.2L180.8 616.2"/><circle cx="190.8" cy="576.2" r="2.2"/></g><g data-li="1"><path d="M190.8 576.2L180.8 616.2"/><circle cx="190.8" cy="576.2" r="2.2"/></g><g data-li="2"><path d="M190.8 576.2L180.8 616.2"/><circle cx="190.8" cy="576.2" r="2.2"/></g><g data-li="3"><path d="M190.8 576.2L180.8 616.2"/><circle cx="190.8" cy="576.2" r="2.2"/></g><g data-li="4"><path d="M239.8 424.4L199.8 460.4"/><circle cx="239.8" cy="424.4" r="2.2"/></g><g data-li="5"><path d="M190.8 576.2L180.8 616.2"/><circle cx="190.8" cy="576.2" r="2.2"/></g><g data-li="6"><path d="M190.8 576.2L180.8 616.2"/><circle cx="190.8" cy="576.2" r="2.2"/></g><g data-li="7"><path d="M264.3 433.8L224.3 423.8"/><circle cx="264.3" cy="433.8" r="2.2"/></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅＝運轉中的砂輪、碎片飛出的旋轉面與路徑、這一步正在裝設的防護裝置；✕ 錯誤、✓ 正確</span><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>半透明藍灰＝護罩、淡藍片＝護板、灰＝工作物支架、土黃＝馬達；砂輪放大示意，破裂過程為慢動作</span></span><span class="iso-caption">研磨機砂輪破裂示意（以台灣工地、加工場常見的落地式／桌上型研磨機為例，砂輪放大，破裂過程以慢動作表現，鏡頭依步驟拉近或拉遠）。砂輪以很高的周速度旋轉，本身有裂痕、受潮或受過撞擊，或超過最高使用周速度、用側面研磨而承受側向力時，就可能破裂，碎片沿旋轉面高速飛出。研磨機應設護罩，研磨輪應採用經速率試驗合格且明確記載最高使用周速度者，使用時不得超過；除側用研磨輪外不得使用側面。更換研磨輪時先檢驗有無裂痕（目視、輕敲聽聲音），並在護罩下試運轉三分鐘以上；每日作業開始前試運轉一分鐘以上，試運轉時人站在側邊。作業時工件靠在工作物支架上、輕壓圓周面，支架與砂輪的間隙調到最小，配戴護目鏡。圖中機型、砂輪與護罩尺寸、開口角度、支架間隙及人員位置皆為示意，試運轉時間為法規用語之摘述，實際依職業安全衛生設施規則、機械設備器具安全標準、設備製造者規範、施工計畫與相關法規辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
