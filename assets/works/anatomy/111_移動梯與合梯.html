.cl-tag[data-side="R"]{transform:translate(0,-50%)}.cl-tag[data-side="L"]{transform:translate(-100%,-50%)}

.iso .cl-lead g.seen{display:none}

.iso .mk path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}

.iso .mk-ok circle,.iso .mk-ok path{stroke:#174e75}

.iso .tiew{fill:none;stroke:hsl(6 58% 44%);stroke-width:2}

const G = svg.querySelector('[data-part="sc"]');

const still = matchMedia("(prefers-reduced-motion: reduce)");
let t = 0, last = 0, frame = 0, visible = false, playing = !still.matches, idle = 0;
function draw() {
  const st = SC.state(t);
  G.innerHTML = SC.draw(st);
  const moved = fitView(st);
  // 註記小字不出框
  const vbb = svg.viewBox.baseVal;
  G.querySelectorAll("text.nt").forEach((el) => { const b = el.getBBox(); let dx = 0; if (b.x < vbb.x + 4) dx = vbb.x + 4 - b.x; else if (b.x + b.width > vbb.x + vbb.width - 4) dx = vbb.x + vbb.width - 4 - (b.x + b.width); if (dx) el.setAttribute("x", (+el.getAttribute("x") + dx).toFixed(1)); });
  if (window.ctaStep) ctaStep(st.step);

stage.addEventListener("pointermove", (event) => {
  const b = svg.getBoundingClientRect();
  scrub(Math.max(0, Math.min(1, ((event.clientX - b.left) / b.width - 0.06) / 0.88)) * LOOP * 0.97);
});

  if (event.key === " ") { event.preventDefault(); playing = !playing; clearTimeout(idle); run(); return; }
  let to = null;
  if (event.key === "ArrowRight") to = t + 0.25;
  if (event.key === "ArrowLeft") to = t - 0.25;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = LOOP - 1;
  if (to === null) return;
  event.preventDefault();
  scrub(to);
});
if (still.matches) t = 18.6;
const q0 = new URLSearchParams(location.search).get("t");
if (q0 !== null) { t = +q0; playing = false; }
draw(); run();
