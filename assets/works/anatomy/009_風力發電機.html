ss="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>藍：風流線，越快越長</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>鼠尾草綠：增速齒輪箱；灰藍綠：發電機；赭黃：主軸承／變槳軸承</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅虛線＋箭頭：發電中的電力路徑（發電機 → 塔內電纜 → 變流器／升壓櫃）；櫃上燈條＝功率</span></span><span class="iso-caption">2 MW 級水平軸風機的剖切展示模型（機艙比例放大）。風速超過 3 m/s 切入後，葉輪以固定葉尖速比轉動，功率約隨風速三次方上升；約 12 m/s 達額定 2 MW 後，變槳軸承把葉片轉出（順槳）讓轉速與功率維持不變；超過 25 m/s 葉片轉到近 90° 並由高速軸煞車盤鎖住停機。慢速主軸經約 1:107 的齒輪箱升速到發電機約 1,500–1,900 rpm（畫面中高速軸以示意轉速呈現）。機艙上的風向標偵測風向，偏航馬達帶動小齒輪沿塔頂齒圈讓機艙轉向迎風。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));

    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;

      // 變槳軸承
      const pbO = add(H, mul(r, 6.8));
      const pb = lathe(pbO, r, [[0, 4.4], [2.6, 4.4]], { tone: "mid", cls: "m-bear", inner: dotS(ang(8, st.pitch * Math.PI / 180).map((a) => { const [w, u, v] = basis(r); return at(add(add(pbO, mul(r, 2.6)), add(mul(u, Math.cos(a) * 3.8), mul(v, Math.sin(a) * 3.8)))); }), 0.4, "hi") }, 20);
      items.push(pb);
      const rings = SECT.map(([rad, ch, th, tw, round]) => {
        const p = (st.pitch + tw) * Math.PI / 180;
        const cd = add(mul(tg, Math.cos(p)), mul(F.f, -Math.sin(p)));
        const nd = nrm(cross(r, cd));
        const o = add(H, mul(r, rad));
        if (round) return Array.from({ length: 8 }, (_, i) => { const a = i / 8 * Math.PI * 2; return add(o, add(mul(cd, Math.cos(a) * ch), mul(nd, Math.sin(a) * th))); });
        return AIR.map(([x, y]) => add(o, add(mul(cd, x * ch), mul(nd, y * th))));
      });
      for (let s2 = 0; s2 < rings.length - 1; s2++) {
        const tip = s2 === rings.length - 2;
        const it = loft([rings[s2], rings[s2 + 1]], { tone: "hi", cls: tip ? "m-tip" : s2 < 1 ? "m-steel" : "m-blade" });
        items.push(it);
      }
    }
    items.sort((a, b) => a.depth - b.depth);
    return items.map((i) => i.svg).join("");
  }

  // 風流線
  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const STREAKS = Array.from({ length: 46 }, () => ({ s: (rnd() * 2 - 1) * 82, z: NZ + HUB_U + (rnd() * 2 - 1) * 70, ph: rnd(), k: 0.85 + rnd() * 0.3 }));
  function streaks(far) {
    const w = [Math.cos(st.psiW), Math.sin(st.psiW), 0], sv = [-w[1], w[0], 0];
    const H = add(mul(w, HUB_A), [0, 0, NZ + HUB_U]);
    const hubD = dep(H);
    const SPAN = 230;
    let out = "";
    const len = 3 + st.v * 0.9;
    for (const q of STREAKS) {
      if (q.z < 10) continue;
      if (!far && Math.abs(q.s) < 42 && q.z > NZ - 8 && q.z < NZ + 40) continue;
      const along = ((q.ph * SPAN - st.t2 * st.v * 2.4 * q.k) % SPAN + SPAN) % SPAN; // 0..SPAN
      const xi = 150 - along; // 迎風側 + → 下風側 -
      const p0 = add(add(mul(w, xi), mul(sv, q.s)), [0, 0, q.z]);
      const p1 = add(p0, mul(w, len));
      const e = Math.min(1, along / 40, (SPAN - along) / 40);
      const a = Math.max(0, e) * Math.min(1, 0.25 + st.v / 10) * 0.85;
      if (a < 0.03) continue;
      if (!far) continue; // 全部畫在風機後方，避免蓋住剖切內部
      out += '<path class="iso-line c-wind" style="opacity:' + a.toFixed(2) + '" d="' + seg(p0, p1) + '"/>';
    }
    return out;
  }

  const stage = document.querySelector(".iso-stage");
  const svg = stage.querySelector("svg");
  const $ = (s) => svg.querySelector(s);
  const turbG = $('[data-part="turbine"]'), farG = $('[data-part="far"]'), nearG = $('[data-part="near"]');
  const leds = [...svg.querySelectorAll('[data-part="leds"] .seg')];
  const cableG = $('[data-part="cable"]');
  const readout = document.querySelector("[data-readout]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  st.t2 = 0;
  const narrowQ = matchMedia("(max-width:560px)");
  const fitV = () => svg.setAttribute("viewBox", narrowQ.matches ? "56 0 640 500" : "0 0 640 500");
  fitV(); narrowQ.addEventListener("change", fitV);
  const pflowG = $('[data-part="pflow"]');
  // 流路：2.8px 磚紅移動虛線＋白色外框＋末端箭頭（匠 2026-11-26「水路要整條標出來」）
  function wline(route, ph, cls = "", arrow = true) {
    const S = route.map(at).filter((q, i, a) => !i || Math.hypot(q[0] - a[i - 1][0], q[1] - a[i - 1][1]) > 0.3);
    if (S.length < 2) return "";
    const f = (q) => q[0].toFixed(1) + " " + q[1].toFixed(1), d = "M" + S.map(f).join("L");
    let ah = "";
    if (arrow) {
      const A = S[S.length - 2], B = S[S.length - 1], l = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1, ux = (B[0] - A[0]) / l, uy = (B[1] - A[1]) / l;
      ah = `<path class="c-ah" d="M${f([B[0] + ux * 3.5, B[1] + uy * 3.5])}L${f([B[0] - ux * 5 - uy * 3.8, B[1] - uy * 5 + ux * 3.8])}L${f([B[0] - ux * 5 + uy * 3.8, B[1] - uy * 5 - ux * 3.8])}Z"/>`;
    }
    return `<g class="c-fl ${cls}"><path class="c-fh" d="${d}"/><path class="c-fd" d="${d}" style="stroke-dashoffset:${(-(ph % 13)).toFixed(2)}"/>${ah}</g>`;
  }
  function draw() {
    const psi = st.psiN;
    const f = [Math.cos(psi), Math.sin(psi), 0], s = [-Math.sin(psi), Math.cos(psi), 0];
    const F = { o: [0, 0, NZ], f, s, z: [0, 0, 1] };
    const sig = dot(s, V) >= 0 ? 1 : -1;
    const ro = rotor(F), na = nacelle(F, sig);
    turbG.innerHTML = dot(f, V) < 0 ? ro + tower + na : tower + na + ro;
    farG.innerHTML = streaks(true);
    nearG.innerHTML = streaks(false);
    const lit = Math.round(st.pw / 2.0 * 10);
    leds.forEach((el, i) => { const v = i < lit ? (i >= 8 ? "hi" : "") : null; if (v === null) el.removeAttribute("data-on"); else el.setAttribute("data-on", v); });
    // 發電中的電力路徑：發電機接線盒 → 機艙電纜 → 塔內 → 塔底 → 變流器／升壓櫃
    if (st.pw > 0.03) {
      const jb = Wl(F, -18, 0, 17.5 + 9.8);
      pflowG.innerHTML = wline([jb, Wl(F, -12, sig * 5, 23.5), Wl(F, -6, 0, 6), [0, 0, NZ], [0, 0, 6], [4.5, 5.4, 1.6], [12, 12, 0.6], [20, 16, 0.6], [24, 18, 2]], st.t2 * 30);
    } else pflowG.innerHTML = "";
    const fmt = (x, d) => x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
    let tail = "功率 " + fmt(st.pw, 2) + " MW";
    if (st.cut) tail = st.brake ? "順槳＋煞車停機" : "強風順槳中";
    else if (st.v < VCI && st.pw < 0.02) tail = "低於切入風速";
    const text = "風速 " + fmt(st.v, 1) + " m/s · 葉輪 " + fmt(st.rpm, 1) + " rpm · 發電機 " + fmt(Math.round(st.rpm * GEAR), 0) + " rpm · " + tail;
    if (readout.textContent !== text) readout.textContent = text;
    stage.setAttribute("aria-valuetext", text + "，槳距角 " + Math.round(st.pitch) + "°");
    // 目前步驟（依風速，含遲滯）
    const TH = [VCI, 9, VR];
    let raw = 0; for (const th of TH) if (st.v > th) raw++;
    if (st.stepV === undefined) st.stepV = raw;
    while (st.stepV < 3 && st.v > TH[st.stepV] + 0.2) st.stepV++;
    while (st.stepV > 0 && st.v < TH[st.stepV - 1] - 0.2) st.stepV--;
    if (window.ctaStep) ctaStep(st.cut ? 4 : st.stepV);
    if (window.ctaLabels) ctaLabels(st.cut ? 4 : st.stepV, 0);
  }
  let last = 0, frame = 0, visible = false, playing = !still.matches, idle = 0;
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
    last = now;
    if (playing) { step(dt); st.t2 += dt; }
    draw();
    frame = visible && playing ? requestAnimationFrame(tick) : 0;
  }
  const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
  const manual = (v) => { st.manual = true; st.vt = Math.max(0, Math.min(28, v)); if (!playing && !still.matches) { playing = true; } run(); clearTimeout(idle); idle = setTimeout(() => { st.manual = false; }, 3500); };
  new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
  stage.addEventListener("pointermove", (ev) => { const b = svg.getBoundingClientRect(); const share = Math.max(0, Math.min(1, ((ev.clientX - b.left) / b.width - 0.08) / 0.84)); manual(share * 28); });
  stage.addEventListener("keydown", (ev) => {
    if (ev.key === " ") { ev.preventDefault(); playing = !playing; run(); return; }
    if (ev.key === "ArrowRight" || ev.key === "ArrowUp") { ev.preventDefault(); manual(st.vt + 1); }
    if (ev.key === "ArrowLeft" || ev.key === "ArrowDown") { ev.preventDefault(); manual(st.vt - 1); }
    if (ev.key === "Home") { ev.preventDefault(); manual(0); }
    if (ev.key === "End") { ev.preventDefault(); manual(28); }
  });
  const sim = (T) => { st = S0(); st.t2 = 0; for (let x = 0; x < T; x += 1 / 60) { step(1 / 60); st.t2 += 1 / 60; } };
  if (still.matches) sim(15);
  const q0 = new URLSearchParams(location.search).get("t");
  if (q0 !== null) { sim(+q0); playing = false; }
  draw(); run();
})();</script></body></html>
