.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}

.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}

.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}

.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}

.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}

.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}

.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}

10.8 347.9L210.6 348.4L209.9 348.7L208.9 348.9L207.8 348.8L207 348.5L206.6 348"/><path class="iso-line iso-edge" data-tone="mid" d="M206.6 348L206.8 347.6L207.5 347.2L208.6 347.1L209.6 347.1L210.5 347.5L210.8 347.9M210.8 351.9L210.6 352.4L209.9 352.8L208.9 352.9L207.8 352.8L207 352.5L206.6 352.1M206.6 348L206.6 352.1M210.8 347.9L210.8 351.9"/></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>受測玻璃：試驗時的撓曲（畫面放大 10 倍）</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>U 型鋁槽＋楔型鎖固塊：玻璃底部的懸臂固定端</span></span><span class="iso-caption">陽台板邊的純玻璃欄杆（無立柱）。先在距板邊 18 cm 處鑽孔、植化學錨栓（間距 30 cm），鎖上寬 10 cm、高 12 cm 的 U 型鋁槽；槽底在 1/4 點放兩塊墊塊，以吸盤把 10+10 mm 膠合強化玻璃（SGP 中間膜）吊入，內外兩側壓入楔型鎖固塊共 8 組，邊壓邊調整到垂直，再裝外飾蓋板、扶手蓋，槽口打矽利康。欄杆高度自完成面起不得小於 1.10 m（10 層以上 1.20 m），本例扶手蓋頂 112 cm。完工後以推拉力計經分散載重桿在扶手高度施加水平線載重，針盤量錶讀取頂端位移；推力與容許值依設計圖說，畫面位移放大 10 倍。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);

    const out = [`<path class="iso-halo" d="${haloOf(PLATE, -26, 12, P)}"/>`];
    for (const [x, y] of corners(PLATE, 12)) out.push(cyl(x, y, 5, -26, 2.4, "base", { tone: "lo" }));
    out.push(solidSvg(slabOf(PLATE, -24, 7, P, 6, 1), { tone: "mid", className: "m-base" }));
    const c4 = corners(PLATE, 6);
    out.push(L(c4.map(([x, y]) => ring(x, y, 2, -17, P, 14)).join(""), "lo"), dotsSvg(c4.map(([x, y]) => at([x, y, -17])), { size: 0.5 }));
    // 刻度尺（前緣，每 2 cm 一刻、10 cm 長刻）
    const minor = [], major = [];
    for (let i = 0, y = -140; y <= 140.01; y += 4, i++) (i % 5 ? minor : major).push(seg([104, y, -16.4], [104 - (i % 5 ? 1.8 : 3.4), y, -16.4]));
    out.push(box(100, -142, -17, 105.5, 142, -16.4, "brass", { tone: "lo", bevel: 0.2 }), L(minor.join(""), "lo"), L(major.join(""), "mid"));
    out.push(box(98, -157, -17, 111, -146, -16.4, "brass", { tone: "lo", bevel: 0.2 }));
    out.push(L(seg([101, -155, -16.3], [101, -148, -16.3]) + seg([104, -155, -16.3], [104, -150, -16.3]) + seg([107, -155, -16.3], [107, -149, -16.3]), "mid", { free: true }));

  }
  function slab() {
    const out = [];
    // 結構樓板（15 cm）＋ 粉刷層＋磁磚完成面
    out.push(box(0, -150, -17, 96, 150, -2, "slab", { bevel: 0.5 }));
    out.push(box(0.6, -150, -2, 96, 150, 0, "tile", { bevel: 0.2, tone: "lo" }));
    const g = [];
    for (let x = 6; x < 95; x += 30) g.push(seg([x, -149.5, 0.02], [x, 149.5, 0.02]));
    for (let y = -120; y < 149; y += 30) g.push(seg([1.2, y, 0.02], [95.5, y, 0.02]));

    out.push(L(seg([0.6, 150.05, -2], [96, 150.05, -2]), "lo"));

  }

  // ── 構件 ──
  function anchor(y, done) {
    // 化學錨栓：M12 牙條＋樹脂溢出環
    let s = `<path class="iso-line resin" data-tone="lo" d="${ring(SX, y, 1.5, 0.05, P, 14)}"/>`;
    const top = done ? SH.base + 2.4 : 4.2;
    s += cyl(SX, y, 0.6, 0, top, "rod", { steps: 10, tone: "mid" });
    return s;
  }
  function nut(y) {
    const hex = Array.from({ length: 6 }, (_, i) => { const q = (i / 6) * Math.PI * 2 + 0.3; return [SX + 1.1 * Math.cos(q), y + 1.1 * Math.sin(q)]; });
    return box(SX - 1.6, y - 1.6, SH.base, SX + 1.6, y + 1.6, SH.base + 0.3, "steel", { bevel: 0, tone: "lo" }) +
      solidSvg(extrude(hex, SH.base + 0.3, 1.0, P, { convex: true }), { tone: "mid", className: "m-steel" });
  }
  // U 型鋁槽：分成內側壁（遠）、底板、外側壁（近）
  function shoeBack(y0, y1, dz = 0) {
    return pY([[SH.x0, dz], [SH.x0 + SH.wall, dz], [SH.x0 + SH.wall, SH.h + dz], [SH.x0, SH.h + dz]], y0, y1, { m: "shoe" }) +
      pY([[SH.x0, dz], [SH.x1, dz], [SH.x1, SH.base + dz], [SH.x0, SH.base + dz]], y0, y1, { m: "shoe" });
  }
  function shoeFront(y0, y1, dz = 0) {
    const s = pY([[SH.x1 - SH.wall, dz], [SH.x1, dz], [SH.x1, SH.h + dz], [SH.x1 - SH.wall, SH.h + dz]], y0, y1, { m: "shoe" });
    return s + L(seg([SH.x1 + 0.02, y0 + 1, SH.h - 2 + dz], [SH.x1 + 0.02, y1 - 1, SH.h - 2 + dz]), "faint");
  }
  function block(y, z = 0) { return box(SX - 2.4, y - 5, SH.base + z, SX + 2.4, y + 5, GB + z, "block", { bevel: 0.1, tone: "lo" }); }
  // 楔塊：內外各一，往下壓入槽內
  function wedge(y, side, f = 1) {
    const zIn = SH.base + 1.5 + (1 - f) * 16;
    const xa = side < 0 ? SH.x0 + SH.wall : SX + GT / 2, xb = side < 0 ? SX - GT / 2 : SH.x1 - SH.wall;
    const prof = side < 0 ? [[xa, zIn], [xb, zIn], [xb, zIn + 9.6], [xa, zIn + 9.6]] : [[xa, zIn], [xb, zIn], [xb, zIn + 9.6], [xa, zIn + 9.6]];
    let s = pY(prof, y - 3, y + 3, { m: "wedge", tone: "mid" });
    s += cyl((xa + xb) / 2, y, 0.55, zIn + 9.6, 0.4, "steel", { steps: 8, tone: "lo" });

  }
  // 玻璃：懸臂撓曲 δ(z) = δtop·(3ζ² − ζ³)/2，ζ = 高度比
  function glassProfile(tip, dz = 0) {
    const L2 = [], R = [];
    for (let i = 0; i <= 8; i++) {
      const zz = GB + (GH * i) / 8, f = i / 8, d = tip * (3 * f * f - f * f * f) / 2;
      L2.push([SX - GT / 2 + d, zz + dz]);
      R.push([SX + GT / 2 + d, zz + dz]);
    }
    return [...L2, ...R.reverse()];
  }
  function glass(y0, y1, tip, dz = 0, opt = {}) {
    const prof = glassProfile(tip, dz);
    let s = pY(prof, y0, y1, { m: "glass", tone: "mid", lit: opt.lit });
    // SGP 中間膜線（頂邊）與玻璃邊（綠色）
    const zt = GB + GH + dz;
    s += `<path class="glass-edge" d="${seg([SX - GT / 2 + tip, y0, zt], [SX - GT / 2 + tip, y1, zt])}${seg([SX + GT / 2 + tip, y0, zt], [SX + GT / 2 + tip, y1, zt])}"/>`;
    s += L(seg([SX + tip, y0 + 0.3, zt + 0.02], [SX + tip, y1 - 0.3, zt + 0.02]), "faint");
    // 外表面反光
    const fx = (zz) => { const f = (zz - GB - dz) / GH; return SX + GT / 2 + 0.05 + tip * (3 * f * f - f * f * f) / 2; };
    const gp = (fy, fz) => { const zz = GB + dz + GH * fz; return [fx(zz), y0 + (y1 - y0) * fy, zz]; };
    const hl = [], segs = 6;
    for (const [a, b] of [[[0.1, 0.4], [0.5, 0.95]], [[0.22, 0.18], [0.62, 0.72]]]) {
      const pts = [];
      for (let i = 0; i <= segs; i++) { const f = i / segs; pts.push(at(gp(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f))); }
      hl.push(pathOf(pts));
    }
    s += `<path class="glass-hi" d="${hl.join("")}"/>`;
    const p3 = []; for (let i = 0; i <= segs; i++) { const f = i / segs; p3.push(at(gp(0.7 + 0.2 * f, 0.1 + 0.36 * f))); }
    s += `<path class="glass-hi glass-hi-2" d="${pathOf(p3)}"/>`;

  }
  function cladding(y0, y1, side, f = 1) {
    const off = (1 - f) * 5 * side;
    const x0 = side < 0 ? SH.x0 - 0.9 + off : SH.x1 + off, x1 = x0 + 0.9;
    const s = pY([[x0, 0.2], [x1, 0.2], [x1, SH.h + 1.2], [x0 + (side < 0 ? 0 : 0), SH.h + 1.2]], y0, y1, { m: "clad" });

  }
  function cap(y0, y1, tip, dz = 0, opt = {}) {

    const prof = [[x0, zb], [x0 + 0.8, zb], [x0 + 0.8, zb + 4.0], [x1 - 0.8, zb + 4.0], [x1 - 0.8, zb], [x1, zb], [x1, zb + 4.6], [x0, zb + 4.6]];

  }
  function silicone(y0, y1, f = 1) {
    if (f <= 0.01) return "";

    return box(SX - GT / 2 - 0.9, y0 + 0.5, SH.h - 0.2, SX - GT / 2, ye, SH.h + 0.7, "sil", { bevel: 0, tone: "lo" }) +
      box(SX + GT / 2, y0 + 0.5, SH.h - 0.2, SX + GT / 2 + 0.9, ye, SH.h + 0.7, "sil", { bevel: 0, tone: "lo" });
  }

  // ── 施工機具 ──
  function drill(st) {

    const down = st.dp < 0.2 ? ease(st.dp / 0.2) : st.dp < 0.7 ? 1 : 1 - ease((st.dp - 0.7) / 0.3);
    const z = 1 + 13 * (1 - down), out = [];

    out.push(box(SX + 8, y - 2.4, z + 24, SX + 14, y + 2.4, z + 34, "drill", { bevel: 0.6, r: 1.5 }));
    out.push(box(SX + 4, y - 2.6, z + 33, SX + 15, y + 2.6, z + 36, "drill2", { bevel: 0.6, r: 1.2 }));
    const vent = []; for (let i = 0; i < 4; i++) vent.push(seg([SX + 5 + i * 2.6, y + 3.22, z + 18.4], [SX + 5 + i * 2.6, y + 3.22, z + 22]));
    out.push(L(vent.join(""), "lo"));
    // 粉塵
    if (down > 0.6) out.push(dotsSvg([[2.4, 0.6], [-2.2, 1.2], [1.4, -2.2], [-1, 2.6]].map(([a, b]) => at([SX + a, y + b, 0.3])), { size: 0.7, tone: "lo" }));
    return out.join("");
  }
  // 玻璃吸盤（貼在外表面）
  function lifter(y0, y1, dz, tip, a) {
    if (a <= 0.01) return "";
    const yc = (y0 + y1) / 2, zc = GB + 70 + dz, xg = SX + GT / 2 + tip * 0.6, out = [];
    for (const yy of [yc - 18, yc + 18]) {
      out.push(pX(circ(yy, zc, 6.5, 24), xg, xg + 0.9, { m: "cup", tone: "mid" }));
      out.push(pX(circ(yy, zc, 2.2, 14), xg + 0.9, xg + 3.2, { m: "steel", tone: "lo" }));
    }
    out.push(pX([[yc - 20, zc - 1.2], [yc + 20, zc - 1.2], [yc + 20, zc + 1.2], [yc - 20, zc + 1.2]], xg + 3.2, xg + 5.4, { m: "lift", tone: "mid" }));
    out.push(pX([[yc - 6, zc + 1.2], [yc - 4, zc + 1.2], [yc - 4, zc + 12], [yc + 4, zc + 12], [yc + 4, zc + 1.2], [yc + 6, zc + 1.2], [yc + 6, zc + 14], [yc - 6, zc + 14]], xg + 3.6, xg + 5.0, { m: "lift", tone: "mid" }));
    out.push(dotsSvg([at([xg + 5.5, yc - 12, zc]), at([xg + 5.5, yc + 12, zc])], { size: 0.7, tone: "hi" }));
    return alphaG(a, out.join(""));
  }
  // 推拉力計＋分散載重桿（室內側推扶手）
  function loadRig(st, tip) {
    // 室內側在 +x（靠觀者），推力朝 −x（室外）
    const [y0, y1] = PANELS[2], yc = (y0 + y1) / 2, z = CAPZ + 2.3, xc = SX + 2.6 + tip, out = [];
    // 分散載重桿（角材，貼扶手蓋室內側）
    out.push(box(xc, y0 + 8, z - 1.6, xc + 2.4, y1 - 8, z + 1.6, "bar", { bevel: 0.2 }));
    // 推頭＋推拉力計本體
    out.push(pX(circ(yc, z, 1.4, 14), xc + 2.4, xc + 7, { m: "steel", tone: "lo" }));
    out.push(pX(circ(yc, z, 3.8, 22), xc + 7, xc + 26, { m: "gauge", tone: "mid" }));
    // 頂部錶盤（0–1.2 kN/m 對應指針 0–300°）
    const pc = [xc + 16.5, yc, z + 3.8];
    out.push(cyl(pc[0], yc, 3.4, z + 2.6, 1.2, "window", { steps: 28, tone: "lo" }));
    const tk = [];
    for (let i = 0; i <= 12; i++) { const q = -Math.PI / 2 + (i / 12) * (300 * D2R); tk.push(seg([pc[0] + 2.4 * Math.cos(q), yc + 2.4 * Math.sin(q), pc[2] + 0.01], [pc[0] + (i % 4 ? 2.9 : 2.0) * Math.cos(q), yc + (i % 4 ? 2.9 : 2.0) * Math.sin(q), pc[2] + 0.01])); }
    out.push(L(tk.join(""), "faint"));
    const qL = -Math.PI / 2 + (1.0 / 1.2) * 300 * D2R;
    out.push(`<path class="limit" d="${seg([pc[0] + 2.0 * Math.cos(qL), yc + 2.0 * Math.sin(qL), pc[2] + 0.02], [pc[0] + 3.2 * Math.cos(qL), yc + 3.2 * Math.sin(qL), pc[2] + 0.02])}"/>`);
    const qa = -Math.PI / 2 + (st.F / 1.2) * 300 * D2R;
    out.push(L(seg(pc, [pc[0] + 2.7 * Math.cos(qa), yc + 2.7 * Math.sin(qa), pc[2] + 0.02]), "hi"));
    out.push(dotsSvg([at(pc)], { size: 0.55, tone: "hi" }));
    // T 型把手＋手（手套）＋袖口
    out.push(pX(circ(yc, z, 1.2, 12), xc + 26, xc + 32, { m: "steel", tone: "lo" }));
    out.push(pX([[yc - 7, z - 1.3], [yc + 7, z - 1.3], [yc + 7, z + 1.3], [yc - 7, z + 1.3]], xc + 32, xc + 34.5, { m: "steel", tone: "mid" }));
    out.push(box(xc + 32.4, yc - 6.2, z - 3.4, xc + 39, yc + 6.2, z + 3.6, "glove", { r: 2.2, bevel: 0.8 }));
    const kn = []; for (let i = 1; i < 4; i++) kn.push(seg([xc + 39.02, yc - 6.2 + i * 3.1, z - 2.4], [xc + 39.02, yc - 6.2 + i * 3.1, z + 2.6]));
    out.push(L(kn.join(""), "lo"));
    out.push(box(xc + 39, yc - 4, z - 4, xc + 50, yc + 4, z + 4.2, "sleeve", { r: 2.4, bevel: 0.8 }));
    return out.join("");
  }
  // 位移量測：磁性座＋針盤量錶，測桿頂住扶手蓋室內側
  function dialStand(st, tip) {
    const y = PANELS[2][1] - 4, out = [], xb = SX + 36, z = CAPZ + 2.3;
    const xr = SX + 2.6 + tip; // 扶手蓋室內側面
    const dc = [xr + 10, y, z + 5.7];
    // 測桿（最遠）→ 錶 → 橫臂 → 立柱、磁性座（最近）
    out.push(pX(circ(y, z + 1.4, 0.45, 8), xr, dc[0] - 4.2, { m: "rod", tone: "lo" }));
    out.push(cyl(dc[0], y, 4.2, z + 4.2, 2.2, "dial", { steps: 32 }));
    const dt = [];
    for (let i = 0; i < 20; i++) { const q = (i / 20) * Math.PI * 2; dt.push(seg([dc[0] + 3.4 * Math.cos(q), y + 3.4 * Math.sin(q), z + 6.42], [dc[0] + (i % 5 ? 3.9 : 3.0) * Math.cos(q), y + (i % 5 ? 3.9 : 3.0) * Math.sin(q), z + 6.42])); }

    const nq = -Math.PI / 2 + (st.defl / 10) * Math.PI * 2;
    out.push(L(seg([dc[0], y, z + 6.43], [dc[0] + 3.2 * Math.cos(nq), y + 3.2 * Math.sin(nq), z + 6.43]), "hi"));
    out.push(dotsSvg([at([dc[0], y, z + 6.44])], { size: 0.6, tone: "hi" }));
    out.push(pX(circ(y, z + 5.7, 0.55, 10), dc[0] + 4.2, xb, { m: "rod", tone: "lo" }));
    out.push(box(xb - 4, y - 3.5, 0, xb + 4, y + 3.5, 6, "magnet", { bevel: 0.5 }));
    out.push(box(xb - 4.3, y - 3.5, 2.6, xb + 4.3, y + 3.5, 3.4, "steel", { bevel: 0, tone: "lo" }));
    out.push(cyl(xb, y, 0.7, 6, z, "rod", { steps: 10 }));
    out.push(cyl(xb, y, 1.6, z + 4, 3.4, "steel", { steps: 12 }));

  }

  // ── 組裝 ──
  function finished(y0, y1) {
    const out = [];
    out.push(cladding(y0, y1, -1));
    out.push(shoeBack(y0, y1));
    for (const y of WEDGE(y0, y1)) out.push(wedge(y, -1));
    out.push(glass(y0, y1, 0));
    for (const y of WEDGE(y0, y1)) out.push(wedge(y, 1));
    out.push(silicone(y0, y1));
    out.push(shoeFront(y0, y1), cladding(y0, y1, 1));
    out.push(cap(y0, y1, 0));
    return out.join("");
  }
  function stat() {
    return base() + slab() + finished(...PANELS[0]) + finished(...PANELS[1]);
  }
  function bay(st) {
    const [y0, y1] = PANELS[2], out = [], u = st.u;
    const tipD = st.testing ? -st.defl * SHOW : 0; // mm → cm（放大 10 倍），朝室外 −x
    const tilt = u < T.wedge[1] ? st.tilt : 0;
    const tp = tipD + tilt;
    // 室內側：試驗器材（在玻璃後方）
    // 錨栓
    const ys = ANCH(y0, y1);
    for (let i = 0; i < st.anchors; i++) out.push(alphaG(st.fade, anchor(ys[i], u >= T.shoe[0])));
    const showShoe = u >= T.shoe[0];
    if (showShoe) {
      if (st.clad > 0) out.push(alphaG(st.clad * st.fade, cladding(y0, y1, -1, st.clad)));
      out.push(alphaG(st.fade, shoeBack(y0, y1, st.shoeZ)));
      for (let i = 0; i < st.nuts; i++) out.push(alphaG(st.fade, nut(ys[i])));
      const bl = BLOCK(y0, y1);
      for (let i = 0; i < st.blocks; i++) out.push(alphaG(st.fade, block(bl[i], i === st.blocks - 1 ? st.blockZ : 0)));
    }
    const wy = WEDGE(y0, y1), order = [];
    for (let i = 0; i < 4; i++) order.push([wy[i], -1], [wy[i], 1]);
    const wIn = (side) => order.map((o, i) => ({ y: o[0], side: o[1], i })).filter((o) => o.side === side && o.i < st.wedges);
    for (const w of wIn(-1)) out.push(alphaG(st.fade, wedge(w.y, -1, w.i === st.wedges - 1 && u < T.wedge[1] ? ease(st.wedgeF) : 1)));
    if (st.glassZ !== null) {
      out.push(alphaG(st.fade, glass(y0, y1, tp, st.glassZ, { lit: st.testing })));
    }
    for (const w of wIn(1)) out.push(alphaG(st.fade, wedge(w.y, 1, w.i === st.wedges - 1 && u < T.wedge[1] ? ease(st.wedgeF) : 1)));
    if (u >= T.sil[0]) out.push(alphaG(st.fade, silicone(y0, y1, st.sil)));
    if (showShoe) {
      out.push(alphaG(st.fade, shoeFront(y0, y1, st.shoeZ)));
      if (st.clad > 0) out.push(alphaG(st.clad * st.fade, cladding(y0, y1, 1, st.clad)));
    }
    if (st.cap > 0) out.push(alphaG(Math.min(clamp01(st.cap * 3), st.fade), cap(y0, y1, tp, (1 - st.cap) * 24)));
    if (st.glassZ !== null) out.push(lifter(y0, y1, st.glassZ, tp, st.lifter));
    if (u < T.drill[1]) out.push(drill(st));
    // 室內側試驗器材（在玻璃前方）
    if (u >= T.sil[1] - 0.3) out.push(alphaG(Math.min(clamp01((u - T.sil[1] + 0.3) / 0.4), st.fade), loadRig(st, tipD) + dialStand(st, tipD)));
    return out.join("");
  }
  return { G: { LOOP, DEFL_PER_KN }, T, state, stat, bay };
}

const STEP_NAMES = ["鑽孔・植化學錨栓","U 型鋁槽就位鎖固","放置墊塊","吸盤吊入玻璃","楔塊鎖緊・調垂直","外飾蓋板・扶手蓋","打矽利康","水平推力試驗"];
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const G = { bay: svg.querySelector('[data-part="bay"]') };
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
let t = 0, last = 0, frame = 0, visible = false, playing = !still.matches, idle = 0;
function draw() {
  const st = SC.state(t);
  if (window.ctaStep) window.ctaStep(Math.max(0, STEP_NAMES.indexOf(st.stage)));
  G.bay.innerHTML = SC.bay(st);
  let text = "第 3 片 · 10+10 膠合強化 · 楔塊 " + st.wedges + "/8 · " + st.stage;
  if (st.u >= SC.T.load[0]) text = "第 3 片 · 10+10 SGP · 推力 " + st.F.toFixed(2) + "/1.0 kN/m · 位移 " + st.defl.toFixed(1) + " mm";
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  if (playing) t += dt;
  draw();
  frame = visible && playing ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const scrub = (to) => { playing = false; t = Math.max(0, to); draw(); clearTimeout(idle); idle = setTimeout(() => { playing = !still.matches; run(); }, 3000); };
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (event) => {
  const b = svg.getBoundingClientRect();
  const share = Math.max(0, Math.min(1, ((event.clientX - b.left) / b.width - 0.06) / 0.88));
  scrub(Math.floor(t / LOOP) * LOOP + share * LOOP * 0.999);
});
stage.addEventListener("keydown", (event) => {
  if (event.key === " ") { event.preventDefault(); playing = !playing; clearTimeout(idle); run(); return; }
  let to = null;
  if (event.key === "ArrowRight") to = t + 0.25;
  if (event.key === "ArrowLeft") to = t - 0.25;
  if (event.key === "Home") to = Math.floor(t / LOOP) * LOOP;
  if (to === null) return;
  event.preventDefault();
  scrub(to);
});
if (still.matches) t = 14.4;
const q0 = new URLSearchParams(location.search).get("t");
if (q0 !== null) { t = +q0; playing = false; }
draw(); run();
</script></body></html>
