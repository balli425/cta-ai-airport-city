.iso .c-dExp circle{fill:hsl(150 44% 34%)}
.iso .c-disc{stroke:hsl(4 60% 44%)!important;stroke-width:1.2}
.iso .c-fan{fill:hsl(210 10% 46%);stroke:hsl(210 14% 26%);stroke-width:.4}
.iso .c-fan.blur{fill-opacity:.5}
.iso .c-ug{stroke:hsl(214 30% 50%)!important;stroke-width:1.4;stroke-dasharray:3 2;fill:none}
.iso .c-roadline{stroke:hsl(44 40% 88%)!important;stroke-width:1.2}
.iso .c-compass{fill:hsl(4 44% 50%);stroke:none}
.iso .c-shadow{fill:hsl(222 30% 20%);opacity:.32;stroke:none}
.c-arc{fill:none;stroke:hsl(38 40% 62%);stroke-width:1;stroke-dasharray:3 3}
.c-sun{fill:hsl(42 92% 62%);stroke:hsl(32 80% 50%);stroke-width:1.2}
.c-sun.low{fill:hsl(26 88% 62%)}
.c-glow{fill:hsl(46 100% 70%)}
.c-ray{fill:none;stroke:hsl(42 90% 56%);stroke-width:1;stroke-dasharray:2 4}
.c-cloud circle{fill:hsl(210 14% 92%);stroke:hsl(210 10% 72%);stroke-width:.8}
.c-sk{font:600 11px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:hsl(32 30% 42%)}
.c-sk2{font:500 10px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:hsl(32 20% 52%)}
.iso .c-spin{fill:none;stroke:hsl(6 52% 46%);stroke-width:1.4;stroke-linecap:round}
.pl rect{fill:color-mix(in srgb,var(--anatomy-card) 92%,transparent);stroke:hsl(214 14% 70%);stroke-width:.8}
.pl text{font:600 11px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:hsl(214 14% 44%)}
.pl.on rect{fill:#174e75;stroke:#174e75}
.pl.on text{fill:#fff}
.pl-line{stroke:hsl(214 14% 66%);stroke-width:.6;fill:none}
.pl-line.on{stroke:#174e75;stroke-width:1}
.pl-dot{fill:hsl(214 14% 60%)}.pl-dot.on{fill:#174e75}
@media (max-width:560px){.pl:not(.on),.pl-line:not(.on),.pl-dot:not(.on){display:none}}
.lb-line{stroke:hsl(214 20% 46%);stroke-width:.7;fill:none}
.lb-dot{fill:hsl(214 30% 30%)}
.lb-t{font:600 10px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:hsl(214 30% 26%);paint-order:stroke;stroke:var(--anatomy-card);stroke-width:3px;stroke-linejoin:round}
.lb-s{fill:hsl(4 44% 42%)}
.ch-bg{fill:color-mix(in srgb,var(--anatomy-card) 94%,transparent);stroke:color-mix(in srgb,var(--anatomy-mid) 55%,transparent);stroke-width:1}
.ch-h{font:700 11.5px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#174e75}
.ch-t{font:500 9px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:hsl(214 10% 40%)}
.ch-grid{stroke:hsl(214 10% 88%);stroke-width:.7;fill:none}
.ch-irr{fill:none;stroke:hsl(38 60% 62%);stroke-width:1;stroke-dasharray:3 2}
.ch-irrNow{fill:none;stroke:hsl(38 70% 50%);stroke-width:1.2}
.ch-load{fill:none;stroke:hsl(218 30% 46%);stroke-width:1.2;stroke-dasharray:4 2}
.ch-pv{fill:none;stroke:hsl(176 46% 32%);stroke-width:1.8;stroke-linejoin:round}
.ch-pvA{fill:hsl(176 30% 60%);opacity:.22}
.ch-exp{fill:hsl(150 36% 52%);opacity:.38}
.ch-now{stroke:hsl(4 50% 50%);stroke-width:1;stroke-dasharray:2 2}
.ch-dot{fill:hsl(176 46% 32%);stroke:#fff;stroke-width:1}

流隔離開關 → 分電盤）→ 建築用電（室內、冷氣室外機）</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>電網段的箭頭方向＝購電（電網 → 電表）或餘電送入電網（電表 → 電網），電表方向燈同步切換</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>右上曲線：虛線＝晴天日射量（1000 W/m² 對齊 5 kW 刻度）與用電；實線＝實際發電；綠色區塊＝餘電。屋頂暗影＝雲影</span></span><span class="iso-caption">示意圖（非比例）。屋頂光電模組以支架傾斜朝南（圖中 18°），每排模組串聯成直流組串，接到直流匯流箱後沿外牆配管下到變流器（逆變器），轉為與市電同步的交流電，經交流隔離開關接入分電盤；建築先使用光電電力，不足時由台電補足，多餘電力經雙向電表反向送入電網。變流器具防孤島保護：市電停電時須自動解聯、停止送電。模組傾角與方位、組串數、變流器容量、配管與接地、屋頂荷重與抗風固定、併網型式（全額躉售或自發自用）與電表配置，皆依台電再生能源併聯相關規定與設計圖說；屋頂設置另須符合建築法規及消防安全相關要求，依設計圖說。圖中系統容量 5 kWp、日射量、功率與時間（一天壓縮為 24 秒）皆為示意。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

const SC = makeScene(P, CH, 680);
