<path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅＝易踏穿的屋面、墜落路徑與這一步正在裝設的設施；✕ 錯誤、✓ 正確</span><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>淺藍＝採光罩、灰＝屋面板（半透明示意）、木色＝踏板、黃＝母索支柱、綠＝安全網</span></span><span class="iso-caption">屋頂作業與踏板示意。石綿瓦、鐵皮浪板、塑膠採光罩等屋面材料無法承受人員重量，踏穿墜落是屋頂修繕最常見的死亡災害。作業前應規劃安全的上下設備，並於屋架上鋪設具足夠強度的踏板（圖示寬 30 cm 以上為示意）、屋架下方張掛安全網；人員使用全身背負式安全帶並掛於已錨固的安全母索，全程只走在踏板上，並指派屋頂作業主管在場指揮監督，遇強風、大雨等惡劣天候停止作業。圖中屋面為半透明示意以便看見下方屋架，屋頂坡度、桁條間距、踏板尺寸與安全網範圍皆為示意，實際依營造安全衛生設施標準、職業安全衛生設施規則、施工計畫與相關法規辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
