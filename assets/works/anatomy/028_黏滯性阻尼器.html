L584.2 493.2L585.7 493.5L586.8 494L587.1 494.7Z"/><g class="iso-dots" data-tone="hi"><circle cx="584.5" cy="474.7" r="0.5"/><circle cx="562.2" cy="490.4" r="0.5"/><circle cx="605.5" cy="478.9" r="0.5"/><circle cx="583.2" cy="494.6" r="0.5"/></g><path class="iso-line" data-tone="faint" d="M548.3 517.5L586 525M620.5 502.6L589.2 524.6"/><g data-part="bench"></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>鼠尾草綠：阻尼器缸體；石板藍：延伸桿；青綠：矽油；粒子由青轉磚紅表示通過孔口後升溫</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>前方為剖開的同型阻尼器（外殼剖半，活塞桿與端蓋不剖）：活塞頭孔口、導套密封、左端浮動活塞蓄壓室</span></span><span class="iso-caption">三層鋼構架（每層約 50 t、一階週期約 0.8 s）每層兩側構面各裝一支斜向黏滯性阻尼器。層間變位經延伸桿推動活塞，缸內矽油被迫擠過活塞頭上的細小孔口，產生與速度相關的阻力 F = C·|v|^α（α ≈ 0.4，非線性：低速時力即升高、高速時增幅趨緩），把結構動能轉為油的熱能；力與位移約差 90° 相位，最大力出現在速度最大（位移接近零）時，迴圈接近橢圓偏方形。蓄壓室的浮動活塞補償活塞桿進出造成的體積變化與油的熱膨脹。畫面同時計算受同一地震、有無阻尼器的兩座構架，點一下切換顯示：無阻尼器時頂層擺幅約大兩倍以上，震後仍持續擺動。構架與台面位移放大約 6 倍，展示阻尼器行程另行放大；粒子顏色為示意。數值為示意模型。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;

  // ── 幾何：構架 ──

  }
  function column(x, y, z0, z1, shf) {

  }
  function slab(z, X) {
    const out = [];
    for (const y of YB) out.push(boxW(XA + 1.5 + X, XB - 1.5 + X, y - 0.8, y + 0.8, z - 5, z - 2, "m-beam", "mid"));
    for (const x of [XA, XB]) out.push(boxW(x - 0.8 + X, x + 0.8 + X, -YP + 1.5, YP - 1.5, z - 5, z - 2, "m-beam", "mid"));
    const ln = [-14, -7, 0, 7, 14].map((q) => seg([XB + 4 + X, q, z - 1.9], [XB + 4 + X, q, z - 0.1])).join("") + [10, 24, 38].map((q) => seg([q + X, 15, z - 1.9], [q + X, 15, z - 0.1])).join("");

  }
  function massBlocks(z, X) {
    const out = [];

    return out;
  }
  function damperSet(i, y, Xi, Xj) {
    const out = [];
    const z0 = ZF[i], z1 = ZF[i + 1];
    // 節點板
    out.push(plateXZ([[XA + 1.5, z0], [XA + 10, z0], [XA + 10, z0 + 1.2], [XA + 1.5, z0 + 7.5]], y - 0.35, y + 0.35, Xi, "m-gus", "hi"));
    out.push(plateXZ([[XB - 1.5, z1 - 5], [XB - 10, z1 - 5], [XB - 10, z1 - 6.2], [XB - 1.5, z1 - 12.5]], y - 0.35, y + 0.35, Xj, "m-gus", "hi"));

    const d = sub(B, A), Lb = Math.hypot(...d), U = mul(d, 1 / Lb);

  // ── 幾何：剖開的展示阻尼器（外殼後半剖切，活塞桿與端蓋不剖）──
  const AX = (x, r, th) => [x, BEN.y + r * Math.cos(th), BEN.z + r * Math.sin(th)];

  // ── 儀表：左＝一樓阻尼器 力－位移；右＝力－速度（α = 0.4 與線性對照）──
  const XM = (PAN.x0 + PAN.x1) / 2;

    let s = "";
    const y = PAN.y + 0.01;
    for (const [a, b] of [[PAN.x0 + 2, XM - 1], [XM + 1, PAN.x1 - 2]]) s += '<path class="scr" d="' + pathOf([[a, y, pz0], [b, y, pz0], [b, y, pz1], [a, y, pz1]].map(at), true) + '"/>';

    for (const u of [-3, -1.5, 1.5, 3]) g += pathOf([pp(PL(u), -FX * 0.95), pp(PL(u), FX * 0.95)]);
    for (const v of [-0.3, -0.15, 0.15, 0.3]) g += pathOf([pp(PR(v), -FX * 0.95), pp(PR(v), FX * 0.95)]);

    if (st.mode === 0) {

  }

  const stage = document.querySelector(".iso-stage");
  const svgEl = stage.querySelector("svg");
  const rig = svgEl.querySelector('[data-part="rig"]'), benchG = svgEl.querySelector('[data-part="bench"]'), plotG = svgEl.querySelector('[data-part="plot"]');

  function draw() {

  }
  let last = 0, frameId = 0, visible = false, playing = !still.matches, idle = 0;
  function tick(now) {
