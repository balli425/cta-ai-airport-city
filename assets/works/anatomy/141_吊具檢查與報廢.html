</style><script>(()=>{const S=[{"name":"危害：吊具損傷","desc":"吊具是吊掛最弱的一環；帶傷使用，吊舉中就會斷裂或脫落。"},{"name":"✕ 鋼索","desc":"斷絲、扭結、直徑變細或腐蝕、明顯變形——都不可再用。"},{"name":"✕ 纖維吊帶","desc":"割傷、磨損起毛、縫線脫落或受熱、化學品侵蝕，立即停用。"},{"name":"✕ 吊鏈・卸扣","desc":"鏈環伸長、龜裂、斷面磨耗；卸扣變形、用螺栓代替插銷，都報廢。"},{"name":"✕ 吊鉤","desc":"鉤口變大、扭曲或有裂紋；防脫舌片失效時，吊環會自鉤口滑脫。"},{"name":"✓ 作業前檢點","desc":"每次作業前把要用的吊具逐一看過、摸過，合格才掛上吊鉤。"},{"name":"✓ 不合格立即報廢","desc":"有損傷就剪斷或標示禁用並移出現場，不修補、不降級再用。"},{"name":"存放與標示","desc":"吊具掛放在通風處，避免日曬雨淋與化學品；額定荷重標示清楚。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>

.iso .hookp{fill:none;stroke:hsl(212 14% 24%);stroke-width:2.4;stroke-linecap:round}
.iso .strap{fill:none;stroke:hsl(212 12% 30%);stroke-width:1.4;stroke-linejoin:round}
.iso .sling{fill:none;stroke:hsl(212 14% 30%);stroke-width:1.6;stroke-linecap:round}
.iso .lanyard{fill:none;stroke:hsl(38 60% 40%);stroke-linecap:round}
.iso .hotl{stroke:hsl(6 60% 44%)!important}
.iso .burst{fill:none;stroke:hsl(6 62% 46%);stroke-width:2.4;stroke-linecap:round}

.iso .tb path{stroke-linejoin:round}
.iso .grid{stroke:hsl(40 12% 66%);stroke-width:.8}
.iso .lay{fill:none;stroke:hsl(212 12% 30%);stroke-dasharray:1.6 3.2;stroke-linecap:butt;opacity:.7}
.iso .hair{fill:none;stroke:hsl(6 62% 44%);stroke-width:1.6;stroke-linecap:round}
.iso .web{fill:hsl(282 22% 56%);stroke:hsl(282 24% 30%);stroke-width:.9;stroke-linejoin:round}
.iso .stitch{fill:none;stroke:hsl(282 30% 86%);stroke-dasharray:3 2.4}
.iso .cut{fill:hsl(40 16% 88%);stroke:hsl(6 62% 44%);stroke-width:1.8;stroke-linejoin:round}
.iso .crack{fill:none;stroke:hsl(6 62% 44%);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.iso .latch{fill:none;stroke:hsl(212 14% 30%);stroke-linecap:round}
.iso .slg{fill:none;stroke:hsl(212 14% 34%);stroke-linecap:round}
.iso g.hot .slg{stroke:hsl(6 60% 44%)}
.iso .binin{fill:hsl(6 30% 26%);stroke:hsl(6 40% 20%);stroke-width:.6}

 data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>灰＝鋼索與吊鏈、紫灰＝纖維吊帶、土黃＝吊鉤；上排良好、下排損傷對照（吊具放大示意）</span></span><span class="iso-caption">吊具檢查與報廢示意（吊具架上以放大比例展示四種常用吊具，上排為良好、下排為損傷對照，鏡頭依步驟拉近每一格）。吊掛用具有下列情形時不得使用：鋼索有斷絲（一撚間素線截斷達一定比例）、扭結、直徑明顯減少、顯著變形或腐蝕；纖維索、纖維吊帶有斷股、割傷、顯著磨損或腐蝕、縫線脫落；吊鏈伸長、鏈環斷面直徑減少、有龜裂；吊鉤、卸扣（鉤環）變形或龜裂。吊鉤應有防止吊索脫落的防脫舌片（防滑舌片）並保持有效。每次作業前應逐一檢點，不合格的吊具立即報廢、剪斷或標示禁用並移出現場，不得修補或降級再用；吊具應掛放保存，避免日曬雨淋、高溫與化學品，並清楚標示額定荷重。圖中吊具比例放大，損傷樣態為示意，報廢的量化基準（斷絲比例、直徑減少量、伸長量等）依起重升降機具安全規則、職業安全衛生設施規則、製造者資料、施工計畫與相關法規辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;

function iso([x, y, z], projection) {

    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

    return [cosA, sinA];

    const { sinA, cosA, sinE, cosE } = cameraOf(projection);

const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

function pathOf(points, closed = false) {
    if (!points.length)

function roundedPlan({ x, y, w, d, r }, steps = 8) {

        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {

function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {

        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {

function extrude(ring, z, height, projection, options = {}) {

    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);

    }
