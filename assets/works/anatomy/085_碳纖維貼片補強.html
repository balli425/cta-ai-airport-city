dden="true"><path d="M1.5 5h13"/></svg>柱旁直條＝承載力示意：虛線為該柱容量，到達即破壞</span></span><span class="iso-caption">老屋耐震補強常用的碳纖維貼片工法示意：混凝土表面研磨、柱角倒圓，裂縫先注入環氧樹脂修補，塗底漆後以含浸樹脂將碳纖維布貼附，柱以環向包覆（圍束）提高剪力強度與韌性，梁以 U 型包覆補強剪力、梁底縱向貼片補強撓曲，滾壓排除氣泡後依設計層數貼第二層，再施作面塗保護（如需防火另依設計施作防火被覆）。最後的反覆側向力對照中，裂縫、剝落、側移量與承載力直條皆為示意，不代表實際強度倍數。補強範圍、纖維方向、層數、搭接長度、倒角半徑與材料規格應依設計圖說及結構技師之補強設計辦理，並依相關法規與材料廠商施工說明施作及檢驗。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
