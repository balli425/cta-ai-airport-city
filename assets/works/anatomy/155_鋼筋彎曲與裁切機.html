</style><script>(()=>{const S=[{"name":"危害：捲夾・夾切・甩動","desc":"轉盤插銷會夾手，刀口會夾切，彎曲時鋼筋另一端會大幅甩動。"},{"name":"✕ 手靠近轉盤插銷","desc":"手扶在彎曲點旁、戴棉手套就啟動，手被夾在鋼筋與插銷之間。"},{"name":"✕ 站在甩動範圍內","desc":"彎曲時鋼筋自由端掃過一大片，旁人走進範圍就被打到。"},{"name":"✕ 手扶短料靠近刀口","desc":"短料用手扶著裁切，手緊貼刀口，一動作手就被帶進去。"},{"name":"✓ 彎曲：手離轉盤","desc":"握在遠離轉盤處、甩動範圍內不站人，用腳踏開關，放開即停。"},{"name":"✓ 裁切：護罩與托架","desc":"刀口護罩放下，長料放托架，手離刀口；短料不用手扶。"},{"name":"檢查重點","desc":"緊急停止鈕、護罩、外殼接地與漏電斷路器；調整清理先停機斷電。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
