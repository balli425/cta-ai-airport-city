    out.push(L(poly([[96, 2.2, f + 9.05], [108, 2.2, f + 9.05], [108, 8.8, f + 9.05], [96, 8.8, f + 9.05]], true), "mid"));
    // 水龍頭：下降管 → 壓力錶 → 出水口
    out.push(vpipe(102, 3, f + 13, zb, 0.7, "pipeB"));
    out.push(ypipe(3, 4.4, 102, f + 17.5, 0.35, "fit"));
    out.push(gauge(102, 4.4, f + 17.5, 2.1, st.p[i], 0.18));
    out.push(elbow(102, 3, f + 13, 0.7));
    out.push(ypipe(3, 6.4, 102, f + 13, 0.6, "tap"));
    out.push(cyl(102, 6.4, 0.75, f + 11.8, 1.8, "tap", { steps: 12 }));
    out.push(box(101.4, 3.4, f + 14, 102.6, 5.6, f + 14.6, "tap"));
    // 水柱：粗細與流速隨水壓
    const w = 0.3 + 0.85 * flow * flow, zz = f + 11.8, zl = f + 9.06, side = [0.62 * w, -0.62 * w, 0];
    out.push(`<path class="stream" d="${poly([[102 + side[0], 6.4 + side[1], zz], [102 + side[0] * 0.75, 6.4 + side[1] * 0.75, zl], [102 - side[0] * 0.75, 6.4 - side[1] * 0.75, zl], [102 - side[0], 6.4 - side[1], zz]], true)}"/>`);
    out.push(cdots(flowDots([[102, 6.9, zz], [102, 6.9, zl]], st.u * (4 + 10 * flow), 1.1), 0.22 + 0.16 * flow, "c-sdot"));
    const ph = (st.u * 1.4) % 1, sr = 0.8 + ph * (1.6 + 2 * flow);
    out.push(`<path class="iso-line c-ripple" style="opacity:${(0.8 * (1 - ph)).toFixed(2)}" d="${poly(circ(0, 0, 1, 16).map(([a, b]) => [102 + a * sr, 6.2 + b * sr * 0.7, zl + 0.02]), true)}"/>`);
    // 支管水流
    out.push(wdots(top ? [[DF[0], DF[1], zb], [DF[0], 3, zb], [89.6, 3, zb]] : [[DF[0], DF[1], zb], [DF[0], 3, zb], [102, 3, zb], [102, 3, f + 13]], st.u * 6, 1, 3.4, 0.5));
    if (top) out.push(wdots([[94.4, 3, zb], [102, 3, zb], [102, 3, f + 13]], st.u * (6 + 6 * st.boost), 1, 3.4, 0.5));
    // 揚水管（本層段）
    out.push(vpipe(RIS[0], RIS[1], f, f + 27, 1.3, (Math.max(st.ra, st.rb) > 0.5 ? "pipeHot" : "pipeR")));
    out.push(collarV(RIS[0], RIS[1], f + 13.5, 1.3));
    out.push(box(RIS[0] - 0.4, -0.05, f + 10, RIS[0] + 0.4, RIS[1] - 1.2, f + 10.8, "steelb", { bevel: 0.05 }));
    out.push(wdots([[RIS[0], RIS[1], f], [RIS[0], RIS[1], f + 27]], st.u * 10, Math.max(st.ra, st.rb)));
    return out.join("");
  }

  // ── 屋頂：水塔、電極、揚水管頂、下行管、溢水管、排水管 ──
  function roof(st) {
    const out = [], zs = st.zs, on = Math.max(st.ra, st.rb);
    // 落水頭
    out.push(cyl(54.5, 36, 4.4, ROOF, 0.5, "drainc", { steps: 22 }));
    out.push(cyl(54.5, 36, 3.2, ROOF + 0.5, 1.2, "drainc", { steps: 22, inner: "" }));
    const gr = []; for (let d = -2.4; d <= 2.4; d += 1.2) gr.push(seg([54.5 + d, 36 - Math.sqrt(10.24 - d * d), ROOF + 1.72], [54.5 + d, 36 + Math.sqrt(10.24 - d * d), ROOF + 1.72]));
    out.push(L(gr.join(""), "lo"));
    // 訊號線（屋頂段，畫在台座上）
    // 水塔基座：RC 墩＋鋼梁
    for (const y of [8, 18, 28]) {
      out.push(box(17, y - 1.6, ROOF, 49, y + 1.6, ROOF + 3, "conc"));
      out.push(box(17.5, y - 1, ROOF + 3, 48.5, y + 1, 127, "steelb", { bevel: 0.1 }));
    }
    // 下行管出口（池底 → 閘閥 → 往左 → 穿屋頂板）
    out.push(vpipe(22, 14, 124.5, 127, 1.3, "pipeD"));
    out.push(elbow(22, 14, 124.5, 1.3));
    out.push(xpipe(DF[0], 22, 14, 124.5, 1.3, "pipeD"));
    out.push(cyl(14, 14, 2, 122.6, 3.8, "valve", { steps: 16 }));
    out.push(cyl(14, 14, 1.8, 126.8, 0.4, "wheel", { steps: 16 }));
    out.push(elbow(DF[0], DF[1], 124.5, 1.3));
    out.push(vpipe(DF[0], DF[1], ROOF, 124.5, 1.3, "pipeD"));
    out.push(wdots([[22, 14, 127], [22, 14, 124.5], [DF[0], 14, 124.5], [DF[0], DF[1], ROOF]], st.u * 9, 1, 3.6));
    // 排水管（池底 → 閥 → 落水頭，間接排水）
    out.push(vpipe(36, 23, 124.6, 127, 0.9, "pipeO"));
    out.push(elbow(36, 23, 124.6, 0.9));
    out.push(xpipe(36, 52, 23, 124.6, 0.9, "pipeO"));
    out.push(pX(circ(23, 124.6, 1.4, 14), 42, 44.6, { m: "valve" }));
    out.push(elbow(52, 23, 124.6, 0.9));
    out.push(ypipe(23, 36, 52, 124.6, 0.9, "pipeO"));
    out.push(elbow(52, 36, 124.6, 0.9));
    out.push(vpipe(52, 36, 123.2, 124.6, 0.9, "pipeO"));
    // 揚水管：屋頂段 → 水塔頂進水
    out.push(vpipe(RIS[0], RIS[1], ROOF, 154, 1.3, (Math.max(st.ra, st.rb) > 0.5 ? "pipeHot" : "pipeR")));
    out.push(box(RIS[0] - 1.6, RIS[1] - 1.6, ROOF, RIS[0] + 1.6, RIS[1] + 1.6, ROOF + 1.2, "fit"));
    out.push(collarV(RIS[0], RIS[1], 140, 1.3));
    out.push(wdots([[RIS[0], RIS[1], ROOF], [RIS[0], RIS[1], 154]], st.u * 10, on));
    // 水塔內：進水口、出水口、電極
    out.push(vpipe(40, 19, 147.8, 151, 1.1, (Math.max(st.ra, st.rb) > 0.5 ? "pipeHot" : "pipeR")));
    out.push(cyl(40, 19, 1.5, 147.4, 0.6, "fit", { steps: 14 }));
    // 電極棒（E1 共通、E2 停泵 HWL、E3 起泵 LWL、E4 減水警報）
    const rods = [[44, 129.2, "E1"], [45.4, RZ(HWL), "E2"], [46.8, RZ(LWL), "E3"], [48.2, 131.4, "E4"]];
    const rl = [];
    for (const [x, zt] of rods) rl.push(seg([x, 25, 151], [x, 25, zt]));
    out.push(`<path class="iso-line c-rod" d="${rl.join("")}"/>`);
    const hitE2 = st.stopA || st.stopB, hitE3 = st.startA || st.startB;
    out.push(cdots(rods.filter(([, zt, n]) => zt < zs && !(n === "E2" && hitE2) && !(n === "E3" && hitE3)).map(([x, zt]) => [x, 25, zt]), 0.5, "c-wet"));
    out.push(cdots(rods.filter(([, zt, n]) => zt >= zs && !(n === "E2" && hitE2) && !(n === "E3" && hitE3)).map(([x, zt]) => [x, 25, zt]), 0.5, "c-dry"));
    if (hitE2) out.push(cdots([[45.4, 25, RZ(HWL)]], 0.8, "c-flash"));
    if (hitE3) out.push(cdots([[46.8, 25, RZ(LWL)]], 0.8, "c-flash"));
    // 水
    out.push(`<g class="water">${box(TR.x0 + 0.6, TR.y0 + 0.6, 128, TR.x1 - 0.6, TR.y1 - 0.6, zs, "water", { bevel: 0, crease: "none" })}</g>`);
    if (on > 0.05) {
      const w = 0.6 * on, side = [0.62 * w, -0.62 * w, 0];
      out.push(`<path class="stream" d="${poly([[40 + side[0], 19 + side[1], 147.4], [40 + side[0], 19 + side[1], zs], [40 - side[0], 19 - side[1], zs], [40 - side[0], 19 - side[1], 147.4]], true)}"/>`);
      const rp = []; for (let i = 0; i < 4; i++) { const ph = (st.u * 0.5 + i / 4) % 1, r = 1.5 + ph * 8; rp.push(poly(circ(0, 0, 1, 20).map(([a, b]) => [40 + a * r, 19 + b * r * 0.8, zs + 0.05]), true)); }
      out.push(`<path class="iso-line c-ripple" style="opacity:${(0.7 * on).toFixed(2)}" d="${rp.join("")}"/>`);
      out.push(cdots(flowDots([[40, 19.7, 147.4], [40, 19.7, zs]], st.u * 14, 2), 0.4, "c-sdot"));
    }
    // 水位刻度（外殼前面）
    // 外殼（FRP 組合式，半透明）
    const pn = [];
    for (let x = TR.x0 + 8.5; x < TR.x1 - 1; x += 8.5) pn.push(seg([x, TR.y1 + 0.02, TR.z0], [x, TR.y1 + 0.02, TR.z1]));
    for (let z = TR.z0 + 8; z < TR.z1 - 1; z += 8) pn.push(seg([TR.x0, TR.y1 + 0.02, z], [TR.x1, TR.y1 + 0.02, z]), seg([TR.x1 + 0.02, TR.y0, z], [TR.x1 + 0.02, TR.y1, z]));
    for (let y = TR.y0 + 8; y < TR.y1 - 1; y += 8) pn.push(seg([TR.x1 + 0.02, y, TR.z0], [TR.x1 + 0.02, y, TR.z1]));
    out.push(`<g class="shell">${box(TR.x0, TR.y0, TR.z0, TR.x1, TR.y1, TR.z1, "tank", { bevel: 0.4, inner: L(pn.join(""), "lo") })}</g>`);
    // 水位標線（LWL / HWL）於前面板
    out.push(`<path class="iso-line c-lwl" d="${seg([TR.x1 - 7, TR.y1 + 0.05, RZ(LWL)], [TR.x1, TR.y1 + 0.05, RZ(LWL)])}"/>`);
    out.push(`<path class="iso-line c-hwl" d="${seg([TR.x1 - 7, TR.y1 + 0.05, RZ(HWL)], [TR.x1, TR.y1 + 0.05, RZ(HWL)])}"/>`);
    out.push(`<path class="iso-line c-surf" d="${seg([TR.x0, TR.y1 + 0.06, zs], [TR.x1, TR.y1 + 0.06, zs]) + seg([TR.x1 + 0.06, TR.y0, zs], [TR.x1 + 0.06, TR.y1, zs])}"/>`);
    // 頂蓋：人孔、通氣管、電極座
    out.push(cyl(24, 12, 3.2, TR.z1, 0.9, "tank", { steps: 24 }));
    out.push(cyl(24, 12, 2.4, TR.z1 + 0.9, 0.4, "tank", { steps: 24 }));
    out.push(vpipe(30, 24, TR.z1, TR.z1 + 4, 0.7, "steelb"));
    out.push(cyl(30, 24, 1.8, TR.z1 + 4, 1.2, "vent", { steps: 18, bevel: 0.6 }));
    out.push(box(43, 23, TR.z1, 49, 27, TR.z1 + 2.6, "holder"));
    out.push(L(poly(SIGR.slice(0, 1).concat([[46, 27, 153.6]])), "lo"));
    // 揚水管頂部：彎頭 → 水平 → 下穿頂蓋
    out.push(elbow(RIS[0], RIS[1], 154, 1.3));
    out.push(xpipe(40, RIS[0], RIS[1], 154, 1.3, (Math.max(st.ra, st.rb) > 0.5 ? "pipeHot" : "pipeR")));
    out.push(elbow(40, 19, 154, 1.3));
    out.push(vpipe(40, 19, 151, 154, 1.3, (Math.max(st.ra, st.rb) > 0.5 ? "pipeHot" : "pipeR")));
    out.push(box(43.6, 18, TR.z1, 45.2, 20, 152.7, "steelb"));
    out.push(wdots([[RIS[0], RIS[1], 154], [40, 19, 154], [40, 19, 151]], st.u * 10, on));
    // 溢水管：側壁上方 → 落水頭上方（間接排水，管口加防蟲網）
    out.push(xpipe(TR.x1, 57, 28, 147, 1.1, "pipeO"));
    out.push(pX(circ(28, 147, 1.7, 14), TR.x1, TR.x1 + 0.8, { m: "fit" }));
    out.push(elbow(57, 28, 147, 1.1));
    out.push(vpipe(57, 28, 125.5, 147, 1.1, "pipeO"));
    out.push(box(56, 28.6, 134, 58, 30.4, 135, "steelb"));
    out.push(elbow(57, 28, 125.5, 1.1));
    out.push(ypipe(28, 36, 57, 125.5, 1.1, "pipeO"));
    out.push(elbow(57, 36, 125.5, 1.1));
    out.push(vpipe(57, 36, 123.4, 125.5, 1.1, "pipeO"));
    out.push(cyl(57, 36, 1.4, 123, 0.4, "screen", { steps: 14 }));
    // 爬梯
    const ld = [];
    for (const x of [19, 22.4]) ld.push(seg([x, TR.y1 + 1.2, ROOF], [x, TR.y1 + 1.2, TR.z1 + 2]));
    for (let z = ROOF + 3; z < TR.z1 + 1; z += 3) ld.push(seg([19, TR.y1 + 1.2, z], [22.4, TR.y1 + 1.2, z]));
    out.push(`<path class="iso-line c-ladder" d="${ld.join("")}"/>`);
    for (const z of [ROOF + 8, 140]) out.push(L(seg([19, TR.y1, z], [19, TR.y1 + 1.2, z]) + seg([22.4, TR.y1, z], [22.4, TR.y1 + 1.2, z]), "mid"));
    // 訊號線：電極座 → 水塔前面 → 屋頂 → 後牆
    const ev = st.startA || st.startB || st.stopA || st.stopB;
    out.push(`<path class="iso-line c-sig${ev ? " on" : ""}" d="${poly(SIGR)}"/>`);
    if (ev) {
      const t0 = st.startA ? tA : st.startB ? tB : st.stopA ? tAoff : 0;
      out.push(cdots(flowDots(SIGR, (st.u - t0) * 130, 26), 0.5, "c-pulse"));
    }
    return out.join("");
  }
  return { LOOP, tA, tAoff, tB, T_BOOST, state, base, walls, sigWall, pumpRoom, tankU, partition, rightWall, outside, city, slab, floor, roof, FL, ROOF };
}

const SC = makeScene(P);
const LOOP = SC.LOOP;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const narrow = matchMedia("(max-width:560px)");
const fitView = () => svg.setAttribute("viewBox", narrow.matches ? "226 101 448 653" : "0 0 680 760");
fitView(); narrow.addEventListener("change", fitView);
const G = {}; for (const n of ["sig", "pumps", "tankU", "city", "f0", "f1", "f2", "f3", "roof"]) G[n] = svg.querySelector('[data-part="' + n + '"]');
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
let t = 0, last = 0, frame = 0, visible = false, playing = !still.matches, idle = 0;
function textOf(st) {
  const pm = st.ra > 0.5 ? "泵A 運轉" : st.rb > 0.5 ? "泵B 運轉" : "停泵（下次" + st.next + "）";
  return "水塔 " + Math.round(st.L * 100) + "% · 地下水池 " + Math.round(st.G * 100) + "% · " + pm + " · 1F " + st.p[0].toFixed(2) + "／4F " + st.p[3].toFixed(2) + " MPa" + (st.boost > 0.5 ? "（加壓）" : "") + "（示意）";
}
function draw() {
  const st = SC.state(t);
  G.sig.innerHTML = SC.sigWall(st);
  G.pumps.innerHTML = SC.pumpRoom(st);
  G.tankU.innerHTML = SC.tankU(st);
  G.city.innerHTML = SC.city(st);
  for (let i = 0; i < 4; i++) G["f" + i].innerHTML = SC.floor(i, st);
  G.roof.innerHTML = SC.roof(st);
  if (window.ctaStep) ctaStep(st.step);
  const text = textOf(st);
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
  stage.setAttribute("aria-valuenow", st.u.toFixed(1));
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  if (playing) t = (t + dt) % LOOP;
  draw();
  frame = visible && playing ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const scrub = (to) => { playing = false; t = ((to % LOOP) + LOOP) % LOOP; draw(); clearTimeout(idle); idle = setTimeout(() => { playing = !still.matches; run(); }, 3000); };
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (event) => {
  const b = svg.getBoundingClientRect();
  scrub(Math.max(0, Math.min(1, ((event.clientX - b.left) / b.width - 0.06) / 0.88)) * LOOP * 0.999);
});
stage.addEventListener("keydown", (event) => {
  if (event.key === " ") { event.preventDefault(); playing = !playing; clearTimeout(idle); run(); return; }
  let to = null;
  if (event.key === "ArrowRight") to = t + 0.25;
  if (event.key === "ArrowLeft") to = t - 0.25;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = LOOP - 0.01;
  if (to === null) return;
  event.preventDefault();
  scrub(to);
});
if (still.matches) t = 8.6;
const q0 = new URLSearchParams(location.search).get("t");
if (q0 !== null) { t = +q0; playing = false; }
draw(); run();
</script></body></html>
