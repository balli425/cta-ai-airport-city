atch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>石板藍：柱；砂色：梁；淺砂：樓板（向後延伸）；赭色：振動台致動器</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅圓盤＝塑鉸（指針隨轉角轉動，外圈亮起＝正在塑性轉動）；右側看板：各層層間變位角，虛線為 2% 參考線</span></span><span class="iso-caption">五層三跨 RC 構架置於振動台上，台面反覆推拉、幅值逐級加大。強柱弱梁：柱的撓曲強度高於梁，塑鉸依序出現在各層梁端（下層先、上層後），最後才在柱底形成，構成梁側移機構，各層層間變位接近均勻，損傷與消能分散於多層；切換為弱柱強梁後，一樓柱頂、柱底先形成塑鉸，上方樓層幾乎呈剛體平移，層間變位集中於一樓，加上 P-Δ 效應形成軟弱層崩塌（層崩塌）。梁柱強度比等設計要求依設計圖說及適用規範辦理。變位放大 4 倍；塑鉸指針轉角另行放大；幅值、門檻、塑鉸數等均為示意。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);

  const KF = [1.3, 1.15, 1.0, 0.85, 0.7];                      // 梁端轉角需求沿高度遞減
  const THY = 0.5, THC = 1.2, RY = 0.35, THCW = 0.4;            // 梁降伏轉角、柱底塑鉸門檻、弱柱降伏（%）
  const ease = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u));
  // 回傳：屋頂變位角 R、本週期內已達最大 |R|
  function cyc(u, A) {
    const n = Math.min(A.length - 1, Math.floor(u / TC)), ph = (u - n * TC) / TC;
    if (u >= A.length * TC) return { R: 0, mx: Math.max(...A) };
    const ramp = n === 0 ? Math.min(1, ph * 3) : 1;
    const R = A[n] * Math.sin(2 * Math.PI * ph) * ramp;
    const prev = n ? Math.max(...A.slice(0, n)) : 0;
    const reach = ph >= 0.25 ? A[n] : Math.abs(R);
    return { R, mx: Math.max(prev, reach) };
  }
  function model(t) {
    t = ((t % TOUR) + TOUR) % TOUR;
    const m = { t, mode: t < TS ? 0 : 1, r: [], u: [0], dz: 0, xg: 0, hb: [], hc: [], state: 0, collapse: 0 };
    if (m.mode === 0) {
      const { R, mx } = cyc(t, AS);
      m.R = R;
      for (let i = 0; i < NS; i++) m.r.push(R * KF[i]);
      // 塑鉸：已形成（記憶）＋目前活動程度
      for (let i = 0; i < NS; i++) {
        const formed = mx * KF[i] > THY, act = formed ? Math.max(0, Math.min(1, (Math.abs(m.r[i]) - THY) / 0.6)) : 0;
        m.hb.push({ formed, act });
      }
      const fc = mx > THC, ac = fc ? Math.max(0, Math.min(1, (Math.abs(R) - THC) / 0.5)) : 0;
      m.hc = [{ formed: fc, act: ac }];
      const nf = m.hb.filter((h) => h.formed).length;
      m.state = fc ? 3 : nf === NS ? 2 : nf > 0 ? 1 : 0;
    } else {
      const u = t - TS;
      let R, mx;
      if (u < TWC) ({ R, mx } = cyc(u, AW));
      else {
        const c = ease((u - TWC) / TCOL);
        m.collapse = c;
        R = 0.1 + c * 2.6; mx = 9;
      }
      m.R = R;
      const a = Math.abs(R), sg = Math.sign(R) || 1;
      const r1 = a < RY ? R : sg * (NS * a - (NS - 1) * RY);
      m.r.push(r1);
      for (let i = 1; i < NS; i++) m.r.push(a < RY ? R : sg * RY * (1 - 0.4 * m.collapse));
      const formed = mx * NS - (NS - 1) * RY > THCW && mx > RY, act = formed ? Math.max(0, Math.min(1, (Math.abs(r1) - THCW) / 1.5)) : 0;
      m.hc = [{ formed, act }, { formed, act }];
      for (let i = 0; i < NS; i++) m.hb.push({ formed: false, act: 0 });
      m.state = m.collapse > 0.02 || u >= TWC ? 6 : formed ? 5 : 4;
    }
    // 視覺位移（放大 EX 倍）
    for (let i = 0; i < NS; i++) m.u.push(m.u[i] + m.r[i] / 100 * HS * EX);
    const u1 = m.u[1];
    m.dz = m.mode ? HS - Math.sqrt(Math.max(0, HS * HS - u1 * u1)) : 0;
    m.xg = m.collapse > 0 ? 0 : -0.28 * m.u[NS];
    m.hingeB = m.hb.filter((h) => h.formed).length * 6;
    m.hingeC = m.mode ? (m.hc[0].formed ? 8 : 0) : (m.hc[0].formed ? 4 : 0);
    return m;
  }

  const stage = document.querySelector(".iso-stage");
  const svgEl = stage.querySelector("svg");
  const rig = svgEl.querySelector('[data-part="rig"]'), barsG = svgEl.querySelector('[data-part="bars"]');
  const readout = document.querySelector("[data-readout]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");

  function draw(m) {
    const out = [], strong = m.mode === 0;
    const CH = strong ? 3.6 : 2.1, BD = strong ? 5 : 8.5;      // 柱半寬、梁深（強柱 vs 弱柱）
    const xg = m.xg;
    const Z = [Z0]; for (let i = 1; i <= NS; i++) Z.push(Z0 + i * HS - m.dz);
    const U = m.u.map((v) => v + xg);
    // 振動台台面（隨 xg 移動）＋滑塊＋致動器
    for (const y of [-20, 0]) for (const x of [-74, -30, 30, 74]) out.push(boxW(x - 4 + xg, x + 4 + xg, y - 3, y + 3, -6.4, -5, "m-steel", "mid"));
    out.push(boxW(-88 + xg, 96 + xg, -28, 10, -5, 0, "m-table", "hi",
      null, '<path class="iso-line" data-tone="faint" d="' + [-60, -20, 20, 60].map((x) => seg([x + xg, 10, -2.5], [x + 10 + xg, 10, -2.5])).join("") + '"/>'));
    // 台面指針（指向刻度尺）
    out.push(boxW(-1 + xg, 1 + xg, 10, 21, -4, -3, "m-brass", "mid"));
    {
      const xa = -104, xe = -88 + xg;
      out.push(cylX(xa, xa + 9, 0, 6, 4.2, "m-act"));
      out.push(cylX(xa + 9, xa + 11, 0, 6, 3.2, "m-act"));
      out.push(cylX(xa + 11, xe - 3, 0, 6, 1.6, "m-rod"));
      out.push(boxW(xe - 3, xe, -4, 4, 2, 10, "m-steel", "mid", null, '<g class="iso-dots" data-tone="hi">' + [[-2, 3.5], [2, 3.5], [-2, 8.5], [2, 8.5]].map(([y, z]) => { const p = at([xe, y, z]); return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="0.45"/>'; }).join("") + "</g>"));
      out.push('<path class="iso-line" data-tone="mid" d="' + pathOf([[xa + 4, 4, 10], [xa + 3, 7, 16], [xa - 2, 10, 18]].map(at)) + '"/>');
    }
    // 地梁
    out.push(boxW(-72 + xg, 72 + xg, -5, 5, 0, Z0, "m-footing", "mid"));
    const hingeMarks = [];
    for (let i = 1; i <= NS; i++) {
      const zb = Z[i - 1], zt = Z[i] - 2, ub = U[i - 1], ut = U[i];
      const sh = (z) => ub + (ut - ub) * (z - zb) / (Z[i] - zb);
      // 柱（本層，至樓板底）
      for (const xc of XC) {
        const crk = [];
        if (i === 1 && m.hc[0] && m.hc[0].formed) for (const dzc of [2.5, 4.8]) crk.push(seg([xc - CH + 0.5 + sh(zb + dzc), CH + 0.05, zb + dzc], [xc + CH - 0.5 + sh(zb + dzc), CH + 0.05, zb + dzc + 0.6]));
        if (!strong && i === 1 && m.hc[1] && m.hc[1].formed) for (const dzc of [BD + 3, BD + 5.4]) { const z = Z[1] - 2 - dzc; crk.push(seg([xc - CH + 0.5 + sh(z), CH + 0.05, z], [xc + CH - 0.5 + sh(z), CH + 0.05, z - 0.6])); }
        out.push(boxW(xc - CH, xc + CH, -CH, CH, zb, zt, "m-col", "hi", sh, lineS(crk.join(""), "crk")));
      }
      // 梁
      for (let b = 0; b < 3; b++) {
        const xl = XC[b] + CH + ut, xr = XC[b + 1] - CH + ut, h = m.hb[i - 1];
        const crk = [];
        if (h.formed) for (const x of [xl + 1.2, xl + 2.6, xr - 1.2, xr - 2.6]) crk.push(seg([x, 3.05, zt - 0.4], [x + (x < (xl + xr) / 2 ? 0.5 : -0.5), 3.05, zt - BD * 0.7]));
        out.push(boxW(xl, xr, -3, 3, zt - BD, zt, "m-beam", "hi", null, lineS(crk.join(""), "crk")));
        if (h.formed) {
          const ang = Math.atan(m.r[i - 1] / 100 * EX) * 6;
          hingeMarks.push(disc(xl + 3.4, zt - BD / 2, 3.05, Math.min(2.2, BD / 2 - 0.3), h.act > 0 ? "m-hgon" : "m-hg", ang, h.act));
          hingeMarks.push(disc(xr - 3.4, zt - BD / 2, 3.05, Math.min(2.2, BD / 2 - 0.3), h.act > 0 ? "m-hgon" : "m-hg", ang, h.act));
        }
      }
      // 樓板（向後延伸）＋女兒牆
      out.push(boxW(-72 + ut, 72 + ut, -26, 2.6, Z[i] - 2, Z[i], "m-slab", "hi"));
      if (i === NS) out.push(boxW(-72 + ut, 72 + ut, 1.4, 2.6, Z[i], Z[i] + 3, "m-slab", "mid"));
      // 梁柱接頭（穿過樓板）
      for (const xc of XC) out.push(boxW(xc - CH + ut, xc + CH + ut, -CH, CH, Z[i] - 2, Z[i] + (i === NS ? 0.6 : 0), "m-col", "mid"));
      // 柱端塑鉸標記
      if (i === 1) {
        const colAng = Math.atan((ut - ub) / (Z[1] - zb)) * 2.2;
        if (m.hc[0] && m.hc[0].formed) for (const xc of XC) hingeMarks.push(disc(xc + sh(zb + 3.2), zb + 3.2, CH + 0.05, Math.min(2.2, CH - 0.3), m.hc[0].act > 0 ? "m-hgon" : "m-hg", colAng, m.hc[0].act));
        if (!strong && m.hc[1] && m.hc[1].formed) for (const xc of XC) { const z = Z[1] - 2 - BD - 3.2; hingeMarks.push(disc(xc + sh(z), z, CH + 0.05, Math.min(2.2, CH - 0.3), m.hc[1].act > 0 ? "m-hgon" : "m-hg", colAng, m.hc[1].act)); }
      }
    }
    out.push(...hingeMarks);
    rig.innerHTML = out.join("");
    // 看板長條（各層層間變位角）
    const { x0, x1, y } = BOARD, bars = [];
    const X = (r) => x0 + 5 + Math.min(1, Math.abs(r) / 3.2) * (x1 - x0 - 7);
    let g = "";
    for (const r of [1, 2, 3]) g += seg([X(r), y + 0.02, Z0 + 2], [X(r), y + 0.02, Z0 + NS * HS - 2]);
    bars.push('<path class="gr" d="' + g + '"/>');
    bars.push('<path class="lim" d="' + seg([X(2), y + 0.03, Z0 + 1], [X(2), y + 0.03, Z0 + NS * HS - 1]) + '"/>');
    for (let i = 0; i < NS; i++) {
      const zc = Z0 + (i + 0.5) * HS, r = Math.abs(m.r[i]);
      const over = r > 3.2;
      bars.push(boxW(x0 + 5, Math.max(x0 + 5.3, X(r)), y, y + 0.8, zc - 3, zc + 3, r > 2 ? "m-barhi" : "m-bar", "mid"));
      if (over) bars.push('<path class="pulse" d="' + pathOf([[x1 - 2.6, y + 0.9, zc + 2.6], [x1 - 0.8, y + 0.9, zc], [x1 - 2.6, y + 0.9, zc - 2.6]].map(at)) + '"/>');
    }
    barsG.innerHTML = bars.join("");
    // 面板狀態（遲滯 0.35 秒；拖曳或暫停時立即）
    const cand = m.state;
    if (cand !== cs) { csT += 1 / 60; if (csT > 0.35 || !playing || manual) { cs = cand; csT = 0; } } else csT = 0;
    if (window.ctaStep) window.ctaStep(cs);
    if (window.ctaLabels) window.ctaLabels(cs);
    let mi = 0; for (let i = 1; i < NS; i++) if (Math.abs(m.r[i]) > Math.abs(m.r[mi])) mi = i;
    const sgn = (v) => (v >= 0 ? "+" : "−");
    const text = (strong ? "強柱弱梁" : "弱柱強梁") + " · 屋頂變位角 " + sgn(m.R) + Math.abs(m.R).toFixed(2) + "% · 最大層間 " + Math.abs(m.r[mi]).toFixed(1) + "%（" + (mi + 1) + "F）· 塑鉸 梁 " + m.hingeB + "／柱 " + m.hingeC;
    if (readout.textContent !== text) readout.textContent = text;
    stage.setAttribute("aria-valuetext", text);
    stage.setAttribute("aria-valuenow", m.t.toFixed(1));
  }

  let t = 0, cs = 0, csT = 0, last = 0, frameId = 0, visible = false, playing = !still.matches, manual = false, idle = 0;
  const render = () => draw(model(t));
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
    last = now;
    if (playing && !manual) t = (t + dt) % TOUR;
    render();
    frameId = visible && playing && !manual ? requestAnimationFrame(tick) : 0;
  }
  const run = () => { if (!frameId && visible && playing && !manual) { last = 0; frameId = requestAnimationFrame(tick); } };
  const hold = () => { manual = true; clearTimeout(idle); idle = setTimeout(() => { manual = false; run(); }, 6000); };
  new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) { render(); run(); } }, { rootMargin: "120px 0px" }).observe(stage);
  stage.addEventListener("pointermove", (ev) => {
    if (ev.pointerType === "touch") return;
    const b = svgEl.getBoundingClientRect(), s = Math.max(0, Math.min(1, ((ev.clientX - b.left) / b.width - 0.08) / 0.84));
    hold(); t = s * TOUR * 0.999; render();
  });
  stage.addEventListener("click", () => { hold(); t = t < TS ? TS + 0.01 : 0; render(); });
  stage.addEventListener("keydown", (ev) => {
    if (ev.key === " ") { ev.preventDefault(); playing = !playing; manual = false; clearTimeout(idle); render(); run(); return; }
    if (ev.key === "Enter") { ev.preventDefault(); hold(); t = t < TS ? TS + 0.01 : 0; render(); return; }
    if (ev.key === "ArrowRight" || ev.key === "ArrowUp") { ev.preventDefault(); hold(); t = (t + 0.3) % TOUR; render(); }
    if (ev.key === "ArrowLeft" || ev.key === "ArrowDown") { ev.preventDefault(); hold(); t = (t - 0.3 + TOUR) % TOUR; render(); }
    if (ev.key === "Home") { ev.preventDefault(); hold(); t = 0; render(); }
  });
  if (still.matches) t = TS - 2.0;
  const q0 = new URLSearchParams(location.search).get("t");
  if (q0 !== null) { t = +q0; playing = false; }
  render(); run();
})();</script></body></html>
