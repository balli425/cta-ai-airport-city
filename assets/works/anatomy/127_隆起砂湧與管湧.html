面滲水夾砂、周邊地表裂縫或下陷等徵兆，應立即停止開挖、撤離人員並通報，再以回填反壓（回填土、砂包或灌水）與止水灌漿等方式處置。預防上依地質調查檢核擋土壁貫入深度與開挖底面穩定，必要時地盤改良、降水或解壓，並設置水位與隆起等監測。圖中各項尺寸與處置方式皆為示意，實際依建築技術規則建築構造編（基礎構造設計規範）、營造安全衛生設施標準、設計圖說、施工計畫與相關法規辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

const still = matchMedia("(prefers-reduced-motion: reduce)");
let t = 0, last = 0, frame = 0, visible = false, playing = !still.matches, idle = 0;
function draw() {
  const st = SC.state(t);
  G.innerHTML = SC.draw(st);
  const moved = fitView(st);
  // 註記小字不出框
  const vbb = svg.viewBox.baseVal;
  G.querySelectorAll("text.nt").forEach((el) => { const b = el.getBBox(); let dx = 0; if (b.x < vbb.x + 4) dx = vbb.x + 4 - b.x; else if (b.x + b.width > vbb.x + vbb.width - 4) dx = vbb.x + vbb.width - 4 - (b.x + b.width); if (dx) el.setAttribute("x", (+el.getAttribute("x") + dx).toFixed(1)); });
  if (window.ctaStep) ctaStep(st.step);
  if (window.ctaLabels) { if (moved) ctaLabels(-9, 0); ctaLabels(st.step, 0); }
  const text = SC.textOf(st);
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
  stage.setAttribute("aria-valuenow", st.u.toFixed(1));
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  if (playing) t = (t + dt) % LOOP;
  draw();
  frame = visible && playing ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const scrub = (to) => { playing = false; t = ((to % LOOP) + LOOP) % LOOP; draw(); clearTimeout(idle); idle = setTimeout(() => { playing = !still.matches; run(); }, 3000); };
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (event) => {
  const b = svg.getBoundingClientRect();
  scrub(Math.max(0, Math.min(1, ((event.clientX - b.left) / b.width - 0.06) / 0.88)) * LOOP * 0.97);
});
stage.addEventListener("keydown", (event) => {
  if (event.key === " ") { event.preventDefault(); playing = !playing; clearTimeout(idle); run(); return; }
  let to = null;
  if (event.key === "ArrowRight") to = t + 0.25;
  if (event.key === "ArrowLeft") to = t - 0.25;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = LOOP - 1;
  if (to === null) return;
  event.preventDefault();
  scrub(to);
});
if (still.matches) t = 37.5;
const q0 = new URLSearchParams(location.search).get("t");
if (q0 !== null) { t = +q0; playing = false; }
draw(); run();
</script></body></html>
