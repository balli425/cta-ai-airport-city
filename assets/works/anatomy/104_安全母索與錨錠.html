</style><script>(()=>{const S=[{"name":"危害：無處可掛","desc":"邊緣作業無法設護欄時，沒有牢靠的掛點，安全帶形同虛設。"},{"name":"錯誤：綁在不牢靠處","desc":"母索隨手綁在水管、欄杆上；一受力就拉彎、拉脫，照樣墜落。"},{"name":"錨錠點","desc":"錨錠固定在柱、梁等結構體上，強度足以承受墜落的拉力。"},{"name":"水平母索","desc":"鋼索穿過中間支柱、固定於兩端錨錠，用緊線器拉緊。"},{"name":"過支柱：先掛後解","desc":"雙掛鉤一次只移一個，先掛到下一跨再解開，全程至少一鉤掛著。"},{"name":"垂直母索","desc":"上下爬梯用垂直母索與防墜器（抓繩器），一條一人，下端防脫。"},{"name":"墜落時的受力","desc":"母索被拉成 V 形，力量沿鋼索傳到兩端錨錠點，再傳入結構。"},{"name":"檢查重點","desc":"鋼索無斷絲扭結、錨錠無鬆動，並標示每跨可掛人數。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
