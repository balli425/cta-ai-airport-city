><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>琥珀色線：直射陽光；淡藍短線：葉片上表面反射進室內的擴散光；地板黃色光帶＝穿過葉片縫隙的直射光</span><span class="iso-key"><svg class="iso-swatch" data-mark="dotted" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>虛線弧：北緯 25° 夏至當天的太陽軌跡（示意）；屋頂桅桿上為日照計（白罩）與風速計（三杯）</span></span><span class="iso-caption">西向立面外側的可調式鋁合金遮陽葉片：每片葉片繞樞軸轉動，近端的曲柄全部接在一支垂直連桿上，由最下方一片同軸的馬達帶動，九片同步轉動。控制器以屋頂日照計判斷是否有直射，再用太陽高度與方位算出剖面角（太陽在立面垂直剖面上的仰角），把葉片轉到「剛好擋住直射」的截止角：太陽高時葉片近乎水平就夠，越接近日落越要關；縫隙仍放進擴散光與視野。風速超過設定值時轉回水平安全位置以降低風壓，夜間全閉保護隱私。圖中葉片寬 32 cm、間距 30 cm、截止角公式、時間軸、風速門檻與角度皆為示意；實際葉片規格、抗風壓、控制邏輯與門檻依產品規格及設計圖說，節能檢討依「建築技術規則建築設計施工編」綠建築專章及設計圖說。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;

  // ── 2D 剖面光線追跡 ──
  function bladeSeg(i, beta) {

  // 書桌、筆電、椅子
