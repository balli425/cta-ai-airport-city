/><circle cx="85.2" cy="353.9" r="0.45"/><circle cx="174.9" cy="371.8" r="0.45"/></g><g data-part="plot"></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>芯材（黃銅色＝彈性、磚紅＝降伏）；梅紫：脫層材；砂色：填充砂漿；鼠尾草綠：外套鋼管</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>青灰：節點板與拼接板；石板藍：梁柱；右側繪圖儀：紅線為目前迴圈，綠線為 BRB 對照迴圈</span></span><span class="iso-caption">單跨鋼構架梁柱與柱腳皆為鉸接，側力全由斜撐承擔；反力牆上的油壓致動器以位移控制、逐級加大層間變位角（0.15%→2%）反覆推拉。BRB 的鋼芯材中段縮小斷面作為降伏段，外包脫層材後置入填滿砂漿的鋼管：拉力時芯材直接降伏伸長；壓力時外管與砂漿提供側向束制，芯材只在脫層間隙內形成微小多波而不整體挫屈，因此拉壓都能降伏，迴圈飽滿；受壓強度略高於受拉（約 1.1 倍，即受壓強度調整係數 β），反覆後有應變硬化。外管不承受軸力，僅隨芯材浮動。切換後的一般方鋼管斜撐受壓約在 0.5 Py 即構面外挫屈，強度驟降、迴圈捏縮，反覆數圈後在中央塑鉸處局部挫屈。示意參數：芯材約 40 cm²（SN490B）、Py ≈ 1300 kN、降伏段長約 4.3 m；構架變位放大 4 倍、芯材微挫屈波形另行放大。數值為示意模型。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);

const tenth = (value) => {

function extrude(ring, z, height, projection, options = {}) {
