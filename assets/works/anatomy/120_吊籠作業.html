</style><script>(()=>{const S=[{"name":"危害：機構翻落・墜落","desc":"整個吊籠只靠屋頂的懸吊機構與鋼索；機構一翻、人就跟著掉。"},{"name":"✕ 配重不足","desc":"配重塊放不夠又沒固定，懸吊機構翻落，吊籠傾斜、人員滑出。"},{"name":"✕ 墊高探身・沒掛安全帶","desc":"在吊籠內放梯凳墊高、身體探出護欄，安全帶沒掛就直接墜落。"},{"name":"✓ 配重足夠並固定","desc":"依製造者規定放足配重並固定，支點放在強度足夠的結構上。"},{"name":"✓ 獨立救生索","desc":"屋頂另設錨錠點，救生索獨立於懸吊系統，沿外牆垂到地面。"},{"name":"✓ 安全帶掛救生索","desc":"戴安全帽、穿全身背負式安全帶，掛在救生索的防墜器上。"},{"name":"✓ 下方管制・升降作業","desc":"下方圍出危險區域並設警告標示；不超載，強風大雨停止作業。"},{"name":"檢查重點","desc":"每日作業前檢點鋼索、制動、安全裝置與配重；操作中不離開位置。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
