</style><script>(()=>{const S=[{"name":"危害：垂直上下","desc":"爬梯上下手腳都在用，沒有連續的防墜，一滑就直落到底。"},{"name":"錯誤：短掛繩換掛","desc":"短掛繩往上爬要解開再掛；解開的那一瞬間，人完全沒有連結。"},{"name":"裝設：掛在正上方","desc":"防墜器掛在作業位置正上方的錨錠點，索端鉤住背部 D 環。"},{"name":"慢速上下：自動收放","desc":"慢慢拉出時棘爪不動，索自由放出；往上時彈簧自動回收。"},{"name":"墜落：瞬間鎖定","desc":"索被急速拉出，離心力把棘爪甩出卡住棘輪，短距離內鎖住。"},{"name":"鎖定之後","desc":"力量經索傳到錨錠點；人懸吊不可久，儘速救援或自行復位。"},{"name":"使用前檢查","desc":"先急拉測試會鎖定、能回收；限正下方使用，受衝擊後送檢。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
