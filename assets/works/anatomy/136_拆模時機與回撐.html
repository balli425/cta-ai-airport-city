@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}

.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}

</style><script>(()=>{const S=[{"name":"危害：樓板還沒有強度","desc":"混凝土強度隨齡期慢慢成長；強度不足時全靠模板與支撐。"},{"name":"✕ 強度不足就拆","desc":"趕進度把支撐與底模拆光，樓板撐不住自重，下垂開裂後坍塌。"},{"name":"✕ 站在正下方硬撬","desc":"支撐一次拆光，人站在正下方撬底模，整片掉落把人壓住。"},{"name":"✓ 確認拆模強度","desc":"以同條件養護試體的抗壓試驗結果，確認達拆模強度才拆。"},{"name":"✓ 逐跨拆除・立即回撐","desc":"下方管制；一次只拆一跨，拆完馬上回撐，再拆下一跨。"},{"name":"✓ 材料整理堆放","desc":"拆下的模板拔釘、分類堆放，支柱整理好，不擋通道。"},{"name":"✓ 回撐留到設計強度","desc":"回撐分擔上層施工荷重，樓板達設計強度後才能拆除。"},{"name":"檢查重點","desc":"強度確認後才拆；逐跨拆除、立即回撐；下方管制、材料整理。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
