.iso[data-theme="light"]{

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}

.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}

.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}

.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}

.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}

.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}

.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}

.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}

.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}

56.6L436.5 457.8M442 458L439 459.2M447 460.8L444 462M449.5 462.2L446.5 463.4M452 463.6L449 464.8M457 466.4L454 467.6M459.5 467.8L456.5 469M462 469.2L459 470.4M467 472L464 473.2M469.5 473.4L466.5 474.5M471.9 474.8L469 475.9M476.9 477.6L474 478.7M479.4 479L476.5 480.1M481.9 480.4L479 481.5M486.9 483.2L484 484.3M489.4 484.6L486.5 485.7M491.9 485.9L488.9 487.1M496.9 488.7L493.9 489.9M499.4 490.1L496.4 491.3M501.9 491.5L498.9 492.7M506.9 494.3L503.9 495.5M509.4 495.7L506.4 496.9M511.9 497.1L508.9 498.3M516.9 499.9L513.9 501.1M519.4 501.3L516.4 502.5"/><path class="iso-line" data-tone="mid" d="M364.6 414.7L358.6 417M374.6 420.3L368.6 422.6M384.6 425.9L378.6 428.2M394.5 431.5L388.6 433.8M404.5 437.1L398.6 439.4M414.5 442.6L408.6 445M424.5 448.2L418.6 450.6M434.5 453.8L428.5 456.2M444.5 459.4L438.5 461.8M454.5 465L448.5 467.3M464.5 470.6L458.5 472.9M474.4 476.2L468.5 478.5M484.4 481.8L478.5 484.1M494.4 487.3L488.5 489.7M504.4 492.9L498.5 495.3M514.4 498.5L508.4 500.9"/><path class="iso-line" data-tone="mid" d="M410.2 460L530.1 527.1L530.1 538.7L410.2 471.7Z" style="fill:var(--anatomy-face)"/><g class="iso-dots" data-tone="hi"><circle cx="413.2" cy="467.5" r="0.45"/><circle cx="527.1" cy="531.2" r="0.45"/></g><text class="iso-face-text" data-tone="mid" transform="matrix(2.497 1.397 0 3.43 417.716 472.453)" font-size="2.1" text-anchor="start">懸臂桁架 · 背跨錨定 · 撓度放大約 90 倍</text><g data-part="rig"></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>桁架弦桿顏色＝彎矩大小：紅＝受拉、藍＝受壓，越深越大；遠側桁架上方的紅色面積為彎矩圖（畫在受拉側）</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>背跨變紅的背端柱＝受拉（背拉），下方配重基礎以錨栓錨定；前排支點柱變藍＝受壓</span><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>出挑端前方的水準尺：指針讀出挑端的活載撓度（放大約 90 倍）</span></span><span class="iso-caption">兩層樓建物頂上，一層樓深（4 m）的鋼桁架以前排柱頭為支點往外出挑 6–15 m，往後延伸 8 m 成背跨，背端柱以配重基礎與錨栓錨定。出挑段每公尺承受 w，支點彎矩 M = wL²/2，對支點的傾覆力矩由背跨自重平衡，不足的部分由背端柱受拉（背拉力 T =（wL²/2 − w背B²/2）/B）承擔；支點柱壓力 = wL + w背B + T。所以短出挑時背端仍是受壓，出挑越長，背拉力與支點彎矩急增。出挑端撓度 δ = wL⁴/8EI + wL³B/6EI：主項與 L⁴ 成正比，再加上背跨轉角帶動的一項，所以「出挑加倍、撓度約十幾到二十倍」。桁架施工時通常預拱，抵銷靜載撓度，圖中撓度只顯示活載、並放大約 90 倍。數值以每榀桁架、分擔寬 3 m、靜載 6 kN/m²、活載 3 kN/m² 計，皆為示意；實際活載重依建築技術規則建築構造編，撓度限制、桿件與錨定依結構計算書及設計圖說。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}

  const lineS = (d, tone, cls) => d ? '<path class="iso-line' + (cls ? " " + cls : "") + '" data-tone="' + tone + '" d="' + d + '"/>' : "";
  const dotS = (p, size, tone) => '<g class="iso-dots" data-tone="' + tone + '">' + p.map(([x, y]) => '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + size + '"/>').join("") + "</g>";
  function flat(pts3, html) { // 平面標註物件（彎矩圖），參與排序
    const pr = pts3.map(at);
    let x0 = 1e9, y0 = 1e9, z0 = 1e9, x1 = -1e9, y1 = -1e9, z1 = -1e9, c = [0, 0, 0];
    for (const v of pts3) { x0 = Math.min(x0, v[0]); x1 = Math.max(x1, v[0]); y0 = Math.min(y0, v[1]); y1 = Math.max(y1, v[1]); z0 = Math.min(z0, v[2]); z1 = Math.max(z1, v[2]); c = add(c, v); }
    return { svg: html, depth: dep(mul(c, 1 / pts3.length)), pr, lo: [x0, y0, z0], hi: [x1, y1, z1] };
  }

  // ── 時間軸 ──
  const LOOP = 28;
  const PH = [0, 3.5, 8, 12, 16, 23, 28];
  const NP = 12;
  const PEOPLE = Array.from({ length: NP }, (_, i) => ({ f: 0.12 + 0.8 * ((i * 0.618) % 1), y: -8 + 16 * ((i * 0.377 + 0.2) % 1), c: "m-p" + (i % 5), ph: i * 1.7 }));
  let manualL = null, mTimer = 0;
  function Lauto(u) {
    if (u < 16) return 10;
    if (u < 23) { const s = (u - 16) / 7; if (s < 0.3) return 10 - 4 * ease(s / 0.3); return 6 + 9 * ease((s - 0.3) / 0.7); }
    return 15 - 5 * ease((u - 23) / 4);
  }
  function state(t, Lm) {
    const u = ((t % LOOP) + LOOP) % LOOP;
    let step = 0;
    for (let i = 0; i < 6; i++) if (u >= PH[i]) step = i;
    const L = Lm != null ? Lm : Lauto(u);
    // 人群：走上（3.5–8 s）、走回（23–27 s）
    const inn = clamp01((u - 3.5) / 4.5), outt = clamp01((u - 23) / 4);
    const pp = PEOPLE.map((p, i) => { const a = ease(clamp01(inn * 1.9 - i / NP * 0.9)) * (1 - ease(clamp01(outt * 1.9 - (NP - 1 - i) / NP * 0.9))); return a; });
    const lam = pp.reduce((s, a) => s + a, 0) / NP;
    const wl = QL * TRIB * lam, wd = QD * TRIB, w = wd + wl;
    const M0 = w * L * L / 2, T = (M0 - WB * (BS / U) ** 2 / 2) / (BS / U), R0 = w * L + WB * (BS / U) + T;
    const Bm = BS / U;
    const th0 = wl * L * L / 2 * Bm / (3 * EI);
    const vAt = (xm) => { // 活載撓度（m，向下為正），xm 由支點起算
      if (xm >= 0) return th0 * xm + wl * xm * xm * (6 * L * L - 4 * L * xm + xm * xm) / (24 * EI);
      const s = xm + Bm; return -(wl * L * L / 2) * s * (Bm * Bm - s * s) / (6 * EI * Bm);
    };
    const Mat = (xm) => { // 彎矩（kN·m，負＝負彎矩／上緣受拉）
      if (xm >= 0) return -w * (L - xm) ** 2 / 2;
      const s = xm + Bm, Rb = -T; return Rb * s - WB * s * s / 2;
    };
    const colorOn = ease(clamp01((u - 8) / 1.5));
    const tieOn = ease(clamp01((u - 12) / 1.2)) * (1 - ease(clamp01((u - 26) / 2)));
    return { u, step, L, pp, lam, w, wl, M0, T, R0, vAt, Mat, tip: vAt(L), colorOn, tieOn };
  }

  // ── 幾何 ──
  const NB = 2, NC = 4;
  const MREF = (QD + QL) * TRIB * 15 * 15 / 2;
  function scene(st) {
    const it = [], Lu = st.L * U;
    const z = (x, z0) => z0 - st.vAt(x / U) * KDISP;
    const nodes = [];
    for (let i = 0; i <= NB; i++) nodes.push(-BS + i * BS / NB);
    for (let i = 1; i <= NC; i++) nodes.push(i * Lu / NC);
    const mcls = (xm, top) => {
      const m = st.Mat(xm), lvl = Math.min(4, Math.round(Math.abs(m) / MREF * 4 * st.colorOn + 0.15 * st.colorOn));
      if (lvl <= 0) return "m-n0";
      const tens = (m < 0) === top;
      return (tens ? "m-t" : "m-c") + lvl;
    };
    // ── 建物：兩層、地坪、基礎 ──
    it.push(B(-38, 4, -17, 17, 0, 1.2, "m-mat", "mid", lineS(pathOf([[-36, 15, 1.2], [2, 15, 1.2]].map(at)), "faint")));
    for (const zl of [ZB / 2]) it.push(B(-BS - 1.2, 1.2, -GW - 1.2, GW + 1.2, zl - 1, zl, "m-slab", "hi"));
    for (let f = 0; f < 2; f++) {
      const z0 = f ? ZB / 2 : 1.2, z1 = f ? ZB - 1.6 : ZB / 2 - 1;
      for (const x of [-BS, -BS / 2, 0]) for (const y of [-GW, GW]) {
        const front = x === 0, back = x === -BS;
        const cls = front ? (st.tieOn > 0.05 ? "m-cmp" : "m-col") : back ? (st.tieOn > 0.05 && st.T > 0 ? "m-tie" : "m-col") : "m-col";
        const r = front ? 1.6 : 1.1;
        it.push(B(x - r, x + r, y - r, y + r, z0, z1, cls, front || back ? "hi" : "mid"));
      }
      // 後牆、左端牆（玻璃帷幕分割）
      let win = "";
      for (let x = -BS + 2; x < -1; x += 5.3) win += lineS(pathOf([[x, -GW - 0.4, z0 + 1.5], [x + 4.3, -GW - 0.4, z0 + 1.5], [x + 4.3, -GW - 0.4, z1 - 1.2], [x, -GW - 0.4, z1 - 1.2]].map(at), true), "lo");
      it.push(B(-BS + 1, -1, -GW - 0.4, -GW + 0.2, z0, z1, "m-wall", "mid", win));
      let sw = "";
      for (let y = -GW + 2; y < GW - 1; y += 5.4) sw += lineS(pathOf([[-BS - 0.4, y, z0 + 1.5], [-BS - 0.4, y + 4.4, z0 + 1.5], [-BS - 0.4, y + 4.4, z1 - 1.2], [-BS - 0.4, y, z1 - 1.2]].map(at), true), "lo");
      it.push(B(-BS - 0.4, -BS + 0.2, -GW + 1, GW - 1, z0, z1, "m-wall", "mid", sw));
    }
    // 柱頭支承（支點）與背端拉力接頭
    for (const y of [-GW, GW]) {
      it.push(B(-2.2, 2.2, y - 2.2, y + 2.2, ZB - 1.6, ZB - 1, "m-node", "mid", dotS([[-1.6, y + 2.2], [1.6, y + 2.2]].map(([a, b]) => at([a, b, ZB - 1.3])), 0.35, "hi")));
      it.push(B(-BS - 1.8, -BS + 1.8, y - 1.8, y + 1.8, ZB - 1.6, ZB - 1, "m-node", "mid"));
    }
    // 背端配重基礎＋錨栓（背拉）
    for (const y of [-GW, GW]) {
      const lit = st.tieOn > 0.05 && st.T > 0;
      it.push(B(-BS - 4, -BS + 4, y - 4, y + 4, -0.01, 2.4, "m-anchor", "hi", dotS([[-BS - 3, y - 3], [-BS + 3, y - 3], [-BS - 3, y + 3], [-BS + 3, y + 3]].map(([a, b]) => at([a, b, 2.4])), 0.4, lit ? "hi" : "mid")));
      it.push(B(-BS - 2, -BS + 2, y - 2, y + 2, 2.4, 3, "m-node", lit ? "hi" : "mid"));
    }
    // ── 桁架（兩榀）＋樓版 ──
    for (const y of [-GW, GW]) {
      for (let i = 0; i < nodes.length - 1; i++) {
        const a = nodes[i], b = nodes[i + 1], xm = (a + b) / 2 / U;
        it.push(M([a, y, z(a, ZT)], [b, y, z(b, ZT)], 1.2, 1.1, mcls(xm, true)));
        it.push(M([a, y, z(a, ZB)], [b, y, z(b, ZB)], 1.2, 1.1, mcls(xm, false)));
        // 斜桿：靠支點側上弦 → 外側下弦
        const out = a >= 0 || b > 0;
        const p = out ? [a, y, z(a, ZT) - 1] : [b, y, z(b, ZT) - 1], q = out ? [b, y, z(b, ZB) + 1] : [a, y, z(a, ZB) + 1];
        it.push(M(p, q, 0.75, 0.7, "m-steel", "mid"));
      }
      for (const x of nodes) {
        it.push(M([x, y, z(x, ZB) + 1.1], [x, y, z(x, ZT) - 1.1], 0.85, 0.85, "m-steel", "mid"));
        it.push(B(x - 1.5, x + 1.5, y + 1.2, y + 1.5, z(x, ZB) - 1, z(x, ZB) + 1, "m-node", "mid", dotS([at([x - 0.8, y + 1.5, z(x, ZB)]), at([x + 0.8, y + 1.5, z(x, ZB)])], 0.3, "hi")));
        it.push(B(x - 1.5, x + 1.5, y + 1.2, y + 1.5, z(x, ZT) - 1, z(x, ZT) + 1, "m-node", "mid", dotS([at([x - 0.8, y + 1.5, z(x, ZT)]), at([x + 0.8, y + 1.5, z(x, ZT)])], 0.3, "hi")));
      }
    }
    // 樓版（下弦頂）＋屋頂鋼樑（上弦間）
    const segs = [];
    for (let i = 0; i < nodes.length - 1; i++) { const a = nodes[i], b = nodes[i + 1], n = 3; for (let j = 0; j < n; j++) segs.push([a + (b - a) * j / n, a + (b - a) * (j + 1) / n]); }
    for (const [a, b] of segs) {
      const seam = lineS(pathOf([[b, -GW + 1.2, z(b, ZB) + 2.6], [b, GW - 1.2, z(b, ZB) + 2.6]].map(at)), "faint");
      it.push(DK(a, b, -GW + 1.2, GW - 1.2, z(a, ZB) + 1.1, z(b, ZB) + 1.1, 1.5, "m-deck", seam));
    }
    for (const x of nodes) it.push(M([x, -GW + 1.2, z(x, ZT)], [x, GW - 1.2, z(x, ZT)], 0.5, 0.6, "m-steel", "mid"));
    // 出挑端欄杆（玻璃）
    { const x = Lu, zz = z(x, ZB) + 2.6; it.push(B(x - 0.6, x - 0.2, -GW + 1.2, GW - 1.2, zz, zz + 4.2, "m-rail", "mid", lineS(pathOf([[x - 0.2, -GW + 1.2, zz + 4.2], [x - 0.2, GW - 1.2, zz + 4.2]].map(at)), "hi"))); }
    // 人群
    st.pp.forEach((a, i) => {
      if (a <= 0.01) return;
      const p = PEOPLE[i], tx = p.f * Lu, x = -10 + (tx + 10) * a + Math.sin(st.u * 2 + p.ph) * 0.4 * (a > 0.98 ? 1 : 0);
      const zz = z(x, ZB) + 2.6;
      it.push(B(x - 0.7, x + 0.7, p.y - 0.5, p.y + 0.5, zz, zz + 4.6, p.c, "mid"));
      it.push(B(x - 0.55, x + 0.55, p.y - 0.55, p.y + 0.55, zz + 4.8, zz + 5.9, "m-p1", "mid"));
    });
    // 水準尺：立在出挑端前方，指針讀端點撓度
    { const sx = Lu + 5, sy = GW;
      let ticks = "";
      for (let k2 = -2; k2 <= 14; k2++) { const zz = ZB - k2; ticks += pathOf([[sx - 0.8, sy + 0.8, zz], [sx - 0.8 + (k2 % 5 === 0 ? 1.6 : 0.8), sy + 0.8, zz]].map(at)); }
      it.push(B(sx - 3, sx + 3, sy - 3, sy + 3, 0, 0.8, "m-node", "mid"));
      it.push(B(sx - 0.8, sx + 0.8, sy - 0.8, sy + 0.8, 0.8, ZB + 4, "m-staff", "hi", lineS(ticks, "mid") + dotS([at([sx - 0.8, sy + 0.8, ZB])], 0.45, "hi")));
      const zt = z(Lu, ZB);
      it.push(B(Lu + 1.2, sx - 0.8, sy - 0.3, sy + 0.3, zt - 0.3, zt + 0.3, "m-ptr", "hi"));
    }
    // 彎矩圖：畫在遠側桁架上方（受拉側），支點最大
    if (st.colorOn > 0.02) {
      const ys = -GW - 2, K = 15 / MREF, p3 = [], base = [], hatch = [];
      const xs = [];
      for (let i = 0; i <= 24; i++) xs.push(-BS + (BS) * i / 24);
      for (let i = 1; i <= 30; i++) xs.push(Lu * i / 30);
      for (const x of xs) { const m = st.Mat(x / U); p3.push([x, ys, z(x, ZT) + 1.6 - m * K * st.colorOn]); base.push([x, ys, z(x, ZT) + 1.6]); }
      for (let i = 0; i < xs.length; i += 3) hatch.push(pathOf([base[i], p3[i]].map(at)));
      const poly3 = p3.concat(base.slice().reverse());
      const html = '<g style="opacity:' + st.colorOn.toFixed(2) + '"><path class="mdia" d="' + pathOf(poly3.map(at), true) + '"/><path class="mdia2" d="' + hatch.join("") + '"/><path class="mbase" d="' + pathOf(base.map(at)) + '"/></g>';
      it.push(flat(poly3, html));
    }
    return sortItems(it).map((i) => i.svg).join("");
  }

  const stage = document.querySelector(".iso-stage");
  const rig = stage.querySelector('[data-part="rig"]');
  const readout = document.querySelector("[data-readout]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const svgEl = stage.querySelector("svg");
  const narrow = matchMedia("(max-width:560px)");
  const fitView = () => svgEl.setAttribute("viewBox", narrow.matches ? CFG.NARROW : "0 0 " + CFG.W + " " + CFG.H);
  fitView(); narrow.addEventListener("change", fitView);
  const dRef = (Lm) => Lm ** 4 / 8 + Lm ** 3 * (BS / U) / 6;
  let t = 0, last = 0, frame = 0, visible = false, playing = !still.matches, idle = 0;
  function textOf(st) {
    const T = st.T > 0 ? "背拉 " + Math.round(st.T) + " kN" : "背端受壓";
    const ratio = dRef(st.L) / dRef(LMIN);
    return "出挑 " + st.L.toFixed(1) + " m · 支點彎矩 " + Math.round(st.M0) + " kN·m · " + T + " · 撓度 " + Math.round(st.tip * 1000) + " mm（6 m 的 " + ratio.toFixed(1) + " 倍）";
  }
  function draw() {
    if (manualL != null && performance.now() > mTimer) manualL = null;
    const st = state(t, manualL);
    rig.innerHTML = scene(st);
    if (window.ctaStep) window.ctaStep(st.step);
    const text = textOf(st);
    if (readout.textContent !== text) readout.textContent = text;
    stage.setAttribute("aria-valuetext", text);
    stage.setAttribute("aria-valuenow", st.L.toFixed(1));
  }
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
    last = now;
    if (playing) t += dt;
    draw();
    frame = visible && (playing || manualL != null) ? requestAnimationFrame(tick) : 0;
  }
  const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
  const setL = (v) => { manualL = Math.max(LMIN, Math.min(LMAX, v)); mTimer = performance.now() + 6000; draw(); run(); };
  new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
  stage.addEventListener("pointermove", (ev) => { const b = svgEl.getBoundingClientRect(); const sh = Math.max(0, Math.min(1, ((ev.clientX - b.left) / b.width - 0.1) / 0.8)); setL(LMIN + (LMAX - LMIN) * sh); });
  stage.addEventListener("keydown", (ev) => {
    if (ev.key === " ") { ev.preventDefault(); playing = !playing; run(); return; }
    const cur = manualL != null ? manualL : state(t, null).L;
    if (ev.key === "ArrowRight" || ev.key === "ArrowUp") { ev.preventDefault(); setL(cur + 0.5); }
    if (ev.key === "ArrowLeft" || ev.key === "ArrowDown") { ev.preventDefault(); setL(cur - 0.5); }
    if (ev.key === "Home") { ev.preventDefault(); setL(LMIN); }
    if (ev.key === "End") { ev.preventDefault(); setL(LMAX); }
  });
  if (still.matches) t = 13.5;
  const q0 = new URLSearchParams(location.search).get("t");
  if (q0 !== null) { t = +q0; playing = false; }
  draw(); run();
})();</script></body></html>
