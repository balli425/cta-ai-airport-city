</style><script>(()=>{const S=[{"name":"危害：漏電看不見","desc":"絕緣破損讓金屬外殼帶電，外觀看不出來；潮濕時人體電阻更低。"},{"name":"✕ 沒有漏電斷路器","desc":"人一碰外殼，電流經人體入地回到電源；電流小，一般斷路器不跳。"},{"name":"原理：去＝回","desc":"兩條導線一起穿過零相比流器；正常時去回相等，感應互相抵銷。"},{"name":"原理：去≠回就跳脫","desc":"有電流漏到大地，回來的變少；比流器感應、跳脫線圈把接點跳開。"},{"name":"✓ 裝了漏電斷路器","desc":"同樣的漏電一發生，瞬間跳脫切斷電源，人來得及脫離。"},{"name":"✓ 每月按測試鈕","desc":"測試鈕模擬漏電，按了應立即跳脫；不跳就是故障，立刻更換。"},{"name":"檢查重點","desc":"裝在分路、選高感度高速型，機具外殼接地；跳脫要先查原因。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>

 cy="618.0" r="2.2"/></g><g data-li="1"><path d="M319.6 511.9L309.6 573.9"/><circle cx="319.6" cy="511.9" r="2.2"/></g><g data-li="2"><path d="M399.5 529.2L419.5 569.2"/><circle cx="399.5" cy="529.2" r="2.2"/></g><g data-li="3"><path d="M399.5 529.2L419.5 569.2"/><circle cx="399.5" cy="529.2" r="2.2"/></g><g data-li="4"><path d="M319.6 511.9L309.6 573.9"/><circle cx="319.6" cy="511.9" r="2.2"/></g><g data-li="5"><path d="M404.5 501.8L464.5 531.8"/><circle cx="404.5" cy="501.8" r="2.2"/></g><g data-li="6"><path d="M319.6 511.9L309.6 573.9"/><circle cx="319.6" cy="511.9" r="2.2"/></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅＝帶電的外殼、電流路徑（移動虛線）與這一步正在作動的零件；✕ 錯誤、✓ 正確</span><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>褐線＝火線、淺藍線＝中性線、綠線＝接地、黃銅色環＝零相比流器（ZCT）、深藍把手＝送電中</span></span><span class="iso-caption">漏電斷路器作動原理示意（單相兩線、電源側系統接地；斷路器為放大剖視，內部構造簡化）。電動機具絕緣破損時，金屬外殼帶電而外觀看不出來；人碰觸時電流經人體流入大地、再由電源的接地回到電源，這個電流遠小於一般斷路器的額定電流，所以一般斷路器不會跳脫。漏電斷路器讓各條載流導線一起穿過零相比流器（ZCT）：正常時流出與流回的電流相等、磁通互相抵銷；一旦有電流漏到大地，去回不相等，比流器二次側感應出訊號，使跳脫線圈動作、接點跳開而切斷電源。工地臨時用電設備，以及在潮濕場所、金屬板上或鋼架上等導電性良好場所使用的移動式、攜帶式電動機具，其連接電路應設置適合其規格、高感度高速型的防止感電用漏電斷路器，並定期按測試鈕確認動作；機具金屬外殼另須接地，跳脫後應先查明原因再復歸。圖中電流值、感度電流 30 mA 與動作時間 0.1 秒為常見規格之示意，實際依職業安全衛生設施規則、用戶用電設備裝置規則、施工計畫與相關法規辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;

function pathOf(points, closed = false) {
    if (!points.length)

}

function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

    const out = [];
    for (const [cx, cy, start] of corners) {

        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

}
function signedArea(points) {
    let area = 0;

        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)

    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)

        lower.push(point);

            upper.pop();
