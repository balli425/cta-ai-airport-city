</style><script>(()=>{const S=[{"name":"危害：挖土機不是起重機","desc":"沒有過負荷防止與脫鉤防止裝置，容易掉落、翻倒、撞到人。"},{"name":"✕ 鋼索掛在斗齒上","desc":"鋼索直接勾在斗齒上、人用手扶；鏟斗一動就滑脫掉落。"},{"name":"✕ 伸太遠・超過能力","desc":"作業半徑越大能吊的越輕；超過能力，後方離地、機身翻倒。"},{"name":"✓ 吊鉤＋防脫裝置","desc":"用專用吊鉤（有防脫舌片）配合格鋼索、卸扣，不掛在斗齒上。"},{"name":"✓ 荷重與作業半徑","desc":"地面平整堅實；吊重不超過該半徑下的額定荷重，慢速操作。"},{"name":"✓ 指揮・淨空・拉繩","desc":"專人指揮；吊掛物下方不站人，用拉繩導引，放妥再解索。"},{"name":"檢查重點","desc":"吊鉤防脫、吊具、荷重標示每日檢點；常態吊掛改用起重機。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
