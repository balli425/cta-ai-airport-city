</style><script>(()=>{const S=[{"name":"危害：穩定三角與重心","desc":"兩前輪加後軸中心三點支撐；貨叉舉得越高，重心越高越靠前。"},{"name":"✕ 舉高行駛＋急轉彎","desc":"重心高又急轉，合力跑出穩定三角，整台車側翻。"},{"name":"✕ 人站在貨叉下方","desc":"貨叉或貨物下方不可站人、不可通行；貨物一滑落就砸到人。"},{"name":"✓ 貨叉放低・慢速轉彎","desc":"行駛時貨叉放低、桅桿後傾，轉彎減速，重心留在三角形內。"},{"name":"✓ 到定位才舉高","desc":"周圍人員淨空，車停穩、對正後才舉高貨叉放置貨物。"},{"name":"✓ 離開時貨叉落地","desc":"貨叉放到地面、拉手煞車、熄火並取下鑰匙，才能離開駕駛座。"},{"name":"檢查重點","desc":"頂蓬、後扶架、安全帶與警示裝置；由受過訓練的人操作。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
