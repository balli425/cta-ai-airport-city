</style><script>(()=>{const S=[{"name":"危害：輾壓・割傷・泡水","desc":"臨時電纜拉過車道會被輾、被割；接頭泡水就把電帶進水裡。"},{"name":"✕ 電纜直接橫過車道","desc":"車輪直接輾過，被覆破損、芯線外露，造成漏電與短路。"},{"name":"✕ 接頭泡在積水裡","desc":"膠帶纏的接頭一進水，整灘水帶電，人踩進去就感電。"},{"name":"✓ 架空跨越車道","desc":"用立柱、支架把電纜架高固定，淨高大於車輛與載物高度。"},{"name":"✓ 或加過路保護板","desc":"過路處電纜放進保護板的線槽，或穿管埋設，車輪不直接壓線。"},{"name":"✓ 防水接頭・架高","desc":"接頭用防水連接器，以支架架高離開積水與通道，積水抽除。"},{"name":"檢查重點","desc":"過路處架空或保護、接頭防水離地、分路有漏電斷路器，每日巡視。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
