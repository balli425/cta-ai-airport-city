</style><script>(()=>{const S=[{"name":"危害：高處作業","desc":"在臨空的高處作業，一失足就墜落，衝擊全由身體承受。"},{"name":"錯誤：沒扣好・掛低處","desc":"腿帶胸帶沒扣、掛鉤掛腳邊：先自由墜落一大段才被拉住。"},{"name":"穿戴一：肩帶","desc":"先檢查織帶與扣具，提起背部 D 環，像穿背心一樣套上肩帶。"},{"name":"穿戴二：腿帶","desc":"兩腿腿帶分別扣上並調緊，不可扭轉，墜落時由大腿承重。"},{"name":"穿戴三：胸帶・D 環","desc":"扣上胸帶與腰帶並調整；D 環應落在背部兩肩胛骨之間。"},{"name":"掛鉤高掛","desc":"掛鉤掛在頭頂上方、強度足夠的錨錠點，位置高於 D 環。"},{"name":"墜落驗證","desc":"失足時只落下一小段，緩衝包展開吸能；淡影為低掛的對照。"},{"name":"使用前檢查","desc":"每次使用前檢查織帶、縫線、扣具與緩衝包，受過衝擊即汰換。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>

gcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅＝這一步正在穿戴／檢查的部位、錯誤的掛點與墜落軌跡；緩衝包轉紅＝已展開</span><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>灰色虛線人形＝掛鉤低掛時會墜落到的位置（對照）；✕ 錯誤、深藍 ✓ 正確</span></span><span class="iso-caption">全身背負式安全帶的穿戴與掛鉤位置示意。常見的穿戴順序（各廠牌略有不同，以產品使用說明為準）：先檢查織帶、縫線與扣具，提起背部 D 環套上肩帶；兩腿腿帶分別扣上、調緊且不可扭轉；再扣胸帶與腰帶，調整到貼身而不妨礙活動，背部 D 環應位於兩肩胛骨之間。掛鉤應掛在強度足夠、且高於 D 環的錨錠點（高掛低用）：掛得越高，掛繩拉緊前的自由墜落距離越短，身體承受的衝擊越小，墜落時附緩衝包的掛繩展開吸收能量。圖中錯誤示範為腿帶、胸帶未扣且掛鉤掛在腳邊，會先自由墜落一大段才被拉住，衝擊大、人也可能自安全帶中滑脫。墜落以慢動作呈現；平台高度、掛繩長度（1.6 m）、緩衝包展開量與墜落距離皆為示意，實際依產品使用說明、施工計畫及職業安全衛生設施規則、營造安全衛生設施標準等相關法規辦理；受過墜落衝擊的安全帶與掛繩應停止使用並汰換。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
