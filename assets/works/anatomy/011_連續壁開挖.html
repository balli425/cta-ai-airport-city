</style><script>(()=>{const S=[{"name":"抓斗挖掘","desc":"油壓抓斗分左、右、中三刀往下挖，每斗迴轉到棄土斗卸土；槽內持續補穩定液撐住槽壁。"},{"name":"抓斗吊離、換掛吊鉤","desc":"挖到設計深度 30 m，抓斗吊出放在枕木上，吊車改掛吊鉤準備吊鋼筋籠。"},{"name":"吊放接頭管與鋼筋籠","desc":"單元端先放接頭管；鋼筋籠分節續接後，在穩定液中慢慢吊放下去。"},{"name":"鋼筋籠就位","desc":"籠頂以吊架擱在導溝上定位，保持保護層，吊鉤鬆開。"},{"name":"安裝特密管","desc":"兩支特密管插到距槽底約 30 cm，上端接漏斗，架在導溝上。"},{"name":"特密管澆置","desc":"混凝土由槽底往上灌，管口保持埋入 2–6 m，邊澆邊拔管；穩定液被擠出抽回設備。"},{"name":"拔管、澆置完成","desc":"混凝土灌到導溝頂附近（含超灌），拔出特密管，單元 3 完成。"},{"name":"移往下一單元","desc":"吊車回去掛抓斗，移到下一個單元，重複導溝內的挖掘循環。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>

const ELEVATION = 30;
const SHADES = 4;

const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
