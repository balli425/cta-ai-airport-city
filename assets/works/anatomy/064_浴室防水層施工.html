赭紅叉：錯誤做法，綠勾：正確做法</span></span><span class="iso-caption">浴室左前角淋浴區剖切（厚度放大示意，前剖面切過淋浴區左牆）。牆面先粉刷打底、地坪整平，地牆與牆牆陰角做圓角，陰角、落水頭與管根等易裂處先鋪補強網；防水塗膜至少兩道，第二道與第一道方向交叉，避免漏塗與針孔。上翻高度示意：淋浴區牆面 180 cm、其他牆面 30 cm。塗膜乾燥後塞住落水頭蓄水試水（示意 48 小時），樓下無滲漏才貼磚，地磚以黏著層做出洩水坡向落水頭，淋浴區以擋水條分隔。最後對照：淋浴區上翻只到 30 cm 時，水從磚縫進入黏著層，在防水層以上滲入磚牆，沿牆體往下繞過樓板防水，造成樓下牆面水漬與滴水；上翻到 180 cm 時，水被擋在防水層外側，沿黏著層回到地面、流向落水頭。實際上翻高度、塗膜種類與膜厚、試水時間均依設計圖說。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
