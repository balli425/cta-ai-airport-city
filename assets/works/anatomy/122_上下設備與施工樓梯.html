 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅＝危害部位、墜落路徑、這一步正在裝設的上下設備；✕ 錯誤、✓ 正確</span><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>藍灰＝門型框架、青灰＝樓梯、土黃＝扶手與護欄、木色＝移動梯、灰＝鋼板樁擋土（剖開示意）</span></span><span class="iso-caption">上下設備與施工樓梯示意（左側為台灣工地常見的外牆框式／門型施工架，右側為剖開的開挖區，鏡頭依步驟拉近或拉遠）。高差超過 1.5 m 的作業場所，應設置能讓人安全上下的設備。常見災害：把施工架的交叉拉桿、框架當梯子攀爬而踩空墜落；開挖區沿擋土設施攀爬、直接跳下，或使用長度不足又未固定的梯子而滑落。正確做法：施工架內設置施工架樓梯與扶手，任一處到最近上下設備的距離不可過遠；開挖區設置階梯式施工樓梯，附扶手與中間平台並固定穩固；使用移動梯時，上端固定並突出上方平面、梯腳採防滑措施、角度適當，面向梯子上下、手不拿東西。「高差超過 1.5 m 應設安全上下設備」與「移動梯寬度 30 cm 以上、應有防滑措施」出自職業安全衛生設施規則；圖中梯長、梯頂突出長度、斜度與護欄高度皆為示意，實際依職業安全衛生設施規則、營造安全衛生設施標準、施工計畫與相關法規辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;

function iso([x, y, z], projection) {

    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

function pathOf(points, closed = false) {
    if (!points.length)

        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

        for (let step = 0; step <= count; step++) {

function signedArea(points) {

    for (let index = 0; index < points.length; index++) {

function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);

        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];

        lower.push(point);

    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {

function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;

    const normals = ring.map(([ax, ay], index) => {
