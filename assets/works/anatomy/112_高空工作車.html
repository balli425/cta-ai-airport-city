@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

</style><script>(()=>{const S=[{"name":"危害：翻倒・墜落・夾擠","desc":"伸臂越長越遠重心越偏；人在高處工作台上，會被甩出或被上方夾住。"},{"name":"✕ 支撐腳未伸出","desc":"支撐腳沒伸出就迴旋伸臂，重心跑到輪子外側，整台車翻倒。"},{"name":"✕ 攀上護欄・未掛安全帶","desc":"搆不到就踩上護欄、探身出去，沒掛安全帶，一滑就墜落。"},{"name":"✕ 上升沒看上方","desc":"低頭操作持續上升，頭背撞上方構件，人被夾在護欄與構件之間。"},{"name":"✓ 支撐腳・墊板・作業範圍","desc":"地面堅實、支撐腳全伸加墊板、車身水平；圍出範圍並派人指揮。"},{"name":"✓ 安全帶掛在車上","desc":"一上工作台就把安全帶掛在工作台的掛點，不掛在外部結構上。"},{"name":"✓ 範圍內升起作業","desc":"緩慢迴旋、起伏、伸臂，隨時看上方與周圍，留出淨空再作業。"},{"name":"檢查重點","desc":"每日作業前檢點制動與安全裝置；由受過訓練的人操作，不超載。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>

.iso .mk-x circle,.iso .mk-x path{stroke:hsl(6 60% 46%)}
.iso .mk-ok circle,.iso .mk-ok path{stroke:#174e75}
.iso .impact{fill:none;stroke:hsl(6 58% 48%);stroke-width:1.6;stroke-dasharray:4 3}
.iso .nt{font:700 12px "Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:calc(12px / var(--z,1));fill:#174e75;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.iso .nt.red{fill:hsl(6 58% 40%)}
.iso .dim{fill:none;stroke:#174e75;stroke-width:1.1}

.iso .wheel{fill:hsl(212 10% 24%);stroke:hsl(212 12% 12%);stroke-width:.8;stroke-linejoin:round}
.iso .hub{fill:hsl(42 14% 72%);stroke:hsl(42 14% 32%);stroke-width:.6}
.iso .glass{fill:hsl(205 30% 34%);fill-opacity:.82;stroke:hsl(205 30% 20%);stroke-width:.6;stroke-linejoin:round}
.iso .lampq{fill:hsl(46 70% 74%);stroke:hsl(40 40% 34%);stroke-width:.5}
.iso .cone{fill:hsl(18 70% 56%);stroke:hsl(14 56% 32%);stroke-width:.8;stroke-linejoin:round}
.iso .coneband{fill:#fff;stroke:none}
.iso g.hot .cone{fill:hsl(6 58% 50%)}
.iso .rng{fill:hsl(205 60% 40%);fill-opacity:.06;stroke:#174e75;stroke-width:1.6;stroke-dasharray:7 5}
.iso .lanyard{fill:none;stroke:hsl(38 60% 40%);stroke-linecap:round}
.iso .hotl{stroke:hsl(6 60% 44%)!important}
.iso .hookc{fill:hsl(212 10% 82%);stroke:hsl(212 20% 24%);stroke-width:1}
.iso .hookc.on{fill:#fff;stroke:hsl(6 60% 46%);stroke-width:2.2}

.iso-stage svg{overflow:hidden;-webkit-mask:linear-gradient(to right,transparent 254px,#000 268px) 0 44px/100% 236px no-repeat,linear-gradient(to top,transparent 40px,#000 58px) 0 280px/100% calc(100% - 280px) no-repeat;mask:linear-gradient(to right,transparent 254px,#000 268px) 0 44px/100% 236px no-repeat,linear-gradient(to top,transparent 40px,#000 58px) 0 280px/100% calc(100% - 280px) no-repeat}@media (max-width:560px){.iso-stage svg{-webkit-mask:none;mask:none}}
@media (max-width:560px){.iso-stage{padding-top:78px}.iso-plate-corner[data-corner="readout"]{white-space:normal;max-width:100%;left:0;text-align:right;line-height:1.35}.iso-plate-corner[data-corner="hint"]{display:none}.iso .nt{font-size:calc(19px / var(--z,1))}}

const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}

    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
