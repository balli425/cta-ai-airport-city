</style><script>(()=>{const S=[{"name":"危害：開挖影響鄰房","desc":"擋土壁向坑內變位，壁後地表沉陷，旁邊的房子跟著傾斜龜裂。"},{"name":"監測儀器與管理值","desc":"傾斜計、沉陷點、水位井、傾度管；每項都訂警戒值與行動值。"},{"name":"✕ 不看數據繼續挖","desc":"數值一路超過警戒值、行動值還在挖，鄰房傾斜、牆面龜裂。"},{"name":"✓ 定期量測・比對管理值","desc":"每階開挖都量測、記錄、畫趨勢，確認在管理值內才往下挖。"},{"name":"✓ 達警戒值","desc":"加密觀測頻率，檢討原因與施工方式，把應變措施先準備好。"},{"name":"✓ 達行動值","desc":"立即停止開挖，加設支撐、回填反壓，通報並視情況疏散住戶。"},{"name":"檢查重點","desc":"開挖前做鄰房現況調查、量初始值；管理值與行動寫進施工計畫。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>

.iso .bldl{fill:none;stroke:hsl(34 20% 52%);stroke-width:1}

.iso .bd-s{font:600 10px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:hsl(212 20% 30%)}

.iso path.bd-ac{fill:none;stroke:hsl(6 60% 46%);stroke-width:1.4;stroke-dasharray:3 2}.iso text.bd-ac{fill:hsl(6 60% 40%)}
.iso .bd-bar{fill:hsl(212 14% 90%)}
.iso .bd-v.ok{fill:#174e75}.iso .bd-v.al{fill:hsl(38 76% 48%)}.iso .bd-v.ac{fill:hsl(6 60% 48%)}
