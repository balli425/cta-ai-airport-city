</style><script>(()=>{const S=[{"name":"開門上下客","desc":"車廂停在樓層，車門帶動乘場門一起打開；煞車抱住曳引輪，對重與車廂靜止。"},{"name":"關門起動・加速","desc":"門關妥、門鎖接通後煞車放開，曳引機以約 1 m/s² 平順加速。"},{"name":"等速行駛","desc":"以額定 1.75 m/s 等速運轉；車廂上行時對重同步下降，馬達只負擔兩者差值。"},{"name":"減速平層","desc":"接近目的樓層時減速，停準樓板高度後煞車抱閘，再開門。"},{"name":"超速：電氣開關斷電","desc":"模擬煞車失效持續加速；速度超過約 115%（2.0 m/s），限速器電氣開關先切斷電源。"},{"name":"超速：限速器夾繩・緊急停止","desc":"達 2.1 m/s 夾爪夾住限速器鋼索，拉起楔塊夾緊導軌，以約 0.6 g 漸進減速停車。"},{"name":"復歸","desc":"確認原因後將車廂上移，鬆開楔塊、限速器復位，才能恢復運轉。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>

2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅機身＋轉動圓牌＝運轉中（曳引機運轉、限速器／緊急停止裝置作動）；行駛中鋼索轉磚紅，粗箭頭為車廂與對重移動方向</span></span><span class="iso-caption">前側與右側井道牆剖開的曳引式電梯（13 人／900 kg、額定 1.75 m/s，水平向放大示意）。機房內永磁同步無齒輪曳引機帶動曳引輪，鋼索經繩槽摩擦驅動：一端經繩頭彈簧吊住車廂上梁，另一端繞過樓板下的導向輪吊住對重；對重重量 = 車廂自重 + 45% 額定載重，因此車廂上行時對重同步下降，馬達只需克服兩者差值。車廂與對重各沿 T 型導軌以導靴導引，機坑設油壓緩衝器。限速器鋼索與車廂同步運轉，超速達 2.0 m/s（約 115%）先切斷電氣開關，達 2.1 m/s 夾爪夾住鋼索，車廂繼續下行便拉起緊急停止裝置的楔塊夾緊導軌，以漸進式約 0.6 g 減速停下；須將車廂上移才能鬆開楔塊復歸。動畫行駛段為 2.5 倍速、超速段為慢動作。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
