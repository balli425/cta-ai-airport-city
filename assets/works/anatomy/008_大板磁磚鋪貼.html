.iso-figure{margin:32px 0 36px}

.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

" aria-hidden="true"><path d="M1.5 5h13"/></svg>磚紅＝黏著劑與新鮮填縫劑；運轉中的振動器、吸附中的吸盤也改為紅色</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>黑框磁磚＝這次鋪貼的 120×60 大板磚</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>藍綠＝整平夾底座與拉帶，黃褐＝楔片</span></span><span class="iso-caption">大板磁磚（如 120×60、120×120 cm）軟底以外的薄貼工法示意：基面先檢查平整度，以鋸齒鏝刀在基面抹出齒狀黏著劑，磁磚背面再薄塗一層（雙面塗抹），以吸盤由兩人搬運就位；接縫插入整平夾並推入楔片，使相鄰磚面齊平，再以振動器或橡膠鎚壓實，讓黏著劑攤平密實；硬化後折斷拉帶、取出楔片並填縫。黏著劑覆蓋不足會留下空隙，打診棒敲擊聲音空洞即為空鼓，日後易翹起、破裂。圖中磚厚、黏著劑齒高、磚縫寬度、高低差與覆蓋率皆放大示意，時間已壓縮；黏著劑種類、鏝刀齒距、平整度與覆蓋率要求等依設計圖說、產品說明及相關施工規範辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
