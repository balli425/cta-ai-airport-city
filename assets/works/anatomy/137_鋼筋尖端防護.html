</style><script>(()=>{const S=[{"name":"危害：朝上的鋼筋尖端","desc":"柱預留筋、牆插筋的尖端朝上；人一旦跌落或撲倒在上面就是穿刺。"},{"name":"✕ 從上方跌落","desc":"工作台沒有護欄，後退一步踩空，整個人跌落在下方的插筋上。"},{"name":"✕ 絆倒撲向預留筋","desc":"通道緊貼預留筋又有管線絆腳，一絆倒就撲在鋼筋尖端上。"},{"name":"✓ 每支加護蓋","desc":"外露的鋼筋尖端一支一支套上護蓋（護套），把尖端包起來。"},{"name":"✓ 成排加蓋板","desc":"成排的插筋可整排加蓋板或護條，或把尖端彎曲，效果相同。"},{"name":"✓ 上方作業防護","desc":"鋼筋上方的工作台要有護欄、腳趾板與上下設備，先防止跌落。"},{"name":"檢查重點","desc":"護蓋容易被碰掉：每日巡視，脫落的立即補回，確認套牢。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>

傷。對暴露的鋼筋應採取彎曲尖端、加蓋或加裝護套等防護：單支的預留筋套上護蓋（護套），成排的插筋可整排加蓋板或護條；鋼筋上方或鄰近有人作業時，工作台設護欄、腳趾板與安全的上下設備，通道避開預留筋並清除絆腳物。護蓋容易在搬運、綁紮時被碰落，應每日巡視、脫落立即補回。圖中鋼筋長度、間距、護蓋與工作台尺寸皆為示意，實際依營造安全衛生設施標準、職業安全衛生設施規則、施工計畫與相關法規辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;

const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {

    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
