.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;

                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;

    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));

    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }

    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));

        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {

                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));

    let bevel;

        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;
            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;
            return [x - (mx / length) * by, y - (my / length) * by];
        });

    st.hit = hit ? 1 : st.hit * Math.exp(-dt / 0.6);
    st.ubdd = -ag - f; st.vb += st.ubdd * dt; const du = st.vb * dt; st.ub += du;
    const z = st.qL / QD; st.qL += KL * du * (1 - z * z * (0.5 * Math.sign(du * z) + 0.5));
    const ab = ag + st.ubdd;
    st.rdd = -ab - 2 * Z1 * W1 * st.rd - W1 * W1 * st.r; st.rd += st.rdd * dt; st.r += st.rd * dt;
    st.t += dt;
  }
  const hold = (x, v, dt, tau) => Math.max(Math.abs(v), x * Math.exp(-dt / tau));
  function step(dt) {
    const n = Math.max(1, Math.ceil(dt / 0.001)), h = dt / n;
    for (let i = 0; i < n; i++) phys(h);
    const ab = st.ag + st.ubdd;
    for (let i = 0; i <= NF; i++) {
      st.bars[0][i] = hold(st.bars[0][i], (i ? st.ag + GAM * PHI[i] * st.qdd : st.ag) / g, dt, 0.9);
      st.bars[1][i] = hold(st.bars[1][i], (i ? ab + GAM * PHI[i] * st.rdd : ab) / g, dt, 0.9);
    }
    st.pk.f = hold(st.pk.f, (st.ag + GAM * st.qdd) / g, dt, 4);
    st.pk.i = hold(st.pk.i, (ab + GAM * st.rdd) / g, dt, 4);
    st.pk.ub = hold(st.pk.ub, st.ub, dt, 4);
    // 目前狀態（含遲滯：候選狀態需持續 0.7 秒才切換；撞牆立即切換）
    const tl = ((st.t % LOOP) + LOOP) % LOOP;

  }

  // ── 幾何 ──
  const PX0 = -58, PX1 = 60, PY = 27;
  const COLS_X = [-11, 0, 11], COLS_Y = [-9, 9];
  const lv = (k2) => Z0 + STORY * k2;
  function building(cx, Sh, bars, iso) {
    const it = [];
    const sAt = (k2, z) => { const z0 = lv(k2), z1 = lv(k2 + 1) - 1.4; return Sh[k2] + (Sh[k2 + 1] - Sh[k2]) * Math.max(0, Math.min(1, (z - z0) / (z1 - z0))); };
    for (let f = 0; f <= NF; f++) {
      const s = Sh[f];
      const zt = lv(f), zb = f === 0 ? (iso ? PZ + 12.3 : GZ) : zt - 1.4;
      // 樓版正面（+y）的加速度條：長度 ∝ |a|，1 g = 20 單位
      const a = bars[f], len = Math.min(22, a * 20), lvl = a > 0.6 ? 3 : a > 0.3 ? 2 : 1;

      if (iso && f === 0) {
        // 隔震層上部基礎版（大梁版）
        it.push(B(cx - 13, cx + 13, -11, 11, zb, zt, "m-conc", "hi", s, s, bar + lineS(pathOf([[cx - 13 + s, 11, zb + 1.1], [cx + 13 + s, 11, zb + 1.1]].map(at)), "faint")));
      } else {
        it.push(B(cx - 12.8, cx + 12, -10.8, 10, zb, zt, f === NF ? "m-slab" : "m-slab", "hi", s, s, bar));
      }
      // 加速度計（樓版頂）
      if (f < NF) it.push(B(cx + 7.4, cx + 8.8, 6, 7.4, zt, zt + 0.8, "m-brass", "mid", s, s, dotS([at([cx + 8.1 + s, 6.7, zt + 0.8])], 0.35, "hi")));
    }
    for (let f = 0; f < NF; f++) {
      const z0 = lv(f), z1 = lv(f + 1) - 1.4, s0 = Sh[f], s1 = Sh[f + 1];
      for (const x of COLS_X) for (const y of COLS_Y) it.push(B(cx + x - 1, cx + x + 1, y - 1, y + 1, z0, z1, "m-col", "hi", s0, s1));
      // 後牆（-y）與側牆（-x）+ 窗
      const win = (xa, xb, ya, yb2) => {
        const za = z0 + 2.6, zb2 = z1 - 2.2;
        return lineS(pathOf([[xa + sAt(f, za), ya, za], [xb + sAt(f, za), yb2, za], [xb + sAt(f, zb2), yb2, zb2], [xa + sAt(f, zb2), ya, zb2]].map(at), true), "lo");
      };
      it.push(B(cx - 12, cx + 12, -10.8, -10, z0, z1, "m-wall", "mid", s0, s1, win(cx - 8, cx - 3, -10, -10) + win(cx + 3, cx + 8, -10, -10)));
      const sw = (y0, y1) => { const za = z0 + 2.6, zb2 = z1 - 2.2; return lineS(pathOf([[cx - 12 + sAt(f, za), y0, za], [cx - 12 + sAt(f, za), y1, za], [cx - 12 + sAt(f, zb2), y1, zb2], [cx - 12 + sAt(f, zb2), y0, zb2]].map(at), true), "lo"); };
      it.push(B(cx - 12.8, cx - 12, -10, 10, z0, z1, "m-wall", "mid", s0, s1, sw(-6, -1) + sw(2, 7)));
    }
    // 屋頂：女兒牆、樓梯間、水塔
    const zr = lv(NF), sr = Sh[NF];
    it.push(B(cx - 12.8, cx + 12, -10.8, -10, zr, zr + 1.6, "m-slab", "mid", sr));
    it.push(B(cx - 12.8, cx - 12, -10, 10, zr, zr + 1.6, "m-slab", "mid", sr));
    it.push(B(cx + 11.2, cx + 12, -10, 10, zr, zr + 1.6, "m-slab", "mid", sr));
    it.push(B(cx - 12.8, cx + 12, 9.2, 10, zr, zr + 1.6, "m-slab", "mid", sr));
    it.push(B(cx - 9, cx - 2, -8.6, -2.6, zr, zr + 5.4, "m-pent", "hi", sr, sr, lineS(pathOf([[cx - 9 + sr + 1.6, -2.6, zr + 0.2], [cx - 9 + sr + 1.6, -2.6, zr + 4], [cx - 9 + sr + 4, -2.6, zr + 4], [cx - 9 + sr + 4, -2.6, zr + 0.2]].map(at)), "lo")));
    it.push(B(cx + 2.4, cx + 8.6, -8, -2, zr, zr + 1, "m-steel", "mid", sr));
    it.push(CZ(cx + 5.5, -5, 2.6, zr + 1, zr + 4.4, "m-tank", "hi", sr, sr, 22, lineS(pathOf([[cx + 5.5 + sr - 2.6 * 0.5, -5 + 2.6 * 0.866, zr + 2.7], [cx + 5.5 + sr + 2.6 * 0.866, -5 + 2.6 * 0.5, zr + 2.7]].map(at)), "faint")));

  }
  // 鉛心橡膠支承：bottom 位移 s0、top 位移 s1
  function bearing(x, y, s0, s1, cut) {
    const it = [], R = 3.1, zb = PZ + 3.5, FH = 3.6;
    // RC 墩座
    it.push(B(x - 3.3, x + 3.3, y - 3.3, y + 3.3, PZ + 1.5, zb, "m-pit", "hi", s0));
    // 下法蘭（錨栓）
    const fl0 = B(x - FH, x + FH, y - FH, y + FH, zb, zb + 0.5, "m-steel", "mid", s0, s0, dotS([[x - 3, y - 3], [x + 3, y - 3], [x - 3, y + 3], [x + 3, y + 3]].map(([a, b]) => at([a + s0, b, zb + 0.5])), 0.4, "hi"));

    // 上法蘭（隨上部結構）
    it.push(B(x - FH, x + FH, y - FH, y + FH, z1, z1 + 0.5, "m-steel", "mid", s1));
    return it;
  }

  function scene() {
    const it = [];
    const u = ugNow() * GX, ub = st.ub * GX;
    // 導軌（靜態，在基座上）
    for (const y of [-18, 18]) it.push(B(-74, 74, y - 1.5, y + 1.5, 0, 1.8, "m-steel", "mid"));
    // 反力塊 + 作動器（靜態）
    it.push(B(-96, -88, -9, 9, 0, 15, "m-react", "hi", 0, 0, dotS([[-88, -6, 12.5], [-88, 6, 12.5], [-88, -6, 3], [-88, 6, 3]].map(at), 0.45, "hi")));
    it.push(CX(-88, -76, 0, 6.5, 2.8, "m-act", "hi", 22, lineS(pathOf([[-84, 2.8 * 0.35, 6.5 + 2.8 * 0.94], [-80, 2.8 * 0.35, 6.5 + 2.8 * 0.94]].map(at)), "lo")));
    it.push(B(-86, -80, -2, 2, 9.3, 11.4, "m-brass", "mid", 0, 0, dotS([at([-84.5, 2, 10.4]), at([-81.5, 2, 10.4])], 0.35, "hi")));
    for (const xx of [-88, -76]) it.push(B(xx - 0.6, xx + 0.6, -3.6, 3.6, 2.6, 10.4, "m-steel", "mid"));
    it.push(CX(-76, PX0 - 1.4 + u, 0, 6.5, 1.1, "m-rod", "hi", 16));
    // 振動平台（移動）
    for (const y of [-18, 18]) for (const x of [-46, -6, 34]) it.push(B(x - 4 + u, x + 4 + u, y - 2.4, y + 2.4, 1.8, 4.5, "m-steel", "hi", 0, 0, dotS([at([x - 2.6 + u, y + 2.4, 3.6]), at([x + 2.6 + u, y + 2.4, 3.6])], 0.35, "hi")));
    const pl = B(PX0, PX1, -PY, PY, 4.5, PZ, "m-plat", "hi", u, u);
    it.push(pl);
    it.push(B(PX0 - 1.4, PX0, -3, 3, 4.6, 8.4, "m-steel", "mid", u));
    // 指針（平台前緣 → 刻度尺）
    it.push(B(-0.4, 0.4, PY, PY + 0.6, 1.2, 4.5, "m-brass", "mid", u));
    it.push(B(-0.4, 0.4, PY, PY + 3, 0.7, 1.2, "m-brass", "mid", u));
    // 左：固定基礎（筏式基礎）
    const fdn = lineS(pathOf([[CL - 18 + u, 16, PZ + 3], [CL + 18 + u, 16, PZ + 3], [CL + 18 + u, -16, PZ + 3]].map(at)), "faint") + lineS(pathOf([[CL - 15 + u, -13, GZ], [CL + 15 + u, -13, GZ], [CL + 15 + u, 13, GZ], [CL - 15 + u, 13, GZ]].map(at), true), "faint") + dotS([[CL - 16.5, -14.5], [CL + 16.5, -14.5], [CL - 16.5, 14.5], [CL + 16.5, 14.5]].map(([a, b]) => at([a + u, b, GZ])), 0.45, "hi");
    it.push(B(CL - 18, CL + 18, -16, 16, PZ, GZ, "m-conc", "hi", u, u, fdn));

    it.push(B(CR - hx - t, CR + hx + t, -hy - t, hy + t, PZ, PZ + 1.5, "m-pit", "hi", u));
    it.push(B(CR - hx - t, CR - hx, -hy - t, hy + t, PZ + 1.5, GZ, "m-pit", "hi", u, u, dotS([at([CR - hx + u, -1.2, PZ + 9.4]), at([CR - hx + u, 1.2, PZ + 9.4]), at([CR - hx + u, -1.2, PZ + 5]), at([CR - hx + u, 1.2, PZ + 5])], 0.4, "hi")));
    it.push(B(CR - hx, CR + hx + t, -hy - t, -hy, PZ + 1.5, GZ, "m-pit", "hi", u));
    it.push(B(CR + hx, CR + hx + t, -hy, hy + t, PZ + 1.5, PZ + 3.2, "m-pit", "hi", u));
    it.push(B(CR - hx, CR + hx, hy, hy + t, PZ + 1.5, PZ + 3.2, "m-pit", "hi", u));
    // 支承 ×6（前排剖半）
    for (const x of [-9.4, 0, 9.4]) for (const y of [-7.6, 7.6]) it.push(...bearing(CR + x, y, u, u + ub, y > 0));
    // 油壓阻尼器：坑壁 → 基礎版下方托架
    const zD = PZ + 7.8;
    it.push(B(CR - hx, CR - hx + 1.6, -1.8, 1.8, zD - 1.8, zD + 1.8, "m-steel", "mid", u));
    it.push(CX(CR - hx + 1.6 + u, CR - 8 + u, 0, zD, 1.35, "m-damp", "hi", 20));
    it.push(CX(CR - 8 + u, CR - 7.2 + u, 0, zD, 1.6, "m-steel", "mid", 20));
    it.push(CX(CR - 7.2 + u, CR + 5 + u + ub, 0, zD, 0.55, "m-rod", "hi", 14));
    it.push(B(CR + 5 + u + ub, CR + 7 + u + ub, -1.2, 1.2, zD - 1.2, PZ + 12.3, "m-steel", "mid"));
    // 建物
    const Sf = PHI.map((p) => u + GAM * p * st.q * DX);
    const Si = PHI.map((p) => u + ub + GAM * p * st.r * DX);
    it.push(...building(CL, Sf, st.bars[0], false));
    it.push(...building(CR, Si, st.bars[1], true));
    return sortItems(it).map((i) => i.svg).join("");
  }
  const ugNow = () => ug0(st.t) * st.pga * g / PGA0;

  const stage = document.querySelector(".iso-stage");
  const rig = stage.querySelector('[data-part="rig"]');
  const readout = document.querySelector("[data-readout]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const fmt = (x, d) => x.toFixed(d);
  function draw() {
    rig.innerHTML = scene();
    if (window.ctaStep) window.ctaStep(st.cs);
    const ubcm = Math.round(st.pk.ub * 100);
    let text = "震度 " + shindo(st.pga).replace(" ", "") + " · " + fmt(st.pga, 2) + "g · 頂層 固定 " + fmt(st.pk.f, 2) + "g／隔震 " + fmt(st.pk.i, 2) + "g · 支承 " + ubcm + "cm";

  new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
  const svgEl = stage.querySelector("svg");
  stage.addEventListener("pointermove", (ev) => { const b = svgEl.getBoundingClientRect(); const sh = Math.max(0, Math.min(1, ((ev.clientX - b.left) / b.width - 0.08) / 0.84)); manual(0.05 * Math.pow(1.25 / 0.05, sh)); });
  const lvIdx = () => { let b = 0; LEVELS.forEach(([, p], i) => { if (Math.abs(Math.log(p / st.pgaT)) < Math.abs(Math.log(LEVELS[b][1] / st.pgaT))) b = i; }); return b; };
  stage.addEventListener("keydown", (ev) => {
    if (ev.key === " ") { ev.preventDefault(); playing = !playing; run(); return; }
    if (ev.key === "ArrowRight" || ev.key === "ArrowUp") { ev.preventDefault(); manual(LEVELS[Math.min(LEVELS.length - 1, lvIdx() + 1)][1]); }
    if (ev.key === "ArrowLeft" || ev.key === "ArrowDown") { ev.preventDefault(); manual(LEVELS[Math.max(0, lvIdx() - 1)][1]); }
    if (ev.key === "Home") { ev.preventDefault(); manual(LEVELS[0][1]); }
    if (ev.key === "End") { ev.preventDefault(); manual(LEVELS[LEVELS.length - 1][1]); }
  });
  const sim = (T) => { st = S0(); for (let x = 0; x < T; x += 1 / 60) step(1 / 60); };
  if (still.matches) sim(8);
  const q0 = new URLSearchParams(location.search).get("t");
  if (q0 !== null) { sim(+q0); playing = false; }
  draw(); run();
})();</script></body></html>
