const ELEVATION = 30;
const SHADES = 4;

const LOOP = SC.LOOP;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const narrow = matchMedia("(max-width:560px)");

const $ = (s) => svg.querySelector('[data-part="' + s + '"]');

const readout = document.querySelector("[data-readout]");

let t = 0, last = 0, fid = 0, visible = false, playing = !still.matches, idle = 0, cs = 0;
// 狀態判定（含遲滯，避免在門檻附近來回跳）
function stateOf(S, prev) {

}
function textOf(S) {

  if (cs === 0) return "靜置 · 超額孔隙水壓 0 kPa · 淺基礎沉陷 " + Math.round(S.set * 10) + " cm";
  if (cs <= 2) return "加速度 " + g + " g · " + base;

function draw() {

  G.dyn.innerHTML = f.dyn;
  G.front.innerHTML = f.front;

function tick(now) {

stage.addEventListener("pointermove", (event) => {

  if (event.key === "ArrowLeft") to = t - 0.5;

if (still.matches) t = 12.5;
const q0 = new URLSearchParams(location.search).get("t");
if (q0 !== null) { t = +q0; playing = false; }
draw(); run();
</script></body></html>
