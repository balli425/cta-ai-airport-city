</style><script>(()=>{const S=[{"name":"危害：傾倒・墜落","desc":"架子高、基底窄又裝了腳輪：容易滑動、翻倒，人從工作台墜落。"},{"name":"✕ 人在架上就移動","desc":"圖省事不下來，推移時腳輪卡到高差或雜物，整座連人翻倒。"},{"name":"✕ 沒煞車・沒護欄","desc":"腳輪沒固定，作業一用力架子就滑走；工作台沒護欄，人直接墜落。"},{"name":"✓ 架上淨空再移動","desc":"人員與材料先下來，清除雜物、補平高差，再由地面推移。"},{"name":"✓ 腳輪煞車＋輔助撐座","desc":"定位後四個腳輪全部煞住；架高時伸出輔助撐座加大基底。"},{"name":"✓ 滿鋪・護欄・架內爬梯","desc":"工作台滿鋪、四周護欄與腳趾板；從架內爬梯上下，不爬拉桿。"},{"name":"✓ 在護欄內作業","desc":"身體不探出護欄、不在台上墊高；有人在架上時不可移動。"},{"name":"檢查重點","desc":"每次使用前確認煞車、撐座、護欄、交叉拉桿與上下設備都齊全。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>

-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>磚紅＝危害部位、傾倒與墜落路徑、這一步正在裝設的構件；✕ 錯誤、✓ 正確；深藍腳輪＝已煞車</span><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>藍灰＝門型框架與腳柱、青灰＝交叉拉桿、土黃＝護欄與爬梯、棕＝輔助撐座、木色＝踏板與腳趾板</span></span><span class="iso-caption">移動式施工架作業示意（以台灣工地常見的框式／門型施工架加裝腳輪，用於室內配管、天花板等作業為例，鏡頭依步驟拉近或拉遠）。常見災害有兩類：人員或材料還在架上就推移，腳輪卡到地面高差、開口或雜物而整座翻倒；腳輪未煞車固定、工作台未設護欄，作業時架子滑動而墜落。正確做法：移動前人員與材料先離開，清除路徑上的雜物並補平高差；定位後所有腳輪以煞車等有效方法固定，架高相對於基底寬度較大時伸出輔助撐座；工作台滿鋪踏板，四周設護欄與腳趾板，並設安全上下設備（架內爬梯），不攀爬交叉拉桿；勞工在架上作業時不得移動施工架。圖中架高、基底寬度、撐座伸出量與護欄高度皆為示意，實際依營造安全衛生設施標準、職業安全衛生設施規則、施工架製造者規範、施工計畫與相關法規辦理。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)

}

function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

    const out = [];
    for (const [cx, cy, start] of corners) {

            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

function signedArea(points) {
