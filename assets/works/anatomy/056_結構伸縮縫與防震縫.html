閃光與牆面裂縫</span></span><span class="iso-caption">兩棟結構完全分開、各自有基礎與柱梁，縫從基礎面一路貫通到屋頂。伸縮縫讓長向建築在溫度變化（及乾縮）時各自伸縮；防震縫則讓高度、勁度不同的兩棟在地震中以各自的週期擺動，相對位移由縫吸收，避免互撞。跨縫的樓板、外牆與屋頂都以「一端固定、一端可滑動」的蓋板或伸縮皮囊覆蓋，維持通行、防水與防火。正面一樓的外牆縫蓋板刻意剖除，以便看見縫本身。切換對照時縫寬不足，兩棟在低棟屋頂高度互撞，撞擊集中在接觸處的樓板邊與牆面。圖中縫寬 150 mm、溫差 ±20 °C 對應約 ±8 mm、地震相對位移等皆為示意值，各位移在圖面上大幅放大；實際縫寬依結構計算之設計層間變位，並依建築技術規則建築構造編及內政部「建築物耐震設計規範及解說」相關規定檢討，依設計圖說。動畫時間大幅壓縮。磚紅箭頭表示溫度伸縮與地震時兩棟的移動方向，長度已放大，為示意。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
