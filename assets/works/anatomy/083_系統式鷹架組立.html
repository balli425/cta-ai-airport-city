@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>紅色插銷＝尚未敲緊的節點；鐵鎚敲下後插銷落座、轉回原色</span><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>灰藍＝立桿（每 0.5 m 一個圓盤）、青綠＝橫桿、赭紅＝斜撐、黃＝護欄、紫灰＝壁連座</span></span><span class="iso-caption">盤扣式（圓盤式）系統鷹架沿外牆組立示意。立桿每隔一定間距焊有圓盤，橫桿與斜撐兩端的接頭扣入圓盤孔，再把插銷由上往下以鐵鎚敲緊，節點即成剛接；底部為墊板、可調底座與起始套管，第一節立桿長短交錯使接頭錯開。每一步距鋪鋼踏板，外側設上欄杆、中欄杆與腳趾板，端部一跨為樓梯塔供上下通行，並每隔數層、數跨以壁連座拉結外牆以防傾倒。圖中跨距 1.8 m、寬 0.9 m、步距 2.0 m、壁連座間距、護欄高度與組立速度皆為示意，實際依設計圖說、廠商技術資料及職業安全衛生設施規則、營造安全衛生設施標準等職業安全衛生相關法規辦理；組立、使用中及遇大雨、強風、地震後均應檢查確認。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}

  }
  // 一層的橫桿組：x 向（內外兩面）＋ y 向橫檔
  function tier(z, t0, dt, hitList = {}) {

    for (const y of YS) for (let b = 0; b < 4; b++) { const id = `${z}|${y}|${b}`; ledger([XS[b], y], [XS[b + 1], y], z, t0 + dt * n++, "c-led", hitList[id] || []); }

  // 底座（可調千斤頂）
  let n = 0;
  for (const x of XS) for (const y of YS) {
    const s = box(x - 1.2, y - 1.2, 0.55, x + 1.2, y + 1.2, 0.95, "jack", { bevel: 0.1 }) + dotsSvg([at([x - 0.8, y + 0.8, 0.95]), at([x + 0.8, y + 0.8, 0.95])], { size: 0.3, tone: "hi" }) +
      tube([x, y, 0.95], [x, y, 4.6], 0.55, "c-screw") + cyl(x, y, 0.95, 2.6, 0.55, "nut", { steps: 6 }) + tube([x - 1.5, y, 2.9], [x + 1.5, y, 2.9], 0.3, "c-screw");

  // 起始套管（含第一個圓盤）

      tube([x, 0.4, tz], [x, 2.6, tz], 0.8, "c-tie") + box(x - 0.9, 2.1, tz - 0.9, x + 0.9, 3.9, tz + 0.9, "clamp", { bevel: 0.1 });

const SC = makeScene(P);

const scrub = (to) => { playing = false; t = ((to % LOOP) + LOOP) % LOOP; draw(); clearTimeout(idle); idle = setTimeout(() => { playing = !still.matches; run(); }, 3000); };
