.iso .tb path{fill:none;stroke-linecap:round;vector-effect:none}
.iso .fl path{fill:none;stroke-linecap:butt;stroke-linejoin:round}
.iso .fl .fl-h{stroke:#fff;stroke-opacity:.9;stroke-dasharray:9 7}
.iso .fl .fl-l{stroke:hsl(6 60% 46%);stroke-dasharray:9 7}
.iso .fl path.fl-a{fill:hsl(6 60% 46%);stroke:#fff;stroke-width:1}
.iso .fl-blue .fl-l{stroke:#174e75}.iso .fl-blue path.fl-a{fill:#174e75}
.iso .mk circle{fill:#fff;stroke-width:2.6}
.iso .mk path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.iso .mk-x circle,.iso .mk-x path{stroke:hsl(6 60% 46%)}
.iso .mk-ok circle,.iso .mk-ok path{stroke:#174e75}
.iso .impact{fill:none;stroke:hsl(6 58% 48%);stroke-width:1.6;stroke-dasharray:4 3}
.iso .nt{font:700 12px "Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:calc(12px / var(--z,1));fill:#174e75;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.iso .nt.red{fill:hsl(6 58% 40%)}
.iso .dim{fill:none;stroke:#174e75;stroke-width:1.1}

.iso .c-leg path{stroke-linecap:butt}
.iso .rivet{fill:hsl(184 20% 28%)}.iso g.hot .rivet{fill:hsl(6 50% 34%)}
.iso .pane{fill:hsl(205 22% 62%);fill-opacity:.55;stroke:none}
.iso .net-f{fill:hsl(146 24% 40%);fill-opacity:.26;stroke:none}
.iso .net-g{fill:none;stroke:hsl(146 26% 30%);stroke-opacity:.28;stroke-width:.45}
.iso .net-e{fill:none;stroke:hsl(146 26% 28%);stroke-opacity:.8;stroke-width:1}
.iso .net-roll{fill:none;stroke:hsl(146 24% 34%);stroke-linecap:round}
.iso .net.hot .net-f{fill:hsl(6 50% 50%);fill-opacity:.3}.iso .net.hot .net-e{stroke:hsl(6 56% 44%);stroke-width:2.2;stroke-opacity:1}.iso .net.hot .net-g{stroke:hsl(6 40% 36%)}
.iso .tag .tag-b{stroke-width:.6;stroke-linejoin:round}
.iso .tag.no .tag-b{fill:hsl(4 52% 52%);stroke:hsl(4 40% 30%)}
.iso .tag.ok .tag-b{fill:hsl(146 34% 40%);stroke:hsl(146 34% 24%)}
.iso .tag.hotT .tag-b{stroke:#174e75;stroke-width:1.8}
.iso .tag text{fill:#fff;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:700}
.iso .cone{fill:hsl(18 70% 56%);stroke:hsl(14 56% 32%);stroke-width:.8;stroke-linejoin:round}
.iso .coneband{fill:#fff;stroke:none}
.iso .lanyard{fill:none;stroke:hsl(38 60% 40%);stroke-linecap:round}
.iso .hotl{stroke:hsl(6 60% 44%)!important}
.iso .lifeline{fill:none;stroke:#174e75;stroke-linecap:round}
.iso .hookc{fill:hsl(212 10% 82%);stroke:hsl(212 20% 24%);stroke-width:1}
.iso .zone{fill:hsl(6 60% 50%);fill-opacity:.14;stroke:hsl(6 60% 46%);stroke-width:1.6;stroke-dasharray:6 4;stroke-linejoin:round}
.iso .pin-d{fill:#174e75;stroke:#fff;stroke-width:.8}
.iso .zone.blue{fill:hsl(205 60% 40%);fill-opacity:.08;stroke:#174e75}


.iso-stage svg{overflow:hidden;-webkit-mask:linear-gradient(to right,transparent 254px,#000 268px) 0 44px/100% 236px no-repeat,linear-gradient(to top,transparent 40px,#000 58px) 0 280px/100% calc(100% - 280px) no-repeat;mask:linear-gradient(to right,transparent 254px,#000 268px) 0 44px/100% 236px no-repeat,linear-gradient(to top,transparent 40px,#000 58px) 0 280px/100% calc(100% - 280px) no-repeat}@media (max-width:560px){.iso-stage svg{-webkit-mask:none;mask:none}}
