@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;

    if (s === 0) { mag = "on"; }
    else if (s === 1) { mag = st.p < 0.45 ? "on" : "rel"; smoke = clamp01(st.p / 0.5); i = 90 - 14 * ease((st.p - 0.55) / 0.45); a = 90 - 10 * ease((st.p - 0.55) / 0.45); }
    else if (s === 2) { mag = "off"; smoke = 1; i = lerp(76, 0, ease(st.p / 0.92)); a = Math.max(HOLD, lerp(80, HOLD, ease(st.p / 0.55))); }
    else if (s === 3) { mag = "off"; smoke = 1; i = 0; a = HOLD; trig = clamp01(st.p / 0.3); lev = 1 - ease((st.p - 0.3) / 0.45); }
    else if (s === 4) { mag = "off"; smoke = 1; i = 0; lev = 0; trig = 1; a = lerp(HOLD, 0, ease(st.p / 0.7)); latch = clamp01((st.p - 0.72) / 0.1); }
    else if (s === 5) { mag = "off"; smoke = 1; i = 0; a = 0; lev = 0; trig = 1; latch = 1; swell = ease((st.p - 0.3) / 0.5); }
    else {
      // 對照：無順位器。先快速回到全開，再主動扇先關、被動扇撞上蓋縫條卡住
      coord = 0; mag = "off"; lev = 0;
      const r = ease(st.p / 0.12);
      smoke = 1;
      if (st.p < 0.14) { i = lerp(0, 90, r); a = lerp(0, 90, r); smoke = 1 - r * 0.6; }
      else {
        a = lerp(90, 0, ease((st.p - 0.16) / 0.26));
        i = Math.max(STUCK, lerp(90, 0, ease((st.p - 0.2) / 0.34)));
        leak = clamp01((st.p - 0.5) / 0.1);
        smoke = 1;
      }
    }
    return Object.assign(st, { i, a, lev, trig, mag, smoke, leak, coord, latch, swell });
  }

  // ── 門扇幾何 ──
  // 被動扇：鉸鏈 x=0，關閉時沿 +x；主動扇：鉸鏈 x=70，關閉時沿 −x。開啟時往 +y 轉
  function frameOf(which, deg) {
    const f = deg * D2R;
    if (which === "i") return { h: [HX_I, 0], d: [Math.cos(f), Math.sin(f)], n: [-Math.sin(f), Math.cos(f)], w: WI };
    return { h: [HX_A, 0], d: [-Math.cos(f), Math.sin(f)], n: [Math.sin(f), Math.cos(f)], w: WA };
  }
  const LP = (F, a, b, z) => [F.h[0] + a * F.d[0] + b * F.n[0], F.h[1] + a * F.d[1] + b * F.n[1], z];
  function lbox(F, a0, a1, b0, b1, z0, z1, m) {
    const pr = [[a0, b0], [a1, b0], [a1, b1], [a0, b1]].map(([a, b]) => { const p = LP(F, a, b, 0); return [p[0], p[1]]; });
    return prism(pr, FZ, z0, z1, { m });
  }
  function leaf(which, deg, st) {
    const F = frameOf(which, deg), o = [];
    const isA = which === "a";
    const moving = (st.step >= 1 && st.step <= 4 && ((isA && st.step !== 3 && deg > 0.05 && deg < 89.9) || (!isA && deg > 0.05 && deg < 89.9))) || (st.step === 6 && st.p > 0.14 && deg > 0.05 && deg < 89.9 && !(deg <= STUCK + 0.01 && !isA));
    const m = isA ? "leafA" : "leafI";
    o.push(lbox(F, 0.2, F.w - 0.2, 0, T, 0.6, H - 0.2, m));
    // 面上的細部：門面分割線、把手／天地栓、門弓器
    const face = T + 0.02, ed = [];
    ed.push(pathOf([LP(F, 2.5, face, 6), LP(F, F.w - 2.5, face, 6), LP(F, F.w - 2.5, face, H - 6), LP(F, 2.5, face, H - 6)].map(at), true));
    o.push(`<path class="leafpanel" d="${ed.join("")}"/>`);
    if (isA) {
      o.push(lbox(F, F.w - 6, F.w - 4.8, T, T + 1.2, 38, 40, "steel"), lbox(F, F.w - 10, F.w - 4.8, T + 1.2, T + 2, 38.4, 39.6, "steel"));
      o.push(dot(LP(F, F.w - 5.4, face, 34), 0.5, "keyhole"));
      // 蓋縫條：在主動扇自由端、+y 面，伸出 1.6 壓住被動扇
      o.push(lbox(F, F.w - 1.4, F.w + 1.6, T, T + 0.7, 1, H - 1, st.step === 4 ? "act" : "astr"));
    } else {
      // 天地栓
      o.push(lbox(F, F.w - 2.6, F.w - 1.4, T, T + 0.5, H - 14, H - 3, "steel"), lbox(F, F.w - 2.6, F.w - 1.4, T, T + 0.5, 3, 14, "steel"));
    }
    // 膨脹條（門扇頂與自由端，+y 側邊緣）
    const sw = 0.3 + 0.9 * st.swell;
    o.push(lbox(F, F.w - 0.2, F.w - 0.2 + 0.05 + 0.5 * st.swell, 0.5, T - 0.5, 0.8, H - 0.4, st.swell > 0 ? "intuOn" : "intu"));
    // 鉸鏈
    for (const z of [8, 42, 76]) o.push(lbox(F, -0.9, 0.4, T - 0.2, T + 0.5, z, z + 4.5, "hinge"));
    // 門弓器本體
    o.push(lbox(F, 3, 15, T, T + 2.4, H - 6.4, H - 2.6, moving ? "act" : "closer"));
    o.push(dot(LP(F, 12.5, T + 1.2, H - 2.5), 0.6, "pinion"));
    return o.join("");
  }
  // 門弓器搖臂：主臂從齒輪軸到肘節，副臂到順位器面上的支座
  function closerArm(which, deg, st, moving) {
    const F = frameOf(which, deg);
    const C = LP(F, 12.5, T + 1.2, H - 2.2);
    const sx = which === "i" ? HX_I + 17 : HX_A - 17, Sp = [sx, 5.6, H + 1.3];
    const L1 = 11.5, L2 = 13.5;
    const dx = Sp[0] - C[0], dy = Sp[1] - C[1], d = Math.hypot(dx, dy);
    const aa = (L1 * L1 - L2 * L2 + d * d) / (2 * d), hh = Math.sqrt(Math.max(0, L1 * L1 - aa * aa));
    const mx = C[0] + (aa * dx) / d, my = C[1] + (aa * dy) / d;
    // 肘節取離門較遠的一側（+y）
    const k1 = [mx - (hh * dy) / d, my + (hh * dx) / d], k2 = [mx + (hh * dy) / d, my - (hh * dx) / d];
    const K = k1[1] > k2[1] ? k1 : k2;
    const Kp = [K[0], K[1], H - 0.4];
    const cls = moving ? " on" : "";
    return stroke([C, Kp], 1.5, "arm-o") + stroke([C, Kp], 1.0, "arm" + cls) + stroke([Kp, Sp], 1.3, "arm-o") + stroke([Kp, Sp], 0.8, "arm2" + cls) + dot(Kp, 0.7, "elbow") + dot(Sp, 0.7, "elbow") + box(sx - 1.6, 4.4, H + 0.4, sx + 1.6, 5.6, H + 2.4, "steel", { bevel: 0.1 });
  }
  // 順位器：門樘上方的長條，擋桿（主動扇側）與觸發滾輪（被動扇側）
  function coordinator(st) {
    if (!st.coord) {
      return box(1, 2.6, H + 0.2, 69, 4.4, H + 2.6, "steel", { bevel: 0.2 }); // 只有支座板（無順位器）
    }
    const o = [];
    const on = st.step === 2 || st.step === 3;
    o.push(box(1, 2.6, H + 0.2, 69, 4.4, H + 2.6, on ? "act" : "coord", { bevel: 0.2 }));
    // 擋桿：繞 z 軸轉，伸出時指向 +y
    const ang = lerp(0, 90, st.lev) * D2R;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const pr = [[0, -0.8], [9.2, -0.8], [9.2, 0.8], [0, 0.8]].map(([a, b]) => [LEV_X + a * sa * 0 - b * 0 + (a * -ca) * 0 + (-a * ca + b * sa) * 0 + (a * Math.cos(Math.PI / 2 - ang) * 0) + 0, 0]);
    // 擋桿平面輪廓（伸出方向 v=(−cos·, sin·)，收起時沿 −x 貼在條上）
    const v = [-ca, sa], n2 = [-sa, -ca];
    const pts2 = [[0, -0.9], [9.2, -0.9], [9.2, 0.9], [0, 0.9]].map(([a, b]) => [LEV_X + a * v[0] + b * n2[0], 3.5 + a * v[1] + b * n2[1]]);
    o.push(prism(pts2, FZ, H - 2.4, H + 0.2, { m: st.step === 2 && st.lev > 0.5 ? "act" : st.step === 3 ? "act" : "lever" }));
    o.push(dot([LEV_X, 3.5, H + 0.25], 0.8, "pinion"));
    // 觸發滾輪（被動扇關上時被壓入）
    const ty = 3.6 - 1.4 * st.trig * 0 , tz = H - 1.6 + 1.2 * st.trig;
    o.push(box(12.5, 2.2, tz, 15.5, 3.4, H + 0.2, st.step === 3 && st.trig > 0 && st.trig < 1 ? "act" : st.step === 3 ? "act" : "lever", { bevel: 0.2 }));
    void pr; void ty;
    return o.join("");
  }
  // 電磁門扣（側牆上）
  function magnet(x, y, side, st) {
    const cls = st.mag === "on" ? "magOn" : st.mag === "rel" ? "act" : "mag";
    const x0 = side < 0 ? x : x - 4.8, x1 = side < 0 ? x + 4.8 : x;
    return box(x0, y - 2, 26, x1, y + 2, 31, cls, { bevel: 0.3 }) + (st.mag === "on" ? dot([side < 0 ? x1 : x0, y, 28.5], 0.6, "ledG") : "");
  }

  // ── 靜態：底座、地坪 ──
  const BASE = { x: -24, y: -34, w: 118, d: 90, r: 3 };
  function base() {
    const o = [`<path class="iso-halo" d="${haloOf(BASE, -6, 4, P)}"/>`];
    o.push(solidSvg(slabOf(BASE, -6, 4, P, 4, 0.8), { tone: "mid", className: "m-plinth" }));
    o.push(box(-22, -32, -2, 92, 54, 0, "floor", { bevel: 0.3 }));
    // 地坪分割縫（停在牆根與地坪邊）
    const g = [];
    for (let y = 12; y < 54; y += 14) g.push(seg([-9, y, 0.01], [79, y, 0.01]));
    for (let y = -30; y < -6; y += 12) g.push(seg([-22, y, 0.01], [92, y, 0.01]));
    o.push(`<path class="iso-line c-joint" d="${g.join("")}"/>`);
    const tk = []; for (let x = -22; x <= 92; x += 4) tk.push(seg([x, 56, -4.6], [x, 56, x % 20 === 18 ? -2.6 : -3.6]));
    o.push(L(tk.join(""), "faint"));
    // 地面門檻
    o.push(box(-3, -2, 0, 73, 2.6, 0.5, "steel", { bevel: 0.1 }));
    return o.join("");
  }
  // 後牆（火源側在牆後）：半透明，讓牆後的煙看得見
  function backWall() {
    const o = [];
    o.push(box(-15, -6, 0, -3, 0, 100, "wall", { bevel: 0 }));
    o.push(box(73, -6, 0, 85, 0, 100, "wall", { bevel: 0 }));
    o.push(box(-3, -6, H + 3, 73, 0, 100, "wall", { bevel: 0 }));
    return `<g class="ghost">${o.join("")}</g>`;
  }
  function frameStatic(st) {
    const o = [];
    // 門樘：兩側框與上框（鋼製）
    o.push(box(-3, -2, 0, 0, 2.6, H + 3, "frame", { bevel: 0.1 }));
    o.push(box(70, -2, 0, 73, 2.6, H + 3, "frame", { bevel: 0.1 }));
    o.push(box(0, -2, H, 70, 2.6, H + 3, "frame", { bevel: 0.1 }));
    // 氣密條（門樘門擋面，深灰）
    const seal = st.step === 5 ? "sealOn" : "seal";
    o.push(box(-0.05, -0.6, 0.5, 0.4, 0, H - 0.05, seal, { bevel: 0 }), box(69.6, -0.6, 0.5, 70.05, 0, H - 0.05, seal, { bevel: 0 }), box(0, -0.6, H - 0.4, 70, 0, H, seal, { bevel: 0 }));
    return o.join("");
  }
  // 側牆（右側在後方，左側在前方→半透明）
  const sideR = () => box(79, 0, 0, 85, 50, 100, "wall", { bevel: 0 });
  const sideL = () => `<g class="ghost2">${box(-15, 0, 0, -9, 50, 100, "wall", { bevel: 0 })}</g>`;
  // 偵煙探測器（上方牆面）
  function detector(st) {
    const alarm = st.step >= 1 && st.step <= 5;
    const blink = alarm && Math.floor(st.u * 3) % 2 === 0;
    return cyl(35, 2.2, 3.2, 92, 93.4, alarm ? "act" : "det") + dot([35, 2.2, 93.45], 0.8, blink ? "ledR" : "led0");
  }
  // 煙（牆後、穿縫）
  function smokeBehind(st) {
    if (st.smoke <= 0) return "";
    const o = [];
    for (let j = 0; j < 14; j++) {
      const ph = (st.u * 0.22 + j / 14) % 1, x = -14 + ((j * 37) % 100), y = -28 + ((j * 13) % 18) + ph * 10, z = 14 + ph * 70;
      const r = (3.2 + ph * 4) * S, q = at([x, y, z]);
      o.push(`<circle class="smk" style="opacity:${(st.smoke * (0.55 - ph * 0.4)).toFixed(2)}" cx="${f1(q[0])}" cy="${f1(q[1])}" r="${f1(r)}"/>`);
    }
    return o.join("");
  }
  function smokeLeak(st, Fi) {
    if (st.leak <= 0) return "";
    const o = [];
    // 從牆後沿縫穿出的粗紅帶（主要流動）
    const gx = WI * Math.cos(STUCK * D2R) - 0.5;
    for (const z of [22, 46, 70]) {
      const a = [gx - 2, -14, z - 4], b = [gx, 1, z], c = [gx + 4, 22, z + 8];
      o.push(`<path class="leakband" style="opacity:${st.leak.toFixed(2)};stroke-width:${(3.2 * S).toFixed(1)}" d="${pathOf([a, b, c].map(at))}"/>`);
      o.push(arrow([gx + 2, 14, z + 4], [gx + 5, 26, z + 9], 3.4, "arrowR"));
    }
    for (let j = 0; j < 8; j++) {
      const ph = (st.u * 0.5 + j / 8) % 1, q = at([gx + 2 + ph * 6, 4 + ph * 26, 20 + ((j * 17) % 56) + ph * 8]);
      o.push(`<circle class="smkR" style="opacity:${(st.leak * (0.85 - ph * 0.6)).toFixed(2)}" cx="${f1(q[0])}" cy="${f1(q[1])}" r="${f1((2.2 + ph * 3.5) * S)}"/>`);
    }
    // 大 ✕
    const X = at([gx + 2, 6, H + 8]), r = 7 * S;
    o.push(`<g style="opacity:${st.leak.toFixed(2)}"><circle class="xbg" cx="${f1(X[0])}" cy="${f1(X[1])}" r="${f1(r * 1.25)}"/><path class="xmark" style="stroke-width:${f1(1.6 * S)}" d="M${f1(X[0] - r * 0.7)} ${f1(X[1] - r * 0.7)}L${f1(X[0] + r * 0.7)} ${f1(X[1] + r * 0.7)}M${f1(X[0] + r * 0.7)} ${f1(X[1] - r * 0.7)}L${f1(X[0] - r * 0.7)} ${f1(X[1] + r * 0.7)}"/></g>`);
    void Fi;
    return o.join("");
  }
  // 煙被擋住（第 5、6 步正確關閉時）
  function smokeBlocked(st) {
    if (!(st.step === 5 || (st.step === 4 && st.latch > 0))) return "";
    const o = [];
    for (const z of [26, 56]) {
      o.push(arrow([30, -22, z], [30, -8, z], 3.2, "arrowG"));
    }
    const X = at([30, 3, H + 8]), r = 6 * S;
    o.push(`<circle class="okbg" cx="${f1(X[0])}" cy="${f1(X[1])}" r="${f1(r * 1.2)}"/><path class="okmark" style="stroke-width:${f1(1.4 * S)}" d="M${f1(X[0] - r * 0.6)} ${f1(X[1])}L${f1(X[0] - r * 0.1)} ${f1(X[1] + r * 0.5)}L${f1(X[0] + r * 0.7)} ${f1(X[1] - r * 0.6)}"/>`);
    return o.join("");
  }

  // ── 每格重畫 ──
  function frame(st) {
    const o = [];
    o.push(smokeBehind(st));
    o.push(backWall());
    o.push(smokeBlocked(st));
    o.push(sideR());
    o.push(magnet(79, 40, 1, st));
    o.push(frameStatic(st));
    o.push(detector(st));
    // 順位器與門扇、搖臂：依深度排序
    const items = [];
    const Fi = frameOf("i", st.i), Fa = frameOf("a", st.a);
    const mvI = (st.step >= 1 && st.step <= 2 && st.i > 0.05 && st.i < 89.9) || (st.step === 6 && st.p > 0.14 && st.i > STUCK + 0.01 && st.i < 89.9);
    const mvA = (st.step >= 1 && st.step <= 4 && st.a > 0.05 && st.a < 89.9 && Math.abs(st.a - HOLD) > 0.05) || (st.step === 6 && st.p > 0.14 && st.a > 0.05 && st.a < 89.9);
    const cI = LP(Fi, WI / 2, 0, 0), cA = LP(Fa, WA / 2, 0, 0);
    items.push({ k: dep([cI[0], cI[1], 0]), s: leaf("i", st.i, st) });
    items.push({ k: dep([cA[0], cA[1], 0]), s: leaf("a", st.a, st) });
    items.sort((A, B) => A.k - B.k);
    o.push(items.map((it) => it.s).join(""));
    o.push(coordinator(st));
    o.push(closerArm("i", st.i, st, mvI), closerArm("a", st.a, st, mvA));
    // 擺動箭頭
    if (mvI) o.push(swingArrow(HX_I, 1, 22, Math.min(88, st.i + 4), Math.max(2, st.i - 18), 50));
    if (mvA) o.push(swingArrow(HX_A, -1, 26, Math.min(88, st.a + 4), Math.max(2, st.a - 18), 50));
    // 被擋住的瞬間：擋桿處紅圈
    if (st.step === 2 && st.a <= HOLD + 0.1) { const q = at([LEV_X, 8.6, H - 1]); o.push(`<circle class="hit" cx="${f1(q[0])}" cy="${f1(q[1])}" r="${f1(3.4 * S)}"/>`); }
    if (st.step === 3) { const q = at([14, 2.8, H - 1]); o.push(`<circle class="hit" cx="${f1(q[0])}" cy="${f1(q[1])}" r="${f1(3 * S)}"/>`); }
    // 無順位器：在順位器位置畫灰色 ✕
    if (st.step === 6) { const q = at([35, 3.5, H + 6]); o.push(`<text class="nocoord" x="${f1(q[0])}" y="${f1(q[1])}" text-anchor="middle">無順位器</text>`); }
    o.push(smokeLeak(st, Fi));
    o.push(magnet(-9, 30, -1, st));
    o.push(sideL());
    return o.join("");
  }

  // ── 標籤：只有目前步驟的標籤顯示（短引線緊貼構件），其餘收起 ──
  const PL = [
    { name: "被動扇", off: [-34, 40], anchor: (st) => LP(frameOf("i", st.i), WI * 0.6, T, 30) },
    { name: "主動扇", off: [40, 36], anchor: (st) => LP(frameOf("a", st.a), WA * 0.55, T, 30) },
    { name: "電磁門扣", off: [44, 26], anchor: () => [79 - 4.8, 40, 28.5] },
    { name: "偵煙探測器", off: [50, -18], anchor: () => [35, 2.2, 93] },
    { name: "自動關門器", off: [-58, -30], anchor: (st) => LP(frameOf("i", st.i), 9, T + 2.4, H - 3) },
    { name: "順位器", off: [-30, -36], anchor: () => [LEV_X, 4.4, H + 2] },
    { name: "蓋縫條", off: [48, 30], anchor: (st) => LP(frameOf("a", st.a), WA + 1, T + 0.7, 40) },
    { name: "氣密條・防火膨脹條", off: [56, 34], anchor: (st) => LP(frameOf("a", st.a), WA, T * 0.5, 22) },
    { name: "未裝順位器：關錯順序", off: [10, -44], anchor: () => [16, 3.5, H + 2] },
  ];
  const PL_OF = [[0, 1], [2, 3], [4], [5], [6], [7], [8]];
  function plinth(active, g = 99, st = null) {
    const lines = [], tags = [];
    for (const i of active) {
      const it = PL[i], vis = clamp01(((st ? st.p : 1) - 0.02) / 0.06);
      const [ax, ay] = at(it.anchor(st));
      const lx = ax + it.off[0], ly = ay + it.off[1], w = it.name.length * 11.6 + 16;
      const op = ` style="opacity:${vis.toFixed(2)}"`;
      lines.push(`<g${op}><path class="pl-line on" d="M${f1(lx)} ${f1(ly)}L${f1(ax)} ${f1(ay)}"/><circle class="pl-dot on" cx="${f1(ax)}" cy="${f1(ay)}" r="2.2"/></g>`);
      tags.push(`<g class="pl on${i === 8 ? " bad" : ""}"${op}><rect x="${f1(lx - w / 2)}" y="${f1(ly - 9)}" width="${f1(w)}" height="18" rx="9"/><text x="${f1(lx)}" y="${f1(ly + 4)}" text-anchor="middle">${it.name}</text></g>`);
    }
    return { lines: "", tags: lines.join("") + tags.join("") };
  }
