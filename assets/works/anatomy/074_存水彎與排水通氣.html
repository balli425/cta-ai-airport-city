@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

.iso-figure{margin:32px 0 36px}

.iso .cl-lead g.seen circle{fill:hsl(205 22% 58%);r:1.8}
.cl-layer{position:absolute;inset:0;pointer-events:none;z-index:1}
.cl-tag{position:absolute;display:none;font:700 12px/1 "Noto Sans TC","Microsoft JhengHei",sans-serif;letter-spacing:.04em;padding:5px 9px 6px;border-radius:999px;background:#174e75;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);white-space:nowrap}
.cl-tag.on{display:block}
.cl-tag[data-side="R"]{transform:translate(0,-50%)}.cl-tag[data-side="L"]{transform:translate(-100%,-50%)}
.cl-tag[data-side="B"]{transform:translate(-50%,-100%)}.cl-tag[data-side="T"]{transform:translate(-50%,0)}
@media (max-width:560px){.cl-tag{font-size:10.5px;padding:3px 7px 4px}}

.iso .c-fl path{fill:none;stroke-linecap:butt;stroke-linejoin:round}
.iso .c-fl .c-fh{stroke:#fff;stroke-width:4.8;stroke-opacity:.92}
.iso .c-fl .c-fd{stroke:hsl(6 60% 46%);stroke-width:2.8;stroke-dasharray:9 4}
.iso .c-fl .c-ah{fill:hsl(6 60% 46%);stroke:#fff;stroke-width:1;stroke-linejoin:round}
.cl-tag{font-size:13px!important}
@media (max-width:560px){.cl-tag{font-size:11px!important}}
.iso .airband{fill:none;stroke:hsl(196 70% 74%);stroke-linecap:round;stroke-linejoin:round}
.iso .c-airchev{fill:hsl(200 70% 34%);stroke:#fff;stroke-width:.5}
.iso .c-bigx{stroke:hsl(6 58% 44%)!important;stroke-width:3.2;stroke-linecap:round}
.iso .pullband{fill:none;stroke:hsl(6 46% 52%);stroke-linecap:round;stroke-linejoin:round}
.iso .c-pullchev{fill:hsl(6 52% 32%);stroke:#fff;stroke-width:.4}
.iso .pulled{fill:hsl(6 46% 50%);stroke:none}
.iso .water.pulling{fill:hsl(6 44% 54%)}
.iso .sealbar{fill:hsl(198 60% 46%);stroke:hsl(200 60% 28%);stroke-width:.5}
.iso .c-ref{stroke:hsl(212 12% 36%)!important;stroke-width:.8}
.iso .c-gaschev{fill:hsl(72 46% 30%);stroke:#fff;stroke-width:.6}
.iso .c-surf{stroke:hsl(200 70% 30%)!important;stroke-width:1.6}
.iso .bell{fill:hsl(210 10% 58%);stroke:hsl(212 12% 28%);stroke-width:.6}
.iso .c-slot{stroke:hsl(212 12% 30%)!important;stroke-width:.7}
.iso .c-arm{stroke:hsl(212 12% 34%)!important;stroke-width:.8}
.iso .c-float{fill:hsl(14 40% 58%);stroke:hsl(14 36% 34%);stroke-width:.5}
.iso .c-drop circle{fill:hsl(198 60% 48%)}
.iso .c-air circle{fill:hsl(196 30% 96%);stroke:hsl(196 40% 46%);stroke-width:.5}
.iso .c-gas circle{fill:hsl(72 34% 38%)}
.iso .odour{fill:hsl(70 30% 46%);stroke:none}
.iso .dialf{fill:hsl(40 20% 96%);stroke:hsl(212 10% 40%);stroke-width:.5}
.iso .c-tick{stroke:hsl(212 10% 36%)!important;stroke-width:.6}
.iso .c-redz{stroke:hsl(6 50% 56%)!important;stroke-width:1.6;fill:none}
.iso .c-needle{stroke:hsl(6 60% 40%)!important;stroke-width:1;stroke-linecap:round}
.vent-sw{position:absolute;right:24px;top:72px;z-index:2;display:flex;border-radius:999px;box-shadow:0 0 0 1px color-mix(in srgb,var(--anatomy-mid) 70%,transparent);background:var(--anatomy-card);overflow:hidden;font:600 12px/1 "Noto Sans TC","Microsoft JhengHei",sans-serif}
.vent-sw button{all:unset;cursor:pointer;padding:7px 12px;color:var(--anatomy-muted)}
.vent-sw button[aria-pressed="true"]{background:#174e75;color:#fff}
.vent-sw button[data-m="1"][aria-pressed="true"]{background:hsl(6 42% 44%)}
.vent-sw button:focus-visible{outline:2px solid #174e75;outline-offset:-2px}

rk="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>橄欖綠點＝排水管內臭氣；右側小錶＝支管負壓（紅區＝會破封）</span></span><span class="iso-caption">浴室剖切，剖切面通過器具中心（管徑放大示意）。洗面盆下為 P 型存水彎、馬桶陶瓷本體內為存水彎、地板落水為鐘型（防臭）存水彎，三者都靠彎管內留住的一段水（水封）隔絕排水管內的臭氣與蟲；排水支管匯入排水立管，洗面盆存水彎下游接通氣管至通氣立管，通氣立管下端以結合通氣管接排水立管。上層沖水時水團沿立管高速落下，經過支管口會把支管內空氣帶走造成負壓：有通氣管時空氣由通氣立管補入，水封只輕微晃動；沒有通氣時，負壓把存水彎的水吸走（誘導虹吸），水位降到彎管頂部以下即破封，臭氣直接進入室內。水封深度一般要求約 5～10 cm，圖中水封深度、負壓值、時間皆為示意；存水彎、通氣管之設置與管徑依建築技術規則建築設備編給水排水系統相關規定及設計圖說。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";

const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;

        }

    return out;
}
function signedArea(points) {

    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];

    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)

    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {

        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

function runsOf(flags, want) {

function extrude(ring, z, height, projection, options = {}) {
