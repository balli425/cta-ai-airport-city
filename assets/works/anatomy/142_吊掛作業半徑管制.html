@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

</style><script>(()=>{const S=[{"name":"危害：吊物下方・迴旋範圍","desc":"吊物會掉落、會擺動；吊物下方與迴旋會掃過的範圍都是危險區。"},{"name":"✕ 人在吊物下方","desc":"沒有管制，人抄近路從吊物下方通過；吊索一滑脫就被擊中。"},{"name":"✕ 手扶吊物・無人指揮","desc":"站在吊物旁用手扶，迴旋急停時吊物擺動，把人撞倒或夾住。"},{"name":"✓ 圍出管制區","desc":"把吊物會經過的範圍用三角錐、連桿圍起來，掛禁止進入標示。"},{"name":"✓ 指派指揮人員","desc":"只由一位指揮人員發信號，站在同時看得到吊物與操作手的位置。"},{"name":"✓ 拉索控制吊物","desc":"吊物繫拉索，人站在吊物外側拉著走，不用手扶、不到吊物下方。"},{"name":"✓ 停穩後才靠近","desc":"吊物緩慢降到定位、停穩後，才靠近解開吊具；其他人在區外等候。"},{"name":"檢查重點","desc":"管制區與標示、指揮人員與信號、吊具與拉索，每次吊掛前確認。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
