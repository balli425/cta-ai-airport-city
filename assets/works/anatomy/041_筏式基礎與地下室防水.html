</style><script>(()=>{const S=[{"name":"打大底 PC","desc":"開挖到底並降水保持乾作業，先打約 10 cm 大底 PC，作為防水層平整的底。"},{"name":"鋪外防水層","desc":"沿外牆線砌保護磚牆，卷材鋪滿 PC 並翻上牆角，接縫搭接，形成連續防水。"},{"name":"防水保護層","desc":"卷材上再鋪約 5 cm 保護層，避免綁筋、走動時刺破防水層。"},{"name":"綁紮上下層鋼筋","desc":"下層雙向筋墊保護層塊，馬椅撐起上層雙向筋，確保有效深度與保護層。"},{"name":"止水帶與插筋","desc":"施工縫放止水鋼板與擋板，柱、外牆插筋先預埋，延長滲水路徑。"},{"name":"分區澆置筏基","desc":"混凝土分區連續澆置並搗實；第二區接續時，止水鋼板一半已埋在第一區。"},{"name":"地下室外牆","desc":"牆底止水鋼板埋入牆中，組模澆牆；拆模後外側防水層搭接上去並貼保護板。"},{"name":"回填・抵抗上浮","desc":"回填後停止降水，水位回升，筏基底受上浮水壓，由結構自重抵抗。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script><style>
