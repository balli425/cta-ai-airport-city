class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>管內流體點依溫度著色：赭紅＝暖、灰藍＝冷；地側為地下 U 型管循環，室內側為主機到風機盤管的冷溫水</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>鑽孔周圍暈色＝孔周地溫變化（夏季暖色、冬季冷色）；地層上緣暈色＝淺層地溫隨季節擺盪</span><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>右上：地層溫度剖面。實線＝目前、點線＝年變化範圍、粉色虛線＝孔壁附近；10 公尺以下趨近恆溫</span></span><span class="iso-caption">示意剖切（地下深度非比例，以截斷帶表示）。地源熱泵以地層為熱源與散熱端：數十至百餘公尺深處的地溫終年大致恆定（約等於當地年平均氣溫，圖中以 23°C 示意），比室外空氣夏涼冬暖，因此熱泵的壓縮比較小、效率較高。夏季供冷時，地側熱交換器作為冷凝器，把室內熱量經 U 型埋管排入地層；冬季四通閥切換，地側熱交換器改作蒸發器，自地層取熱。埋管為高密度聚乙烯 U 型管，鑽孔以導熱灌漿回填。鑽孔數量、深度與間距須依熱回應試驗與全年冷暖負荷計算，若冬夏排熱取熱長期失衡，地溫會逐年偏移、效率下降。鑽孔施工、地下水保護與相關許可依環保與水利主管機關規定及設計圖說。圖中溫度、孔深、COP 與季節時間（一年壓縮為 26 秒）皆為示意。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
