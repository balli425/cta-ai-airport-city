</style><script>(()=>{const S=[{"name":"危害：吊車翻覆","desc":"翻覆多半出在三件事：撐座沒伸好、地盤撐不住、吊重超過額定荷重。"},{"name":"✕ 撐座未伸出","desc":"只靠輪胎支承就側向吊舉，支承寬度不足，一吊起就翻。"},{"name":"✕ 地盤軟弱","desc":"撐座直接壓在回填土或溝蓋上，沒鋪鋼板，一腳下陷整車翻覆。"},{"name":"✕ 超過額定荷重","desc":"伸臂放倒、半徑變大，額定荷重跟著變小；同樣的吊物變成超載。"},{"name":"✓ 鋪鋼板・撐座全伸","desc":"確認地盤承載力，鋪鋼板或墊木，撐座全部伸出，車身調到水平。"},{"name":"✓ 確認吊重與半徑","desc":"先知道吊物多重、要吊多遠，對照額定荷重表，留有餘裕才吊。"},{"name":"✓ 試吊・緩慢吊舉","desc":"離地後先暫停確認穩定，再聽指揮人員信號緩慢吊舉、迴旋。"},{"name":"檢查重點","desc":"撐座與地盤、過負荷預防裝置、吊重與作業半徑，每次作業前確認。"}];let cur=-1;window.ctaStep=function(i){i=Math.max(0,Math.min(S.length-1,i|0));if(i===cur)return;cur=i;const p=document.querySelector(".cta-steps");if(!p)return;p.querySelector("[data-cs-i]").textContent=i+1;p.querySelector("[data-cs-name]").textContent=S[i].name;p.querySelector("[data-cs-desc]").textContent=S[i].desc||"";p.querySelectorAll("li").forEach((li,k)=>li.dataset.s=k===i?"now":(true&&k<i)?"done":"todo");};})();</script></head><body class="iso" data-theme="light"><main class="iso-page"><style>
